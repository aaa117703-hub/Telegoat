<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELEGRAM GOAT - Premier League</title>

    <style>
        @font-face {
            font-family: 'SultanCustom';
            src: url('Sultan.ttf') format('truetype');
        }
        @font-face {
            font-family: 'EnglishCustom';
            src: url('english-font.ttf') format('truetype');
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a0a1a;
            color: #fff;
            font-family: 'SultanCustom', Arial, sans-serif;
            padding: 10px;
        }
        .banner-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            max-height: 150px;
            overflow: hidden;
            border-radius: 12px;
        }
        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .header {
            background: #240024;
            padding: 15px 10px;
            text-align: center;
            border-radius: 12px;
            margin-top: 10px;
        }
        .filter-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        .filter-btn, .filter-select {
            font-family: 'SultanCustom', Arial, sans-serif;
            background: #38003c;
            color: #fff;
            border: 1px solid #5a055a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #5a055a;
            border-color: #ff005a;
        }
        .filter-select {
            appearance: none;
            padding: 6px 14px;
            font-family: 'SultanCustom', Arial, sans-serif;
        }
        .round-nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 5px 0;
        }
        .round-indicator {
            font-family: 'EnglishCustom', Arial, sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
        }
        .nav-arrow-btn {
            background: #38003c;
            color: #fff;
            border: 1px solid #5a055a;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            font-family: 'SultanCustom', Arial, sans-serif;
        }
        .nav-arrow-btn:hover {
            background: #ff005a;
        }
        .main-container { max-width: 750px; margin: 0 auto; padding: 0 5px; }
        .fixture-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 8px;
            margin-bottom: 6px;
            background: #2f012f;
            border-radius: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .team-box {
            display: flex;
            align-items: center;
            width: 38%;
            font-family: 'EnglishCustom', Arial, sans-serif;
            font-size: 12px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
        }
        .team-box.home { justify-content: flex-end; text-align: right; }
        .team-box.away { justify-content: flex-start; text-align: left; }
        .team-box img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            margin: 0 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            padding: 2px;
        }
        .match-score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 24%;
            background: #1a001a;
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid #5a055a;
        }
        .score-display {
            font-family: 'EnglishCustom', Arial, sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #fff;
        }
        .score-input {
            font-family: 'EnglishCustom', Arial, sans-serif;
            width: 32px;
            height: 24px;
            text-align: center;
            font-size: 12px;
            font-weight: 900;
            background: #2f012f;
            color: #fff;
            border: 1px solid #ff005a;
            border-radius: 4px;
            outline: none;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .standings-card { background: #2f012f; border-radius: 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 12px; color: #fff; }
        th { 
            font-family: 'EnglishCustom', Arial, sans-serif;
            background: #1a001a; 
            color: #a892a8; 
            padding: 10px 4px; 
            font-weight: 800; 
            border-bottom: 1px solid #5a055a; 
        }
        td { 
            font-family: 'EnglishCustom', Arial, sans-serif;
            padding: 8px 4px; 
            border-bottom: 1px solid #5a055a; 
            font-weight: 800; 
        }
        .team-cell { 
            font-family: 'EnglishCustom', Arial, sans-serif;
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            font-weight: 800; 
            text-transform: uppercase; 
        }
        .team-cell img { 
            width: 20px; 
            height: 20px; 
            margin-left: 6px; 
            object-fit: contain; 
            background: rgba(255,255,255,0.1); 
            border-radius: 50%; 
            padding: 2px; 
        }
        .export-area { padding: 8px; background: #1a0a1a; border-radius: 8px; }
        .btn-ar { font-family: 'SultanCustom', Arial, sans-serif; }
        .btn-en { font-family: 'EnglishCustom', Arial, sans-serif; }
    </style>
</head>

        // ========== APP STATE ==========
        let currentRound = 1;
        let activeTab = 'fixtures';
        let editMode = false;
        let scoresStorage = JSON.parse(localStorage.getItem('fpl_scores')) || {};

        const initialBasePoints = {};
        Object.keys(teamsMap).forEach(k => initialBasePoints[k] = { gf: 0, pts: 0 });

        function initRoundDropdown() {
            const sel = document.getElementById('roundSelect');
            sel.innerHTML = '';
            for (let i = 1; i <= 38; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `الجولة ${i}`;
                if (i === currentRound) opt.selected = true;
                sel.appendChild(opt);
            }
        }

        function selectRound(val) {
            currentRound = parseInt(val);
            renderFixtures();
        }

        function changeRound(step) {
            currentRound += step;
            if (currentRound < 1) currentRound = 1;
            if (currentRound > 38) currentRound = 38;
            renderFixtures();
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            if (tab === 'fixtures') {
                document.getElementById('fixturesTab').classList.add('active');
                renderFixtures();
            } else {
                document.getElementById('standingsTab').classList.add('active');
                renderStandings();
            }
        }

        function toggleEditMode() {
            if (!editMode) {
                let pass = prompt("أدخل رمز الحماية:");
                if (pass === "1999") {
                    editMode = true;
                    document.querySelector('button[onclick="toggleEditMode()"]').innerText = "حفظ";
                    renderFixtures();
                } else if (pass !== null) alert("الرمز غير صحيح!");
            } else {
                editMode = false;
                document.querySelector('button[onclick="toggleEditMode()"]').innerText = "تعديل";
                renderFixtures();
                renderStandings();
            }
        }

        function updateScore(round, idx, type, val) {
            if (val === '') delete scoresStorage[`r${round}_m${idx}_${type}`];
            else scoresStorage[`r${round}_m${idx}_${type}`] = val;
            localStorage.setItem('fpl_scores', JSON.stringify(scoresStorage));
        }

        function renderFixtures() {
            const list = document.getElementById('fixturesList');
            const title = document.getElementById('currentRoundTitle');
            title.innerText = `MATCHWEEK ${currentRound}`;
            document.getElementById('roundSelect').value = currentRound;
            list.innerHTML = '';

            let matches = matchweeks[currentRound] || [];
            if (matches.length === 0) {
                list.innerHTML = `<div style="text-align:center;padding:30px;color:#888;font-size:16px;">لا توجد مواجهات</div>`;
                return;
            }

            matches.forEach((match, idx) => {
                let home = teamsMap[match[0]] || { name: match[0], logo: '' };
                let away = teamsMap[match[1]] || { name: match[1], logo: '' };

                let hScore = scoresStorage[`r${currentRound}_m${idx}_home`] ?? '';
                let aScore = scoresStorage[`r${currentRound}_m${idx}_away`] ?? '';

                let scoreHTML = editMode ? `
                    <input class="score-input" type="number" value="${hScore}" placeholder="0" oninput="updateScore(${currentRound},${idx},'home',this.value)">
                    <span style="font-weight:900;color:#fff;">:</span>
                    <input class="score-input" type="number" value="${aScore}" placeholder="0" oninput="updateScore(${currentRound},${idx},'away',this.value)">
                ` : `
                    <span class="score-display">${hScore !== '' ? hScore : '-'}</span>
                    <span style="font-weight:900;color:#ff005a;">VS</span>
                    <span class="score-display">${aScore !== '' ? aScore : '-'}</span>
                `;

                list.innerHTML += `
                    <div class="fixture-row">
                        <div class="team-box home">
                            <span>${home.name}</span>
                            <img src="${home.logo}" onerror="this.style.display='none'">
                        </div>
                        <div class="match-score-center">${scoreHTML}</div>
                        <div class="team-box away">
                            <img src="${away.logo}" onerror="this.style.display='none'">
                            <span>${away.name}</span>
                        </div>
                    </div>
                `;
            });
        }

        function calculateStandings() {
            let calc = {};
            for (let k in initialBasePoints) calc[k] = { key: k, gf: 0, pts: 0 };
            for (let r in matchweeks) {
                matchweeks[r].forEach((m, idx) => {
                    let h = m[0], a = m[1];
                    let hs = scoresStorage[`r${r}_m${idx}_home`];
                    let as_ = scoresStorage[`r${r}_m${idx}_away`];
                    if (hs !== undefined && as_ !== undefined && hs !== '' && as_ !== '') {
                        hs = parseFloat(hs); as_ = parseFloat(as_);
                        calc[h].gf += hs; calc[a].gf += as_;
                        if (hs > as_) calc[h].pts += 3;
                        else if (as_ > hs) calc[a].pts += 3;
                        else { calc[h].pts += 1; calc[a].pts += 1; }
                    }
                });
            }
            return Object.values(calc).sort((a,b) => b.pts - a.pts || b.gf - a.gf);
        }

                            <img src="${info.logo}" onerror="this.style.display='none'">
