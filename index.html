<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @font-face {
            font-family: 'EnglishCustom';
            src: url('english-font.ttf') format('truetype');
        }

        :root {
            --bg-main: #0d0614;
            --bg-card: #160b24;
            --pl-pink: #ff005a;
            --pl-purple: #38003c;
            --text-white: #ffffff;
            --border-color: #3b1854;
            --font-en: 'EnglishCustom', 'Arial', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            padding-bottom: 50px;
            font-family: var(--font-en);
        }

        /* ===== BANNER ===== */
        .banner-container {
            width: 100%;
            max-width: 800px;
            margin: 15px auto 0 auto;
            height: 130px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid var(--pl-pink);
            box-shadow: 0 0 30px rgba(255, 0, 90, 0.6), 0 0 60px rgba(255, 0, 90, 0.3);
            background: linear-gradient(135deg, #1a0a2e, #2d1b4e);
        }
        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .banner-fallback {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px var(--pl-pink);
            letter-spacing: 3px;
        }

        /* ===== HEADER ===== */
        .header {
            padding: 15px 10px;
            text-align: center;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .filter-btn,
        .filter-select {
            background: var(--bg-card);
            color: var(--text-white);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            outline: none;
            transition: all 0.3s ease;
            font-family: var(--font-en);
        }
        .filter-btn:hover,
        .filter-btn.active {
            background: var(--pl-purple);
            border-color: var(--pl-pink);
            box-shadow: 0 0 15px rgba(255, 0, 90, 0.3);
        }
        .filter-select {
            appearance: none;
            padding-right: 20px;
            padding-left: 30px;
            font-family: var(--font-en);
        }

        /* Admin-only hidden by default */
        .admin-only {
            display: none !important;
        }
        .admin-only.visible {
            display: inline-flex !important;
        }

        /* ===== ROUND NAV ===== */
        .round-nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0 15px 0;
        }
        .round-indicator {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-white);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 8px;
            border: 1px dashed transparent;
            transition: 0.2s;
            font-family: var(--font-en);
        }
        .round-indicator:hover {
            border-color: var(--pl-pink);
            background: rgba(255, 0, 90, 0.1);
        }
        .nav-arrow-btn {
            background: var(--bg-card);
            color: var(--text-white);
            border: 1px solid var(--border-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            font-family: var(--font-en);
        }
        .nav-arrow-btn:hover {
            background: var(--pl-pink);
            border-color: var(--pl-pink);
        }

        /* ===== MAIN CONTENT ===== */
        .main-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 10px;
        }

        .capture-box {
            background: linear-gradient(135deg, #1e0d33 0%, #120621 100%);
            padding: 25px 15px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 100%;
        }
        .card-box-inner {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        .card-header-title {
            font-family: var(--font-en);
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            color: #38003c;
            margin-bottom: 20px;
            letter-spacing: 2px;
            border-bottom: 3px solid #ff005a;
            padding-bottom: 8px;
        }

        /* ===== FIXTURES ROW ===== */
        .fixture-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 10px;
            margin-bottom: 8px;
            background: #fcf9ff;
            border-radius: 8px;
            border-bottom: 2px solid #e0c2ff;
        }
        .team-box {
            font-family: var(--font-en);
            display: flex;
            align-items: center;
            width: 40%;
            font-size: 16px;
            font-weight: 950;
            color: #38003c;
            text-transform: uppercase;
        }
        .team-box.home {
            justify-content: flex-end;
            text-align: right;
        }
        .team-box.away {
            justify-content: flex-start;
            text-align: left;
        }
        .team-box img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            margin: 0 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            padding: 2px;
        }
        .match-score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 20%;
            background: #38003c;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ff005a;
        }
        .score-display {
            font-family: var(--font-en);
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
        }
        .score-input {
            font-family: var(--font-en);
            width: 50px;
            height: 34px;
            text-align: center;
            font-size: 16px;
            font-weight: 900;
            background: #160b24;
            color: #ffffff;
            border: 1px solid #ff005a;
            border-radius: 6px;
            outline: none;
        }

        /* ===== STANDINGS TABLE ===== */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: center;
        }
        th {
            font-family: var(--font-en);
            background-color: #38003c;
            color: #ffffff;
            padding: 14px 8px;
            font-weight: 900;
            border-bottom: 3px solid #ff005a;
            font-size: 15px;
        }
        td {
            font-family: var(--font-en);
            padding: 12px 8px;
            border-bottom: 1px solid #e0c2ff;
            font-weight: 900;
            font-size: 15px;
            color: #38003c;
        }
        .team-cell {
            font-family: var(--font-en);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-weight: 900;
            text-transform: uppercase;
            color: #38003c;
            font-size: 16px;
        }
        .team-cell img {
            width: 28px;
            height: 28px;
            margin-left: 12px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            padding: 2px;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* ===== SPINNER ===== */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #38003c;
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: var(--font-en);
            font-weight: 900;
            font-size: 15px;
            border: 2px solid #ff005a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="banner-container">
        <img src="header.png" alt="Premier League" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'banner-fallback\'>⚽ PREMIER LEAGUE</div>'">
    </div>

    <div class="header">
        <div class="filter-bar">
            <button class="filter-btn active" id="fixturesTabBtn" onclick="switchTab('fixtures')">Fixtures</button>
            <button class="filter-btn" id="standingsTabBtn" onclick="switchTab('standings')">Standings</button>

            <select class="filter-select" id="roundSelect" onchange="selectRound(this.value)"></select>

            <button class="filter-btn admin-only" id="editToggleBtn" onclick="toggleEditMode()">Live Edit</button>
            <button class="filter-btn admin-only" id="saveAllBtn" onclick="saveAllCurrentRound()">Save Matches</button>
            <button class="filter-btn admin-only" onclick="downloadAsImage()">Save to Album</button>
        </div>

        <div class="round-nav-container">
            <button class="nav-arrow-btn" onclick="changeRound(-1)">‹</button>
            <div class="round-indicator" id="currentRoundTitle" ondblclick="unlockAdmin()">MATCHWEEK 1</div>
            <button class="nav-arrow-btn" onclick="changeRound(1)">›</button>
        </div>
    </div>

    <div class="main-container">

        <div id="fixturesTab" class="tab-content active">
            <div id="captureFixtures" class="capture-box">
                <div class="card-box-inner">
                    <div class="card-header-title" id="fixturesHeaderTitle">MATCHWEEK 1</div>
                    <div id="fixturesList"></div>
                </div>
            </div>
        </div>

        <div id="standingsTab" class="tab-content">
            <div id="captureStandings" class="capture-box">
                <div class="card-box-inner">
                    <div class="card-header-title" id="standingsHeaderTitle">STANDINGS - GAMEWEEK 1</div>
                    <table>
                        <thead>
                            <tr>
                                <th style="width:10%;">Pos</th>
                                <th style="text-align:right;padding-right:20px;width:50%;">Club</th>
                                <th style="width:20%;">GF</th>
                                <th style="width:20%;">Pts</th>
                            </tr>
                        </thead>
                        <tbody id="standingsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        // 1. FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            databaseURL: "https://telegram-goat-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // ============================================================
        // 2. APP STATE

        let editMode = isAdmin;

        // ============================================================
        // 5. HELPER FUNCTIONS
        // ============================================================
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => el.classList.remove('show'), 2500);
        }

        function checkAdminStatus() {
            document.querySelectorAll('.admin-only').forEach(el => {
                el.classList.toggle('visible', isAdmin);
            });
            if (isAdmin) {
                document.getElementById('editToggleBtn').textContent = editMode ? "Lock Edit" : "Live Edit";
            }
        }

        // ============================================================
        // 6. UNLOCK ADMIN
        // ============================================================
        function unlockAdmin() {
            if (isAdmin) {
                editMode = !editMode;
                document.getElementById('editToggleBtn').textContent = editMode ? "Lock Edit" : "Live Edit";
                renderFixtures();
                return;
            }
            const pass = prompt("Enter admin password:");
            if (pass === "1999") {
                isAdmin = true;
                editMode = true;
                localStorage.setItem('fpl_admin', 'true');
                checkAdminStatus();
                renderFixtures();
                showToast("✅ Admin unlocked!");
            } else if (pass !== null) {
                alert("Wrong password!");
            }
        }

        function toggleEditMode() {
            if (!isAdmin) return;
            editMode = !editMode;
            document.getElementById('editToggleBtn').textContent = editMode ? "Lock Edit" : "Live Edit";
            renderFixtures();
        }

        // ============================================================
        // 7. FIREBASE LISTENER
        // ============================================================
        db.ref('fpl_scores').on('value', (snapshot) => {
            scoresStorage = snapshot.val() || {};
            renderFixtures();
            if (activeTab === 'standings') {
                renderStandings();
            }
        });

        // ============================================================
        // 8. RENDER FIXTURES
        // ============================================================
        function renderFixtures() {
            const list = document.getElementById('fixturesList');
            const title = document.getElementById('currentRoundTitle');
            const headerTitle = document.getElementById('fixturesHeaderTitle');

            title.textContent = `MATCHWEEK ${currentRound}`;
            headerTitle.textContent = `MATCHWEEK ${currentRound}`;

            const select = document.getElementById('roundSelect');
            select.value = currentRound;

            const matches = matchweeks[currentRound] || [];
            if (!matches.length) {
                list.innerHTML = `<div style="text-align:center;padding:30px;color:#888;font-size:18px;">No fixtures available</div>`;
                return;
            }

            let html = '';
            matches.forEach((pair, idx) => {
                const homeKey = pair[0];
                const awayKey = pair[1];
                const home = teamsMap[homeKey] || { name: homeKey, logo: '' };
                const away = teamsMap[awayKey] || { name: awayKey, logo: '' };

                const hScore = scoresStorage[`r${currentRound}_m${idx}_home`] ?? '';
                const aScore = scoresStorage[`r${currentRound}_m${idx}_away`] ?? '';

                let scoreHTML;
                if (editMode && isAdmin) {
                    scoreHTML = `
                        <input class="score-input" type="number" id="home_r${currentRound}_m${idx}" value="${hScore}" placeholder="0">
                        <span style="font-weight:900;color:#fff;">:</span>
                        <input class="score-input" type="number" id="away_r${currentRound}_m${idx}" value="${aScore}" placeholder="0">
                    `;
                } else {
                    scoreHTML = `
                        <span class="score-display">${hScore !== '' ? hScore : '-'}</span>
                        <span style="font-weight:900;color:#ff005a;font-size:16px;">VS</span>
                        <span class="score-display">${aScore !== '' ? aScore : '-'}</span>
                    `;
                }

                html += `
                    <div class="fixture-row">
                        <div class="team-box home">
                            <span>${home.name}</span>
                            <img src="${home.logo}" onerror="this.style.display='none'">
                        </div>
                        <div class="match-score-center">${scoreHTML}</div>
                        <div class="team-box away">
                            <img src="${away.logo}" onerror="this.style.display='none'">
                            <span>${away.name}</span>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        // ============================================================
        // 9. RENDER STANDINGS
        // ============================================================
        function renderStandings() {
            const tbody = document.getElementById('standingsBody');
            const header = document.getElementById('standingsHeaderTitle');
            header.textContent = `STANDINGS - GAMEWEEK ${currentRound}`;

            let calc = {};
            for (let key in teamsMap) {
                calc[key] = { key: key, gf: 0, pts: 0 };
            }

            for (let r = 1; r <= currentRound; r++) {
                const roundMatches = matchweeks[r];
                if (!roundMatches) continue;
                roundMatches.forEach((pair, idx) => {
                    const hKey = pair[0];
                    const aKey = pair[1];
                    const hVal = scoresStorage[`r${r}_m${idx}_home`];
                    const aVal = scoresStorage[`r${r}_m${idx}_away`];
                    if (hVal !== undefined && aVal !== undefined && hVal !== '' && aVal !== '') {
                        const hS = parseFloat(hVal);
                        const aS = parseFloat(aVal);
                        calc[hKey].gf += hS;
                        calc[aKey].gf += aS;
                        if (hS > aS) calc[hKey].pts += 3;
                        else if (aS > hS) calc[aKey].pts += 3;
                        else { calc[hKey].pts += 1; calc[aKey].pts += 1; }
                    }
                });
            }

            const sorted = Object.values(calc).sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                return b.gf - a.gf;
            });

            tbody.innerHTML = '';
            sorted.forEach((team, i) => {
                const info = teamsMap[team.key] || { name: team.key, logo: '' };
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:900;">${i + 1}</td>
                        <td class="team-cell">
                            <img src="${info.logo}" onerror="this.style.display='none'">
                            ${info.name}
                        </td>
                        <td>${team.gf}</td>
                        <td style="color:#ff005a;font-size:17px;">${team.pts}</td>
                    </tr>
                `;
            });
        }

        // ============================================================
        // 10. NAVIGATION
        // ============================================================
        function initRoundDropdown() {
            const select = document.getElementById('roundSelect');
            select.innerHTML = '';
            for (let i = 1; i <= 38; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Gameweek ${i}`;
                if (i === currentRound) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function selectRound(val) {
            currentRound = parseInt(val);
            renderFixtures();
            if (activeTab === 'standings') renderStandings();
        }

        function changeRound(step) {
            currentRound = Math.min(38, Math.max(1, currentRound + step));
            renderFixtures();
            if (activeTab === 'standings') renderStandings();
        }

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('fixturesTabBtn').classList.toggle('active', tab === 'fixtures');
            document.getElementById('standingsTabBtn').classList.toggle('active', tab === 'standings');
            document.getElementById('fixturesTab').classList.toggle('active', tab === 'fixtures');
            document.getElementById('standingsTab').classList.toggle('active', tab === 'standings');
            if (tab === 'standings') renderStandings();
        }

        // ============================================================
        // 11. SAVE MATCHES TO FIREBASE
        // ============================================================
        function saveAllCurrentRound() {
            if (!isAdmin || isSaving) return;
            const btn = document.getElementById('saveAllBtn');
            const originalHTML = btn.innerHTML;

            isSaving = true;
            btn.innerHTML = `<span class="spinner"></span>`;
            btn.disabled = true;

            const matches = matchweeks[currentRound] || [];
            const updates = {};
            matches.forEach((_, idx) => {
                const homeInput = document.getElementById(`home_r${currentRound}_m${idx}`);
                const awayInput = document.getElementById(`away_r${currentRound}_m${idx}`);
                if (homeInput && awayInput) {
                    updates[`r${currentRound}_m${idx}_home`] = homeInput.value;
                    updates[`r${currentRound}_m${idx}_away`] = awayInput.value;
                }
            });

            db.ref('fpl_scores').update(updates, (error) => {
                isSaving = false;
                if (error) {
                    console.error("Firebase Save Error:", error);
                    alert("❌ Failed to save! Check console for details.\nMake sure Firebase Rules allow write.");
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                } else {
                    btn.innerHTML = `✓`;
                    showToast("✅ Saved successfully!");
                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                        btn.disabled = false;
                    }, 1200);
                    switchTab('standings');
                    renderStandings();
                }
            });
        }

        // ============================================================
        // 12. DOWNLOAD IMAGE
        // ============================================================
        function downloadAsImage() {
            if (!isAdmin) return;
            const targetId = activeTab === 'fixtures' ? 'captureFixtures' : 'captureStandings';
            const element = document.getElementById(targetId);

            html2canvas(element, {
                backgroundColor: null,
                scale: 3,
                useCORS: true,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = activeTab === 'fixtures' ? `Matchweek_${currentRound}.png` : `Standings_GW${currentRound}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast("📸 Image downloaded!");
            }).catch((err) => {
                console.error("Image capture error:", err);
                alert("Failed to generate image.");
            });
        }

        // ============================================================
        // 13. INIT
        // ============================================================
        checkAdminStatus();
        initRoundDropdown();
        renderFixtures();
    </script>
</body>
</html>
