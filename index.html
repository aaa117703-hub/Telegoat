<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELEGRAM GOAT - Premier League</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- html2canvas لتصدير الصفحة كصورة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --pl-dark-bg: #240024;
            --pl-dark-card: #2f012f;
            --pl-pink: #ff005a;
            --pl-green: #00ff85;
            --pl-red: #e90052;
            --text-white: #ffffff;
            --border-dark: #3f033f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--pl-dark-bg); color: var(--text-white); padding-bottom: 50px; }

        .header { 
            background-color: var(--pl-dark-bg); 
            color: #ffffff; 
            padding: 20px 15px; 
            text-align: center; 
            border-bottom: 1px solid var(--border-dark); 
        }
        .league-title { 
            font-size: 26px; 
            font-weight: 900; 
            letter-spacing: 2px; 
            color: #ffffff;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .action-bar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

        .btn { 
            background: transparent; 
            color: #ffffff; 
            border: 2px solid #ffffff; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 13px; 
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover, .btn.active-btn { background: #ffffff; color: var(--pl-dark-bg); }
        .btn-red { border-color: var(--pl-red); background: var(--pl-red); color: #ffffff; }
        .btn-red:hover { background: #ff2a75; color: #ffffff; }

        .main-container { max-width: 750px; margin: 20px auto; padding: 0 12px; }

        .round-selector { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            padding: 10px; 
            border-bottom: 1px solid var(--border-dark);
        }

        .fixture-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 14px 10px;
            margin-bottom: 8px;
            background: var(--pl-dark-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .team-box {
            display: flex;
            align-items: center;
            width: 38%;
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
        }
        .team-box.home { justify-content: flex-end; text-align: right; }
        .team-box.away { justify-content: flex-start; text-align: left; }
        
        .team-box img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin: 0 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            padding: 2px;
        }

        .match-score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 24%;
        }

        .score-input {
            width: 45px;
            height: 35px;
            text-align: center;
            font-size: 16px;
            font-weight: 900;
            background: #ffffff;
            color: var(--pl-dark-bg);
            border: none;
            border-radius: 4px;
            outline: none;
        }

        .export-area { padding: 15px; background: var(--pl-dark-bg); border-radius: 12px; }

        .standings-card { background: var(--pl-dark-bg); border-radius: 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; color: #ffffff; }
        th { background-color: var(--pl-dark-card); color: #a892a8; padding: 14px 8px; font-weight: 800; border-bottom: 1px solid var(--border-dark); }
        td { padding: 12px 8px; border-bottom: 1px solid var(--border-dark); font-weight: 800; }
        
        .team-cell { display: flex; align-items: center; justify-content: flex-start; font-weight: 800; text-transform: uppercase; }
        .team-cell img { 
            width: 28px; 
            height: 28px; 
            margin-left: 10px; 
            object-fit: contain;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            padding: 2px;
        }

        .pts-col { color: var(--pl-green); font-weight: 900; }
        .gf-col { color: #ffffff; font-weight: 800; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <div class="league-title">TELEGRAM GOAT</div>
        <div class="action-bar">
            <button class="btn active-btn" onclick="switchTab('fixtures', this)">🎮 المواجهات</button>
            <button class="btn" onclick="switchTab('standings', this)">📊 الترتيب العام</button>
            <button class="btn btn-red" onclick="downloadAsImage()">📥 حفظ كصورة</button>
        </div>
    </div>

    <div class="main-container">

        <!-- Fixtures Tab -->
        <div id="fixturesTab" class="tab-content active">
            <div class="round-selector">
                <button class="btn" onclick="changeRound(-1)">◀ الجولة السابقة</button>
                <span id="currentRoundTitle" style="font-weight: 900; font-size: 18px;">MATCHWEEK 1</span>
                <button class="btn" onclick="changeRound(1)">الجولة التالية ▶</button>
            </div>
            <div id="captureFixtures" class="export-area">
                <div id="fixturesList"></div>
            </div>
        </div>

        <!-- Standings Tab -->
        <div id="standingsTab" class="tab-content">
            <div id="captureStandings" class="export-area">
                <div class="standings-card">
                    <table>
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th style="text-align: right; padding-right: 20px;">Club</th>
                                <th>GF</th>
                                <th>Pts</th>
                            </tr>
                        </thead>
                        <tbody id="standingsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        const teamsMap = {
            "ARSENAL": { name: "Arsenal", logo: "arsenal.png.WEBP" },
            "ASTON VILLA": { name: "Aston Villa", logo: "aston_villa.png.WEBP" },
            "BOURNEMOUTH": { name: "Bournemouth", logo: "bournemouth.png.WEBP" },
            "BRENTFORD": { name: "Brentford", logo: "brentford.png.PNG" },
            "BRIGHTON": { name: "Brighton", logo: "brighton.png.WEBP" },
            "CHELSEA": { name: "Chelsea", logo: "chelsea.png.WEBP" },
            "COVENTRY": { name: "Coventry", logo: "coventry.png.WEBP" },
            "CRYSTAL PALACE": { name: "Crystal Palace", logo: "crystal_palace.png.WEBP" },
            "EVERTON": { name: "Everton", logo: "everton.png.WEBP" },
            "FULHAM": { name: "Fulham", logo: "fulham.png.WEBP" },
            "HULL": { name: "Hull", logo: "hull.png.WEBP" },
            "IPSWICH": { name: "Ipswich", logo: "ipswich.png.WEBP" },
            "LEEDS": { name: "Leeds", logo: "leeds.png.WEBP" },
            "LIVERPOOL": { name: "Liverpool", logo: "liverpool.png.WEBP" },
            "MAN CITY": { name: "Man City", logo: "man_city.png.WEBP" },
            "MAN UTD": { name: "Man Utd", logo: "man_utd.png.WEBP" },
            "NEWCASTLE": { name: "Newcastle", logo: "newcastle.png.WEBP" },
            "NOTTINGHAM": { name: "Nott'm Forest", logo: "forest.png.PNG" },
            "SUNDERLAND": { name: "Sunderland", logo: "sunderland.png.WEBP" },
            "TOTTENHAM": { name: "Spurs", logo: "tottenham.png.WEBP" }
        };

        let teamsData = JSON.parse(localStorage.getItem('fpl_teams_data')) || [
            { key: "LIVERPOOL", gf: 6, pts: 1787 },
            { key: "BRIGHTON", gf: 6, pts: 1784 },
            { key: "ARSENAL", gf: 6, pts: 1761 },
            { key: "TOTTENHAM", gf: 6, pts: 1718 },
            { key: "BOURNEMOUTH", gf: 6, pts: 1683 },
            { key: "FULHAM", gf: 6, pts: 1680 },
            { key: "MAN UTD", gf: 6, pts: 1669 },
            { key: "LEEDS", gf: 3, pts: 1741 },
            { key: "CRYSTAL PALACE", gf: 3, pts: 1699 },
            { key: "MAN CITY", gf: 3, pts: 1687 },
            { key: "BRENTFORD", gf: 3, pts: 1683 },
            { key: "HULL", gf: 3, pts: 1677 },
            { key: "SUNDERLAND", gf: 3, pts: 1637 },
            { key: "NEWCASTLE", gf: 0, pts: 1654 },
            { key: "EVERTON", gf: 0, pts: 1653 },
            { key: "CHELSEA", gf: 0, pts: 1622 },
            { key: "COVENTRY", gf: 0, pts: 1606 },
            { key: "NOTTINGHAM", gf: 0, pts: 1574 },
            { key: "ASTON VILLA", gf: 0, pts: 1558 },
            { key: "IPSWICH", gf: 0, pts: 1557 }
        ];

        const matchweeks = {
            1: [ ["ARSENAL", "COVENTRY"], ["HULL", "MAN UTD"], ["EVERTON", "CRYSTAL PALACE"], ["IPSWICH", "SUNDERLAND"], ["NOTTINGHAM", "LEEDS"], ["BRENTFORD", "TOTTENHAM"], ["BRIGHTON", "ASTON VILLA"], ["MAN CITY", "BOURNEMOUTH"], ["NEWCASTLE", "LIVERPOOL"], ["FULHAM", "CHELSEA"] ],
            2: [ ["BOURNEMOUTH", "EVERTON"], ["ASTON VILLA", "ARSENAL"], ["CHELSEA", "BRIGHTON"], ["COVENTRY", "HULL"], ["CRYSTAL PALACE", "MAN CITY"], ["LEEDS", "BRENTFORD"], ["LIVERPOOL", "NOTTINGHAM"], ["MAN UTD", "IPSWICH"], ["SUNDERLAND", "FULHAM"], ["TOTTENHAM", "NEWCASTLE"] ],
            3: [ ["ARSENAL", "CHELSEA"], ["BRENTFORD", "SUNDERLAND"], ["BRIGHTON", "LEEDS"], ["EVERTON", "MAN UTD"], ["FULHAM", "CRYSTAL PALACE"], ["HULL", "ASTON VILLA"], ["IPSWICH", "LIVERPOOL"], ["MAN CITY", "COVENTRY"], ["NEWCASTLE", "BOURNEMOUTH"], ["NOTTINGHAM", "TOTTENHAM"] ],
            4: [ ["BOURNEMOUTH", "BRENTFORD"], ["ASTON VILLA", "NOTTINGHAM"], ["CHELSEA", "HULL"], ["COVENTRY", "BRIGHTON"], ["CRYSTAL PALACE", "IPSWICH"], ["LEEDS", "NEWCASTLE"], ["LIVERPOOL", "FULHAM"], ["MAN UTD", "MAN CITY"], ["SUNDERLAND", "ARSENAL"], ["TOTTENHAM", "EVERTON"] ],
            5: [ ["BOURNEMOUTH", "LIVERPOOL"], ["BRENTFORD", "CHELSEA"], ["BRIGHTON", "ARSENAL"], ["EVERTON", "IPSWICH"], ["FULHAM", "MAN UTD"], ["LEEDS", "CRYSTAL PALACE"], ["MAN CITY", "SUNDERLAND"], ["NEWCASTLE", "HULL"], ["NOTTINGHAM", "COVENTRY"], ["TOTTENHAM", "ASTON VILLA"] ],
            6: [ ["ARSENAL", "LEEDS"], ["ASTON VILLA", "BRENTFORD"], ["CHELSEA", "BOURNEMOUTH"], ["COVENTRY", "NEWCASTLE"], ["CRYSTAL PALACE", "NOTTINGHAM"], ["HULL", "EVERTON"], ["IPSWICH", "FULHAM"], ["LIVERPOOL", "MAN CITY"], ["MAN UTD", "TOTTENHAM"], ["SUNDERLAND", "BRIGHTON"] ],
            7: [ ["BOURNEMOUTH", "SUNDERLAND"], ["BRENTFORD", "LIVERPOOL"], ["BRIGHTON", "CRYSTAL PALACE"], ["EVERTON", "CHELSEA"], ["FULHAM", "HULL"], ["LEEDS", "MAN UTD"], ["MAN CITY", "IPSWICH"], ["NEWCASTLE", "ASTON VILLA"], ["NOTTINGHAM", "ARSENAL"], ["TOTTENHAM", "COVENTRY"] ],
            8: [ ["ARSENAL", "EVERTON"], ["ASTON VILLA", "MAN CITY"], ["CHELSEA", "TOTTENHAM"], ["COVENTRY", "FULHAM"], ["CRYSTAL PALACE", "NEWCASTLE"], ["HULL", "BRENTFORD"], ["IPSWICH", "NOTTINGHAM"], ["LIVERPOOL", "BRIGHTON"], ["MAN UTD", "BOURNEMOUTH"], ["SUNDERLAND", "LEEDS"] ],
            9: [ ["BOURNEMOUTH", "LEEDS"], ["BRENTFORD", "NOTTINGHAM"], ["CHELSEA", "MAN UTD"], ["COVENTRY", "SUNDERLAND"], ["HULL", "IPSWICH"], ["LIVERPOOL", "ARSENAL"], ["MAN CITY", "BRIGHTON"], ["NEWCASTLE", "EVERTON"], ["TOTTENHAM", "CRYSTAL PALACE"] ],
            10: [ ["ARSENAL", "HULL"], ["BRIGHTON", "BRENTFORD"], ["CRYSTAL PALACE", "LIVERPOOL"], ["EVERTON", "COVENTRY"], ["FULHAM", "NEWCASTLE"], ["IPSWICH", "BOURNEMOUTH"], ["MAN UTD", "ASTON VILLA"], ["NOTTINGHAM", "MAN CITY"], ["SUNDERLAND", "CHELSEA"] ],
            11: [ ["BRENTFORD", "EVERTON"], ["CHELSEA", "LEEDS"], ["COVENTRY", "CRYSTAL PALACE"], ["HULL", "BRIGHTON"], ["LIVERPOOL", "MAN UTD"], ["MAN CITY", "FULHAM"], ["NEWCASTLE", "ARSENAL"], ["TOTTENHAM", "IPSWICH"] ],
            12: [ ["ARSENAL", "MAN CITY"], ["BRIGHTON", "NEWCASTLE"], ["CRYSTAL PALACE", "HULL"], ["EVERTON", "LIVERPOOL"], ["FULHAM", "BOURNEMOUTH"], ["IPSWICH", "ASTON VILLA"], ["LEEDS", "COVENTRY"], ["MAN UTD", "BRENTFORD"], ["NOTTINGHAM", "CHELSEA"], ["SUNDERLAND", "TOTTENHAM"] ],
            13: [ ["BOURNEMOUTH", "BRIGHTON"], ["ASTON VILLA", "EVERTON"], ["BRENTFORD", "ARSENAL"], ["CHELSEA", "CRYSTAL PALACE"], ["COVENTRY", "IPSWICH"], ["HULL", "NOTTINGHAM"], ["LIVERPOOL", "SUNDERLAND"], ["MAN CITY", "LEEDS"], ["NEWCASTLE", "MAN UTD"], ["TOTTENHAM", "FULHAM"] ],
            14: [ ["BOURNEMOUTH", "HULL"], ["ASTON VILLA", "CRYSTAL PALACE"], ["BRENTFORD", "MAN CITY"], ["CHELSEA", "LIVERPOOL"], ["EVERTON", "FULHAM"], ["LEEDS", "IPSWICH"], ["MAN UTD", "COVENTRY"], ["NEWCASTLE", "SUNDERLAND"], ["NOTTINGHAM", "BRIGHTON"], ["TOTTENHAM", "ARSENAL"] ],
            15: [ ["ARSENAL", "BOURNEMOUTH"], ["BRIGHTON", "EVERTON"], ["COVENTRY", "ASTON VILLA"], ["CRYSTAL PALACE", "MAN UTD"], ["FULHAM", "BRENTFORD"], ["HULL", "TOTTENHAM"], ["IPSWICH", "NEWCASTLE"], ["LIVERPOOL", "LEEDS"], ["MAN CITY", "CHELSEA"], ["SUNDERLAND", "NOTTINGHAM"] ],
            16: [ ["BOURNEMOUTH", "COVENTRY"], ["ARSENAL", "MAN UTD"], ["BRENTFORD", "NEWCASTLE"], ["BRIGHTON", "IPSWICH"], ["CHELSEA", "ASTON VILLA"], ["LEEDS", "FULHAM"], ["LIVERPOOL", "TOTTENHAM"], ["MAN CITY", "HULL"], ["NOTTINGHAM", "EVERTON"], ["SUNDERLAND", "CRYSTAL PALACE"] ],
            17: [ ["ASTON VILLA", "LEEDS"], ["COVENTRY", "CHELSEA"], ["CRYSTAL PALACE", "ARSENAL"], ["EVERTON", "SUNDERLAND"], ["FULHAM", "BRIGHTON"], ["HULL", "LIVERPOOL"], ["IPSWICH", "BRENTFORD"], ["MAN UTD", "NOTTINGHAM"], ["NEWCASTLE", "MAN CITY"], ["TOTTENHAM", "BOURNEMOUTH"] ],
            18: [ ["ASTON VILLA", "LIVERPOOL"], ["COVENTRY", "BRENTFORD"], ["CRYSTAL PALACE", "BOURNEMOUTH"], ["EVERTON", "MAN CITY"], ["FULHAM", "ARSENAL"], ["HULL", "LEEDS"], ["IPSWICH", "CHELSEA"], ["MAN UTD", "SUNDERLAND"], ["NEWCASTLE", "NOTTINGHAM"], ["TOTTENHAM", "BRIGHTON"] ]
        };

        let currentRound = 1;
        let activeTab = 'fixtures';
        let scoresStorage = JSON.parse(localStorage.getItem('fpl_scores')) || {};

        function switchTab(tabName, btn) {
            activeTab = tabName;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active-btn'));
            btn.classList.add('active-btn');
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            if(tabName === 'standings') {
                renderStandings();
                document.getElementById('standingsTab').classList.add('active');
            }
            if(tabName === 'fixtures') document.getElementById('fixturesTab').classList.add('active');
        }

        function updateScore(round, idx, type, val) {
            scoresStorage[`r${round}_m${idx}_${type}`] = val;
            localStorage.setItem('fpl_scores', JSON.stringify(scoresStorage));
        }

        function renderStandings() {
            const tbody = document.getElementById('standingsBody');
            tbody.innerHTML = '';
            teamsData.sort((a, b) => b.pts - a.pts);

            teamsData.forEach((team, index) => {
                let teamInfo = teamsMap[team.key] || { name: team.key, logo: "" };
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:900;">${index + 1}</td>
                        <td class="team-cell">
                            <img src="${teamInfo.logo}" alt="${teamInfo.name}">
                            ${teamInfo.name}
                        </td>
                        <td class="gf-col">${team.gf}</td>
                        <td class="pts-col">${team.pts}</td>
                    </tr>
                `;
            });
        }

        function renderFixtures() {
            const list = document.getElementById('fixturesList');
            document.getElementById('currentRoundTitle').innerText = `MATCHWEEK ${currentRound}`;
            list.innerHTML = '';

            let matches = matchweeks[currentRound] || [];
            matches.forEach((match, idx) => {
                let home = teamsMap[match[0]] || { name: match[0], logo: "" };
                let away = teamsMap[match[1]] || { name: match[1], logo: "" };

                let homeScore = scoresStorage[`r${currentRound}_m${idx}_home`] ?? '';
                let awayScore = scoresStorage[`r${currentRound}_m${idx}_away`] ?? '';

                list.innerHTML += `
                    <div class="fixture-row">
                        <div class="team-box home">
                            <span>${home.name}</span>
                            <img src="${home.logo}">
                        </div>
                        <div class="match-score-center">
                            <input type="number" class="score-input" value="${homeScore}" placeholder="0" oninput="updateScore(${currentRound}, ${idx}, 'home', this.value)">
                            <span style="font-weight:900;">:</span>
                            <input type="number" class="score-input" value="${awayScore}" placeholder="0" oninput="updateScore(${currentRound}, ${idx}, 'away', this.value)">
                        </div>
                        <div class="team-box away">
                            <img src="${away.logo}">
                            <span>${away.name}</span>
                        </div>
                    </div>
                `;
            });
        }

        function changeRound(step) {
            currentRound += step;
            if(currentRound < 1) currentRound = 1;
            if(currentRound > 18) currentRound = 18;
            renderFixtures();
        }

        function downloadAsImage() {
            const targetId = activeTab === 'fixtures' ? 'captureFixtures' : 'captureStandings';
            const element = document.getElementById(targetId);

            html2canvas(element, {
                backgroundColor: "#240024",
                scale: 2
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = activeTab === 'fixtures' ? `Matchweek_${currentRound}.png` : `League_Standings.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        renderStandings();
        renderFixtures();
    </script>
</body>
</html>
