<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>TELEGRAM GOAT - Premier League</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @font-face {
            font-family: 'SultanCustom';
            src: url('./Sultan.ttf') format('truetype');
        }

        @font-face {
            font-family: 'EnglishCustom';
            src: url('./english-font.ttf') format('truetype');
        }

        :root {
            --pl-dark-bg: #240024;
            --pl-pink: #ff005a;
            --pl-purple-btn: #38003c;
            --text-white: #ffffff;
            --border-dark: #5a055a;
            --font-ar: 'SultanCustom', sans-serif;
            --font-en: 'EnglishCustom', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-ar);
        }

        body {
            background-color: var(--pl-dark-bg);
            color: var(--text-white);
            padding-bottom: 40px;
            width: 100%;
            max-width: 768px;
            margin: 0 auto;
            padding: 0 10px;
        }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e0d33;
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: var(--font-en);
            font-weight: 900;
            font-size: 15px;
            border: 2px solid #ff005a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
        }

        #toast .toast-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #ff005a;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .banner-container {
            position: relative;
            width: 100%;
            max-width: 768px;
            margin: 15px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background-color: #240024;
            line-height: 0;
            text-align: center;
        }

        .banner-container img {
            width: 100%;
            height: auto;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .banner-overlay-tabs {
            position: absolute;
            bottom: 4%;
            right: 2%;
            display: flex;
            background: #5d8eb6;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            direction: rtl;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0;
            padding: 2px;
            max-width: 96%;
        }

        .banner-tab-btn,
        .banner-tab-select {
            background: transparent;
            color: #ffffff;
            border: none;
            padding: 8px 12px;
            font-family: var(--font-ar);
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex: 1 1 auto;
            min-width: 50px;
        }

        .banner-tab-btn:hover {
            background: rgba(0,0,0,0.15);
        }

        .banner-tab-btn.active {
            background: var(--pl-purple-btn);
        }

        .banner-tab-select {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 8px;
            padding-left: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="10" viewBox="0 0 24 24" width="10" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: left 6px center;
            border-left: 1px solid rgba(255,255,255,0.2);
            min-width: 60px;
        }

        .banner-tab-select option {
            background: var(--pl-purple-btn);
            color: #fff;
        }

        .admin-edit-btn {
            display: none !important;
        }

        .header {
            background-color: var(--pl-dark-bg);
            color: #ffffff;
            padding: 5px 10px 15px 10px;
            text-align: center;
        }

        .round-nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 5px 0;
            flex-wrap: wrap;
        }

        .round-indicator {
            font-family: var(--font-en);
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            text-align: center;
            padding: 5px 15px;
            border-radius: 8px;
            border: 2px dashed transparent;
            transition: 0.2s;
        }

        .round-indicator:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
        }

        .nav-arrow-btn {
            background: var(--pl-purple-btn);
            color: var(--text-white);
            border: 1px solid var(--border-dark);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .nav-arrow-btn:hover {
            background: var(--pl-pink);
            border-color: var(--pl-pink);
        }

        .main-container {
            width: 100%;
            max-width: 768px;
            margin: 0 auto;
            padding: 0 5px;
        }

        #captureFixtures {
            padding: 20px 15px;
            background: linear-gradient(
                135deg,
                #3281ff 0%,
                #00d2ff 45%,
                #a835ff 100%
            ), #4b92ff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 4px solid #ffffff;
        }

        .fixtures-header-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .fixtures-header-title {
            font-family: var(--font-en);
            font-size: 18px;
            font-weight: 900;
            color: #38003c;
            letter-spacing: 1px;
        }

        .fixture-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex-wrap: nowrap;
        }

        .team-box {
            font-family: var(--font-en);
            display: flex;
            align-items: center;
            width: 36%;
            font-size: 12px;
            font-weight: 800;
            color: #38003c;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .team-box.home {
            justify-content: flex-end;
            text-align: right;
        }

        .team-box.away {
            justify-content: flex-start;
            text-align: left;
        }

        .team-box img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            margin: 0 4px;
            background: transparent;
            border-radius: 0;
            padding: 0;
            flex-shrink: 0;
        }

        .match-score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 22%;
            background: #7138f5;
            padding: 4px 8px;
            border-radius: 6px;
            position: relative;
            min-width: 60px;
            flex-shrink: 0;
        }

        .score-display {
            font-family: var(--font-en);
            font-size: 16px;
            font-weight: 900;
            color: #ffffff;
        }

        .vs-text {
            font-weight: 900;
            color: #ffffff;
            font-family: var(--font-en);
            font-size: 14px;
        }

        .score-input {
            font-family: var(--font-en);
            width: 32px;
            height: 24px;
            text-align: center;
            font-size: 12px;
            font-weight: 900;
            background: #ffffff;
            color: #38003c;
            border: 1px solid #7138f5;
            border-radius: 4px;
            outline: none;
        }

        .score-input:focus {
            border-color: #ff005a;
            box-shadow: 0 0 0 2px rgba(255,0,90,0.15);
        }

        #captureStandings {
            display: flex;
            flex-wrap: wrap;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 4px solid #ffffff;
            width: 100%;
        }

        .standings-sidebar {
            width: 140px;
            background: linear-gradient(
                180deg,
                #6C2BD9 0%,
                #3B82F6 50%,
                #10B981 100%
            );
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: #ffffff;
            text-align: center;
            flex-shrink: 0;
            min-height: 280px;
            border-radius: 16px 0 0 16px;
        }

        .standings-sidebar img {
            width: 200%;
            max-width: 330px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
            display: block;
            border-radius: 8px;
        }

        .standings-content-area {
            flex: 1;
            background: #f4f5f7;
            overflow-x: auto;
            min-width: 200px;
            padding: 10px;
            display: block !important;
        }

        .standings-card {
            background: transparent;
            border-radius: 0;
            overflow: visible;
            padding: 5px;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 13px;
            color: #333;
            display: table !important;
            min-width: 320px;
        }

        th {
            font-family: var(--font-en);
            background-color: #e8eaed;
            color: #38003c;
            padding: 10px 6px;
            font-weight: 900;
            border-bottom: 2px solid #38003c;
            font-size: 13px;
            border-top: none;
        }

        td {
            font-family: var(--font-en);
            padding: 10px 6px;
            border-bottom: 1px solid #d1d5db;
            font-weight: 800;
            font-size: 13px;
            background-color: #ffffff;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f3f4f6;
        }

        .team-cell {
            font-family: var(--font-en);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-weight: 800;
            text-transform: uppercase;
            color: #1a1a1a;
            font-size: 13px;
            padding: 8px 5px;
            gap: 8px;
        }

        .team-cell img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            background: transparent;
            border-radius: 0;
            padding: 0;
            flex-shrink: 0;
        }

        .pos-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 24px;
        }

        .pos-container span {
            font-size: 20px;
            font-weight: 900;
            min-width: 28px;
            line-height: 1;
        }

        /*
         * حركة الترتيب:
         * الأيقونة أصبحت بحجم قريب من رقم المركز
         */
        .pos-indicator-img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            display: block;
            flex-shrink: 0;
        }

        .glow-green td:first-child {
            color: #00b894;
        }

        .glow-green td:first-child .pos-container span {
            color: #00b894;
        }

        .glow-red td:first-child {
            color: #ff005a;
        }

        .glow-red td:first-child .pos-container span {
            color: #ff005a;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media screen and (max-width: 600px) {

            body {
                padding: 0 5px;
            }

            .banner-container {
                border-width: 3px;
                border-radius: 16px;
            }

            .banner-overlay-tabs {
                bottom: 4%;
                right: 1%;
                max-width: 98%;
                border-radius: 6px;
                padding: 3px 0;
                gap: 0;
            }

            .banner-tab-btn,
            .banner-tab-select {
                font-size: 10px;
                padding: 5px 6px;
                min-width: 35px;
                flex: 1 1 20%;
            }

            .banner-tab-select {
                min-width: 45px;
                padding-right: 6px;
                padding-left: 14px;
                background-size: 7px;
            }

            .round-indicator {
                font-size: 15px;
            }

            .nav-arrow-btn {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }

            #captureFixtures {
                padding: 15px 10px;
                border-radius: 16px;
                border-width: 3px;
            }

            .fixtures-header-title {
                font-size: 16px;
            }

            .fixture-row {
                padding: 6px 8px;
                flex-wrap: nowrap;
            }

            .team-box {
                font-size: 10px !important;
                width: 34%;
                letter-spacing: -0.2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .team-box img {
                width: 18px;
                height: 18px;
                margin: 0 3px;
            }

            .match-score-center {
                width: 24%;
                min-width: 50px;
                padding: 3px 4px;
            }

            .score-display {
                font-size: 14px;
            }

            .vs-text {
                font-size: 12px;
            }

            .score-input {
                width: 26px;
                height: 18px;
                font-size: 10px;
            }

            #captureStandings {
                flex-direction: column;
                border-radius: 16px;
                border-width: 3px;
                overflow: hidden;
            }

            .standings-sidebar {
                width: 100%;
                flex-direction: row;
                padding: 15px 10px;
                justify-content: center;
                align-items: center;
                border-radius: 16px 16px 0 0;
                min-height: 100px;
            }

            .standings-sidebar img {
                max-width: 170px;
            }

            .standings-content-area {
                min-width: unset;
                width: 100%;
                padding: 5px;
                overflow-x: auto;
                display: block !important;
                border-radius: 0 0 16px 16px;
            }

            .standings-card {
                padding: 5px 0;
            }

            table {
                font-size: 11px;
                display: table !important;
                width: 100%;
                min-width: 280px;
            }

            th {
                font-size: 11px;
                padding: 8px 4px;
            }

            td {
                font-size: 11px;
                padding: 8px 4px;
            }

            .team-cell {
                font-size: 11px;
                padding: 6px 4px;
                gap: 4px;
            }

            .team-cell img {
                width: 18px;
                height: 18px;
            }

            .pos-container {
                gap: 4px;
                min-height: 20px;
            }

            .pos-container span {
                font-size: 18px;
                min-width: 24px;
            }

            .pos-indicator-img {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>

<body>

    <div id="toast">
        <span id="toastContent">جاري الحفظ...</span>
    </div>

    <div class="banner-container">

        <img
            id="bannerImg"
            src="image_5.png"
            alt="Premier League Banner"
            onerror="handleBannerError(this)"
        >

        <div class="banner-overlay-tabs">

            <select
                class="banner-tab-select"
                id="roundSelect"
                onchange="selectRound(this.value)"
            ></select>

            <button
                class="banner-tab-btn active"
                id="fixturesToggleBtn"
                onclick="switchTab('fixtures')"
            >
                المواجهات
            </button>

            <button
                class="banner-tab-btn"
                id="standingsToggleBtn"
                onclick="switchTab('standings')"
            >
                الترتيب
            </button>

            <button
                class="banner-tab-btn"
                onclick="downloadAsImage()"
            >
                حفظ الصورة
            </button>

            <button
                class="banner-tab-btn admin-edit-btn"
                id="editToggleBtn"
                onclick="toggleEditMode()"
                style="display: none !important;"
            >
                تعديل
            </button>

        </div>
    </div>

    <div class="header">

        <div class="round-nav-container">

            <button
                class="nav-arrow-btn"
                onclick="changeRound(-1)"
            >
                ‹
            </button>

            <div
                class="round-indicator"
                id="currentRoundTitle"
                ondblclick="unlockEditWithPassword()"
            >
                MATCHWEEK 1
            </div>

            <button
                class="nav-arrow-btn"
                onclick="changeRound(1)"
            >
                ›
            </button>

        </div>

    </div>

    <div class="main-container">

        <div id="fixturesTab" class="tab-content active">

            <div id="captureFixtures" class="export-area">

                <div class="fixtures-header-box">

                    <div
                        class="fixtures-header-title"
                        id="fixturesBannerTitle"
                    >
                        MATCHWEEK RESULTS
                    </div>

                </div>

                <div id="fixturesList"></div>

            </div>

        </div>

        <div id="standingsTab" class="tab-content">

            <div id="captureStandings" class="export-area">

                <div class="standings-sidebar">

                    <img
                        src="premire_League2.png-.webp"
                        alt="Premier League"
                        onerror="this.style.display='none'"
                    >

                </div>

                <div class="standings-content-area">

                    <div class="standings-card">

                        <table>

                            <thead>

                                <tr>

                                    <th style="text-align:center;">
                                        Pos
                                    </th>

                                    <th style="text-align:right; padding-right:15px;">
                                        Club
                                    </th>

                                    <th style="text-align:center;">
                                        GF
                                    </th>

                                    <th style="text-align:center;">
                                        Pts
                                    </th>

                                </tr>

                            </thead>

                            <tbody id="standingsBody"></tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        /* =========================================================
           SETTINGS
        ========================================================= */

        let editMode = false;
        let currentRound = 1;
        let activeTab = 'fixtures';
        let isSaving = false;
        let toastTimeout = null;

        /*
         * قراءة النتائج من LocalStorage بأمان
         */
        function loadScores() {

            try {

                const stored = localStorage.getItem('fpl_scores');

                if (!stored) {
                    return {};
                }

                const parsed = JSON.parse(stored);

                if (
                    parsed &&
                    typeof parsed === 'object' &&
                    !Array.isArray(parsed)
                ) {
                    return parsed;
                }

                return {};

            } catch (error) {

                console.warn(
                    'تعذر قراءة النتائج من LocalStorage:',
                    error
                );

                return {};

            }
        }

        let scoresStorage = loadScores();


        /* =========================================================
           TOAST
        ========================================================= */

        function showToast(msg, isSuccess = false) {

            const toast = document.getElementById('toast');
            const content = document.getElementById('toastContent');

            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }

            toast.classList.remove('show');

            if (isSuccess) {

                content.innerHTML = `✅ ${msg}`;

            } else {

                content.innerHTML =
                    `<span class="toast-spinner"></span> ${msg}`;

            }

            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }


        /* =========================================================
           BANNER
        ========================================================= */

        let bannerAttempts = 0;

        const bannerSources = [
            "image_5.png",
            "image_5.PNG",
            "image_5.jpg",
            "image_5.JPG",
            "banner.png"
        ];

        function handleBannerError(img) {

            bannerAttempts++;

            if (bannerAttempts < bannerSources.length) {

                img.src = bannerSources[bannerAttempts];

            } else {

                img.src =
                    'https://dummyimage.com/768x180/00bfff/fff&text=Banner+Missing';

            }
        }


        /* =========================================================
           TEAMS
        ========================================================= */

        const teamsMap = {

        /* =========================================================
           ROUND DROPDOWN
        ========================================================= */

        function initRoundDropdown() {

            const select = document.getElementById('roundSelect');

            select.innerHTML = '';

            for (let i = 1; i <= 38; i++) {

                const opt = document.createElement('option');

                opt.value = i;
                opt.innerText = `الجولة ${i}`;

                if (i === currentRound) {
                    opt.selected = true;
                }

                select.appendChild(opt);
            }
        }


        /* =========================================================
           SELECT ROUND
        ========================================================= */

        function selectRound(val) {

            let selectedRound = parseInt(val, 10);

            if (
                Number.isNaN(selectedRound) ||
                selectedRound < 1 ||
                selectedRound > 38
            ) {
                selectedRound = 1;
            }

            currentRound = selectedRound;

            updateRoundUI();

            renderFixtures();
            renderStandings();
        }


        /* =========================================================
           UPDATE ROUND UI
        ========================================================= */

        function updateRoundUI() {

            const title =
                document.getElementById('currentRoundTitle');

            const select =
                document.getElementById('roundSelect');

            title.innerText =
                `MATCHWEEK ${currentRound}`;

            if (select.value !== String(currentRound)) {
                select.value = String(currentRound);
            }
        }


        /* =========================================================
           TABS
        ========================================================= */

        function switchTab(tabName) {

            activeTab = tabName;

            document
                .getElementById('fixturesToggleBtn')
                .classList.toggle(
                    'active',
                    tabName === 'fixtures'
                );

            document
                .getElementById('standingsToggleBtn')
                .classList.toggle(
                    'active',
                    tabName === 'standings'
                );

            document
                .querySelectorAll('.tab-content')
                .forEach(el => {
                    el.classList.remove('active');
                });

            if (tabName === 'standings') {

                renderStandings();

                document
                    .getElementById('standingsTab')
                    .classList.add('active');

            } else {

                document
                    .getElementById('fixturesTab')
                    .classList.add('active');

            }
        }

           ADMIN PASSWORD
        ========================================================= */

        function unlockEditWithPassword() {

            if (editMode) {
                return;
            }

            const pass =
                prompt("أدخل رمز الحماية لتفعيل زر التعديل:");

            if (pass === "1999") {

                editMode = true;

                const editBtn =
                    document.getElementById('editToggleBtn');

                editBtn.style.setProperty(
                    'display',
                    'inline-flex',
                    'important'
                );

                editBtn.innerText = "حفظ";

                renderFixtures();

                alert(
                    "تم تفعيل صلاحيات المدير بنجاح!"
                );

            } else if (pass !== null) {

                alert("الرمز غير صحيح!");

            }
        }


        /* =========================================================
           TOGGLE EDIT MODE
        ========================================================= */

        function toggleEditMode() {

            const btn =
                document.getElementById('editToggleBtn');

            if (!editMode) {

                editMode = true;

                btn.innerText = "حفظ";

                renderFixtures();

                return;
            }

            if (isSaving) {
                return;
            }

            showToast("جاري الحفظ...", false);

            const matches =
                matchweeks[currentRound] || [];

            matches.forEach((match, idx) => {

                const homeInput =
                    document.getElementById(
                        `home_r${currentRound}_m${idx}`
                    );

                const awayInput =
                    document.getElementById(
                        `away_r${currentRound}_m${idx}`
                    );

                if (homeInput && awayInput) {

                    const homeVal =
                        sanitizeScore(homeInput.value);

                    const awayVal =
                        sanitizeScore(awayInput.value);

                    homeInput.value = homeVal;
                    awayInput.value = awayVal;

                    scoresStorage[
                        `r${currentRound}_m${idx}_home`
                    ] = homeVal;

                    scoresStorage[
                        `r${currentRound}_m${idx}_away`
                    ] = awayVal;
                }

            });

            isSaving = true;
            btn.disabled = true;

            saveScores();

            setTimeout(() => {

                isSaving = false;

                btn.disabled = false;

                showToast("تم الحفظ ✓", true);

                editMode = false;

                btn.style.setProperty(
                    'display',
                    'none',
                    'important'
                );

                btn.innerText = "تعديل";

                renderFixtures();
                renderStandings();

            }, 300);
        }


        /* =========================================================
           SCORE SANITIZATION
        ========================================================= */

        function sanitizeScore(value) {

            if (value === undefined || value === null) {
                return '';
            }

            return String(value)
                .replace(/[^0-9]/g, '');
        }


        /* =========================================================
           SAVE SCORES
        ========================================================= */

        function saveScores() {

            try {

                localStorage.setItem(
                    'fpl_scores',
                    JSON.stringify(scoresStorage)
                );

                return true;

            } catch (error) {

                console.error(
                    'فشل حفظ النتائج:',
                    error
                );

                showToast(
                    "حدث خطأ أثناء حفظ النتائج",
                    false
                );

                return false;
            }
        }


        /* =========================================================
           UPDATE SCORE
        ========================================================= */

        function updateScore(
            round,
            idx,
            type,
            val,
            inputElement
        ) {

            const sanitized =
                sanitizeScore(val);

            if (sanitized !== val) {
                inputElement.value = sanitized;
            }

            scoresStorage[
                `r${round}_m${idx}_${type}`
            ] = sanitized;

            saveScores();

            /*
             * تحديث الترتيب مباشرة أثناء الكتابة
             */
            if (activeTab === 'standings') {
                renderStandings();
            }
        }


        /* =========================================================
           CALCULATE STANDINGS
           PTS ثم GF
        ========================================================= */

        function calculateStandingsUpToRound(targetRound) {

            let calculated = {};

            /*
             * إنشاء جميع الفرق
             */
            for (let teamKey in initialBasePoints) {

                calculated[teamKey] = {
                    key: teamKey,
                    gf: 0,
                    pts: 0
                };
            }


            /*
             * حساب جميع الجولات السابقة
             */
            for (
                let r = 1;
                r <= targetRound;
                r++
            ) {

                const roundMatches =
                    matchweeks[r];

                if (!roundMatches) {
                    continue;
                }


                roundMatches.forEach((match, idx) => {

                    const hKey = match[0];
                    const aKey = match[1];

                    /*
                     * حماية من أي فريق غير موجود
                     */
                    if (
                        !calculated[hKey] ||
                        !calculated[aKey]
                    ) {
                        return;
                    }

                    const hVal =
                        scoresStorage[
                            `r${r}_m${idx}_home`
                        ];

                    const aVal =
                        scoresStorage[
                            `r${r}_m${idx}_away`
                        ];


                    /*
                     * لا تحسب المباراة إذا لم تدخل
                     * النتيجتين
                     */
                    if (
                        hVal === undefined ||
                        aVal === undefined ||
                        hVal === '' ||
                        aVal === ''
                    ) {
                        return;
                    }


                    const hScore =
                        Number(hVal);

                    const aScore =
                        Number(aVal);


                    /*
                     * حماية من NaN
                     */
                    if (
                        !Number.isFinite(hScore) ||
                        !Number.isFinite(aScore)
                    ) {
                        return;
                    }


                    /*
                     * GF
                     */
                    calculated[hKey].gf += hScore;
                    calculated[aKey].gf += aScore;


                    /*
                     * النقاط
                     */
                    if (hScore > aScore) {

                        calculated[hKey].pts += 3;

                    } else if (aScore > hScore) {

                        calculated[aKey].pts += 3;

                    } else {

                        calculated[hKey].pts += 1;
                        calculated[aKey].pts += 1;

                    }

                });
            }


            /*
             * ترتيب:
             * 1- النقاط
             * 2- GF
             * 3- ترتيب ثابت بالاسم لمنع
             * التبدل العشوائي عند التساوي
             */
            return Object.values(calculated)
                .sort((a, b) => {

                    if (b.pts !== a.pts) {
                        return b.pts - a.pts;
                    }

                    if (b.gf !== a.gf) {
                        return b.gf - a.gf;
                    }

                    const nameA =
                        teamsMap[a.key]?.name || a.key;

                    const nameB =
                        teamsMap[b.key]?.name || b.key;

                    return nameA.localeCompare(
                        nameB,
                        'en'
                    );
                });
        }


        function calculateStandings() {

            return calculateStandingsUpToRound(
                currentRound
            );
        }


        /* =========================================================
           RENDER STANDINGS
        ========================================================= */

        function renderStandings() {

            const tbody =
                document.getElementById(
                    'standingsBody'
                );

            if (!tbody) {
                return;
            }

            tbody.innerHTML = '';


            /*
             * الترتيب الحالي
             */
            const sortedTeams =
                calculateStandings();


            /*
             * ترتيب الجولة السابقة
             *
             * الجولة 1:
             * لا يوجد ترتيب سابق، لذلك لا توجد أيقونة.
             *
             * الجولة 2 وما بعدها:
             * نقارن الجولة الحالية بالجولة السابقة.
             */
            let prevRanks = {};

            if (currentRound >= 2) {

                const prevSortedTeams =
                    calculateStandingsUpToRound(
                        currentRound - 1
                    );

                prevSortedTeams.forEach(
                    (team, idx) => {

                        prevRanks[team.key] =
                            idx + 1;

                    }
                );
            }


            /*
             * بناء الجدول
             */
            sortedTeams.forEach(
                (team, index) => {

                    const teamInfo =
                        teamsMap[team.key] || {
                            name: team.key,
                            logo: ""
                        };

                    const position =
                        index + 1;


                    /*
                     * ألوان المركز الأول
                     * والمركز 17
                     */
                    let rowClass = '';

                    if (position === 1) {

                        rowClass =
                            'glow-green';

                    } else if (position === 17) {

                        rowClass =
                            'glow-red';

                    }


                    /*
                     * أيقونة الحركة
                     */
                    let indicatorImgHtml = '';


                    if (
                        currentRound >= 2 &&
                        prevRanks[team.key] !== undefined
                    ) {

                        const oldPos =
                            prevRanks[team.key];


                        /*
                         * صعود
                         */
                        if (position < oldPos) {

                            indicatorImgHtml =
                                `<img
                                    src="arrow_up_green.png"
                                    class="pos-indicator-img"
                                    alt="⬆"
                                >`;

                        /*
                         * نزول
                         */
                        } else if (position > oldPos) {

                            indicatorImgHtml =
                                `<img
                                    src="arrow_down_red.png"
                                    class="pos-indicator-img"
                                    alt="⬇"
                                >`;

                        /*
                         * ثبات
                         */
                        } else {

                            indicatorImgHtml =
                                `<img
                                    src="equal_gray.png"
                                    class="pos-indicator-img"
                                    alt="="
                                >`;
                        }
                    }


                    tbody.innerHTML += `

                        <tr class="${rowClass}">

                            <td style="padding:8px 5px;">

                                <div class="pos-container">

                                    ${indicatorImgHtml}

                                    <span>
                                        ${position}
                                    </span>

                                </div>

                            </td>


                            <td class="team-cell">

                                <img
                                    src="${teamInfo.logo}"
                                    alt="${teamInfo.name}"
                                    onerror="this.style.display='none'"
                                >

                                ${teamInfo.name}

                            </td>


                            <td
                                style="
                                    padding:8px 5px;
                                    font-weight:900;
                                "
                            >
                                ${team.gf}
                            </td>


                            <td
                                style="
                                    color:#7138f5;
                                    font-size:14px;
                                    font-weight:900;
                                    padding:8px 5px;
                                "
                            >
                                ${team.pts}
                            </td>

                        </tr>
                    `;
                }
            );
        }


        /* =========================================================
           RENDER FIXTURES
        ========================================================= */

        function renderFixtures() {

            const list =
                document.getElementById(
                    'fixturesList'
                );

            const title =
                document.getElementById(
                    'currentRoundTitle'
                );

            const select =
                document.getElementById(
                    'roundSelect'
                );

            const fixturesTitle =
                document.getElementById(
                    'fixturesBannerTitle'
                );


            title.innerText =
                `MATCHWEEK ${currentRound}`;

            select.value =
                String(currentRound);

            fixturesTitle.innerText =
                `MATCHWEEK ${currentRound} RESULTS`;

            list.innerHTML = '';


            const matches =
                matchweeks[currentRound] || [];


            matches.forEach(
                (match, idx) => {

                    const home =
                        teamsMap[match[0]] || {
                            name: match[0],
                            logo: ""
                        };

                    const away =
                        teamsMap[match[1]] || {
                            name: match[1],
                            logo: ""
                        };


                    const homeScore =
                        scoresStorage[
                            `r${currentRound}_m${idx}_home`
                        ] ?? '';


                    const awayScore =
                        scoresStorage[
                            `r${currentRound}_m${idx}_away`
                        ] ?? '';


                    let scoreContent;


                    if (editMode) {

                        scoreContent = `

                            <input
                                type="number"
                                min="0"
                                step="1"
                                inputmode="numeric"
                                class="score-input"
                                id="home_r${currentRound}_m${idx}"
                                value="${homeScore}"
                                placeholder="0"
                                oninput="
                                    updateScore(
                                        ${currentRound},
                                        ${idx},
                                        'home',
                                        this.value,
                                        this
                                    )
                                "
                            >

                            <span
                                style="
                                    font-weight:900;
                                    color:#fff;
                                "
                            >
                                :
                            </span>

                            <input
                                type="number"
                                min="0"
                                step="1"
                                inputmode="numeric"
                                class="score-input"
                                id="away_r${currentRound}_m${idx}"
                                value="${awayScore}"
                                placeholder="0"
                                oninput="
                                    updateScore(
                                        ${currentRound},
                                        ${idx},
                                        'away',
                                        this.value,
                                        this
                                    )
                                "
                            >

                        `;

                    } else {

                        scoreContent = `

                            <span class="score-display">
                                ${
                                    homeScore !== ''
                                        ? homeScore
                                        : '-'
                                }
                            </span>

                            <span class="vs-text">
                                VS
                            </span>

                            <span class="score-display">
                                ${
                                    awayScore !== ''
                                        ? awayScore
                                        : '-'
                                }
                            </span>

                        `;
                    }


                    list.innerHTML += `

                        <div class="fixture-row">

                            <div class="team-box home">

                                <span>
                                    ${home.name}
                                </span>

                                <img
                                    src="${home.logo}"
                                    alt="${home.name}"
                                    onerror="
                                        this.style.display='none'
                                    "
                                >

                            </div>


                            <div class="match-score-center">

                                ${scoreContent}

                            </div>


                            <div class="team-box away">

                                <img
                                    src="${away.logo}"
                                    alt="${away.name}"
                                    onerror="
                                        this.style.display='none'
                                    "
                                >

                                <span>
                                    ${away.name}
                                </span>

                            </div>

                        </div>

                    `;
                }
            );
        }


        /* =========================================================
           CHANGE ROUND
        ========================================================= */

        function changeRound(step) {

            currentRound += step;


            if (currentRound < 1) {
                currentRound = 1;
            }


            if (currentRound > 38) {
                currentRound = 38;
            }


            updateRoundUI();

            renderFixtures();

            /*
             * الترتيب يتحدث مباشرة عند تغيير الجولة
             */
            renderStandings();
        }


        /* =========================================================
           DOWNLOAD IMAGE
        ========================================================= */

        async function downloadAsImage() {

            const targetId =
                activeTab === 'fixtures'
                    ? 'captureFixtures'
                    : 'captureStandings';

            const element =
                document.getElementById(targetId);


            if (!element) {
                return;
            }


            try {

                showToast(
                    "جاري تجهيز الصورة...",
                    false
                );


                /*
                 * ننتظر قليلاً حتى تكتمل الصور والخطوط
                 */
                await new Promise(
                    resolve => setTimeout(
                        resolve,
                        150
                    )
                );


                const canvas =
                    await html2canvas(
                        element,
                        {
                            backgroundColor:
                                activeTab === 'fixtures'
                                    ? null
                                    : "#ffffff",

                            scale: 2,

                            useCORS: true,

                            allowTaint: false
                        }
                    );


                canvas.toBlob(
                    function(blob) {

                        if (!blob) {

                            showToast(
                                "تعذر إنشاء الصورة",
                                false
                            );

                            return;
                        }


                        const link =
                            document.createElement('a');

                        const filename =
                            activeTab === 'fixtures'
                                ? `Matchweek_${currentRound}.png`
                                : `League_Standings_GW${currentRound}.png`;


                        const url =
                            URL.createObjectURL(blob);


                        link.download = filename;
                        link.href = url;

                        document.body.appendChild(link);

                        link.click();

                        document.body.removeChild(link);


                        /*
                         * نعطي المتصفح وقتاً قبل حذف الرابط
                         */
                        setTimeout(() => {
                            URL.revokeObjectURL(url);
                        }, 1000);


                        showToast(
                            "تم تجهيز الصورة ✓",
                            true
                        );

                    },
                    'image/png'
                );


            } catch (error) {

                console.error(
                    'خطأ أثناء حفظ الصورة:',
                    error
                );

                showToast(
                    "حدث خطأ أثناء حفظ الصورة",
                    false
                );
            }
        }


        /* =========================================================
           AUTO SAVE
        ========================================================= */

        setInterval(() => {

            if (
                scoresStorage &&
                Object.keys(scoresStorage).length > 0
            ) {
                saveScores();
            }

        }, 5000);


        /* =========================================================
           START
        ========================================================= */

        initRoundDropdown();

        updateRoundUI();

        renderFixtures();

        renderStandings();

    </script>

</body>
