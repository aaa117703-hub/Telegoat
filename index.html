<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @font-face {
            font-family: 'SultanCustom';
            src: url('./Sultan.ttf') format('truetype');
        }
        @font-face {
            font-family: 'EnglishCustom';
            src: url('./english-font.ttf') format('truetype');
        }

        :root {
            --bg-main: #0d0614;
            --bg-card: #160b24;
            --pl-pink: #ff005a;
            --pl-green: #00ff87;
            --pl-purple: #38003c;
            --text-white: #ffffff;
            --border-color: #3b1854;
            --font-ar: 'SultanCustom', sans-serif;
            --font-en: 'EnglishCustom', sans-serif;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-user-select: none;
            user-select: none;
        }

        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-white); 
            padding-bottom: 50px; 
            font-family: var(--font-en);
        }

        img {
            pointer-events: none;
            -webkit-touch-callout: none;
        }

        .banner-container {
            width: 100%;
            max-width: 800px;
            margin: 15px auto 0 auto;
            height: 130px;
            background: linear-gradient(135deg, #24003c 0%, #38003c 50%, #12001e 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 2px solid var(--pl-pink);
            box-shadow: 0 10px 30px rgba(255,0,90,0.2);
            position: relative;
            overflow: hidden;
        }
        
        .banner-logo-section {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner-logo-section img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .header { 
            background-color: transparent; 
            padding: 15px 10px; 
            text-align: center; 
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
            position: relative;
            z-index: 10;
        }

        .filter-btn {
            background: var(--bg-card);
            color: var(--text-white);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-family: var(--font-en);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--pl-purple);
            border-color: var(--pl-pink);
            box-shadow: 0 0 15px rgba(255,0,90,0.3);
        }

        .download-icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            outline: none;
        }

        .download-icon-btn:hover {
            background: var(--pl-purple);
            border-color: var(--pl-pink);
            box-shadow: 0 0 15px rgba(255,0,90,0.3);
            transform: scale(1.05);
        }

        .download-icon-btn img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            filter: invert(1);
        }

        .admin-only {
            display: none !important;
        }
        .admin-only.visible {
            display: inline-flex !important;
            border-color: var(--pl-pink) !important;
            background: #4a0020 !important;
        }

        .round-nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0 15px 0;
            position: relative;
            z-index: 10;
        }

        .round-indicator {
            font-family: var(--font-en);
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-white);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 8px;
            border: 1px dashed transparent;
            transition: 0.2s;
        }
        .round-indicator:hover {
            border-color: var(--pl-pink);
            background: rgba(255,0,90,0.1);
        }

        .nav-arrow-btn {
            background: var(--bg-card);
            color: var(--text-white);
            border: 1px solid var(--border-color);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 20;
            position: relative;
        }

        .nav-arrow-btn:hover, .nav-arrow-btn:active {
            background: var(--pl-pink);
            color: var(--text-white);
            border-color: var(--pl-pink);
            transform: scale(1.05);
        }

        .main-container { max-width: 800px; margin: 0 auto; padding: 0 10px; }

        .bulk-edit-container {
            display: none;
            background: linear-gradient(135deg, #24003c 0%, #160b24 100%);
            border: 2px solid var(--pl-pink);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(255,0,90,0.2);
        }
        .bulk-edit-container.visible {
            display: block;
        }
        .bulk-edit-container textarea {
            width: 100%;
            height: 120px;
            background: #0d0614;
            color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-family: var(--font-en);
            font-size: 15px;
            outline: none;
            resize: vertical;
        }
        .bulk-edit-container textarea:focus {
            border-color: var(--pl-pink);
        }
        .bulk-btn-save {
            background: var(--pl-pink);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
            font-family: var(--font-en);
            transition: 0.2s;
        }
        .bulk-btn-save:hover {
            background: #ff2870;
            box-shadow: 0 0 10px var(--pl-pink);
        }

        .capture-box {
            background: linear-gradient(135deg, #1e0d33 0%, #120621 100%);
            padding: 25px 15px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            width: 1081px;
            max-width: 100%;
        }

        .card-box-inner {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .card-header-title {
            font-family: var(--font-en);
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            color: #38003c;
            margin-bottom: 20px;
            letter-spacing: 2px;
            border-bottom: 3px solid #ff005a;
            padding-bottom: 8px;
        }

        .fixture-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 14px 10px;
            margin-bottom: 8px;
            background: #fcf9ff;
            border-radius: 8px;
            border-bottom: 2px solid #e0c2ff;
        }

        .team-box {
            font-family: var(--font-en);
            display: flex;
            align-items: center;
            width: 40%;
            font-size: 18px;
            font-weight: 950;
            color: #38003c;
            text-transform: uppercase;
        }
        .team-box.home { justify-content: flex-end; text-align: right; }
        .team-box.away { justify-content: flex-start; text-align: left; }
        
        .team-box img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            margin: 0 12px;
        }

        .match-score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 20%;
            background: #38003c;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ff005a;
        }

        .score-display {
            font-family: var(--font-en);
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
        }

        .score-input {
            font-family: var(--font-en);
            width: 50px;
            height: 34px;
            text-align: center;
            font-size: 16px;
            font-weight: 900;
            background: #160b24;
            color: #ffffff;
            border: 1px solid #ff005a;
            border-radius: 6px;
            outline: none;
        }

        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0; 
            text-align: center; 
        }
        
        th { 
            font-family: var(--font-en); 
            background-color: #38003c; 
            color: #ffffff; 
            padding: 14px 8px; 
            font-weight: 900; 
            border-bottom: 3px solid #ff005a; 
            font-size: 15px; 
        }
        
        td { 
            font-family: var(--font-en); 
            padding: 12px 8px; 
            border-bottom: 1px solid #e0c2ff;
            font-weight: 900; 
            font-size: 15px; 
            color: #38003c; 
        }
        
        .team-cell { 
            font-family: var(--font-en); 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            font-weight: 900; 
            text-transform: uppercase; 
            color: #38003c; 
            font-size: 16px; 
        }
        
        .team-cell img { 
            width: 30px; 
            height: 30px; 
            margin-left: 12px; 
            object-fit: contain;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <div class="banner-container">
        <div class="banner-logo-section">
            <img src="header.png.pdf" alt="Premier League Logo" onerror="this.src='https://dummyimage.com/800x130/38003c/ffffff&text=PREMIER+LEAGUE'">
        </div>
    </div>

    <div class="header">
        <div class="filter-bar">
            <button class="filter-btn active" id="fixturesToggleBtn" onclick="switchTab('fixtures')">Fixtures</button>
            <button class="filter-btn" id="standingsToggleBtn" onclick="switchTab('standings')">Standings</button>
            
            <button class="filter-btn admin-only" id="editToggleBtn" onclick="toggleEditMode()">Edit</button>
            <button class="download-icon-btn admin-only" id="saveAlbumBtn" onclick="downloadAsImage()" title="Save to Album">
                <img src="https://i.imgur.com/8381Wd0.png" alt="Download" onerror="this.src='https://img.icons8.com/ios-filled/50/ffffff/download.png'">
            </button>
        </div>

        <div class="round-nav-container">
            <button class="nav-arrow-btn" onclick="changeRound(-1)">❮</button>
            <div class="round-indicator" id="currentRoundTitle" onclick="changeRound(1)">MATCHWEEK 1</div>
            <button class="nav-arrow-btn" onclick="changeRound(1)">❯</button>
        </div>
    </div>

    <div class="main-container">

        <div class="bulk-edit-container admin-only" id="bulkEditBox">
            <div style="font-weight: 900; margin-bottom: 8px; font-size: 14px;">Bulk Text Score Entry (Line by line, e.g., Arsenal 2 - 1 Chelsea):</div>
            <textarea id="bulkTextarea" placeholder="Arsenal 2 - 1 Chelsea&#10;Manchester United 3 - 0 Liverpool..."></textarea>
            <button class="bulk-btn-save" onclick="processBulkText()">Update & Save Round</button>
        </div>

        <div id="fixturesTab" class="tab-content active">
            <div id="captureFixtures" class="capture-box">
                <div class="card-box-inner">
                    <div class="card-header-title" id="fixturesHeaderTitle">MATCHWEEK 1 RESULTS</div>
                    <div id="fixturesList"></div>
                </div>
            </div>
        </div>

        <div id="standingsTab" class="tab-content">
            <div id="captureStandings" class="capture-box">
                <div class="card-box-inner">
                    <div class="card-header-title" id="standingsHeaderTitle">STANDINGS - AFTER GAMEWEEK 1</div>
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 10%;">Pos</th>
                                <th style="text-align: left; padding-left: 20px; width: 50%;">Club</th>
                                <th style="width: 20%;">GF</th>
                                <th style="width: 20%;">Pts</th>
                            </tr>
                        </thead>
                        <tbody id="standingsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

            28: [["ARS", "NOT"], ["BOU", "BRE"], ["BHA", "HUL"], ["CRY", "AVL"], ["EVE", "LEE"], ["FUL", "LIV"], ["MCI", "TOT"], ["NEW", "IPS"], ["SUN", "MUN"], ["CHE", "COV"]],
            29: [["ARS", "FUL"], ["AVL", "CHE"], ["BRE", "NEW"], ["COV", "LEE"], ["HUL", "CRY"], ["IPS", "MCI"], ["LIV", "BHA"], ["MUN", "EVE"], ["NOT", "BOU"], ["TOT", "SUN"]],
            30: [["BOU", "IPS"], ["BHA", "COV"], ["CHE", "ARS"], ["CRY", "MCI"], ["EVE", "BRE"], ["FUL", "HUL"], ["LEE", "AVL"], ["LIV", "NOT"], ["NEW", "FUL"], ["SUN", "TOT"]],
            31: [["ARS", "CRY"], ["AVL", "LEE"], ["BRE", "FUL"], ["COV", "EVE"], ["HUL", "LIV"], ["IPS", "CHE"], ["MCI", "BHA"], ["NOT", "MUN"], ["TOT", "BOU"], ["NEW", "MCI"]],
            32: [["BOU", "ARS"], ["BHA", "NOT"], ["CHE", "FUL"], ["CRY", "AVL"], ["EVE", "IPS"], ["FUL", "COV"], ["LEE", "TOT"], ["LIV", "BRE"], ["MUN", "HUL"], ["NEW", "MCI"]],
            33: [["ARS", "NEW"], ["AVL", "CRY"], ["BRE", "LEE"], ["COV", "BHA"], ["HUL", "CHE"], ["IPS", "BOU"], ["MCI", "LIV"], ["NOT", "EVE"], ["TOT", "MUN"], ["FUL", "NEW"]],
            34: [["BOU", "AVL"], ["BHA", "IPS"], ["CHE", "BRE"], ["CRY", "FUL"], ["EVE", "ARS"], ["FUL", "LEE"], ["LIV", "TOT"], ["MUN", "COV"], ["NEW", "HUL"], ["NOT", "MCI"]],
            35: [["ARS", "BHA"], ["AVL", "NOT"], ["BRE", "BOU"], ["COV", "CHE"], ["HUL", "CRY"], ["IPS", "MUN"], ["LEE", "LIV"], ["MCI", "EVE"], ["TOT", "FUL"], ["NEW", "FUL"]],
            36: [["BOU", "MUN"], ["BHA", "FUL"], ["CHE", "IPS"], ["CRY", "BRE"], ["EVE", "AVL"], ["FUL", "MCI"], ["LIV", "COV"], ["NEW", "LEE"], ["NOT", "TOT"], ["SUN", "ARS"]],
            37: [["ARS", "LIV"], ["AVL", "SUN"], ["BRE", "HUL"], ["COV", "BOU"], ["IPS", "CRY"], ["LEE", "CHE"], ["MCI", "NEW"], ["MUN", "NOT"], ["TOT", "EVE"], ["FUL", "BHA"]],
            38: [["BOU", "NOT"], ["BHA", "MUN"], ["CHE", "AVL"], ["CRY", "ARS"], ["EVE", "FUL"], ["HUL", "COV"], ["LEE", "BRE"], ["LIV", "IPS"], ["MCI", "SUN"], ["TOT", "NEW"]]
        };

        let currentRound = 1;
        let activeTab = 'fixtures';
        let editMode = false;

        function switchTab(tabName) {
            activeTab = tabName;
            document.getElementById('fixturesToggleBtn').classList.toggle('active', tabName === 'fixtures');
            document.getElementById('standingsToggleBtn').classList.toggle('active', tabName === 'standings');
            
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            if(tabName === 'standings') {
                renderStandings();
                document.getElementById('standingsTab').classList.add('active');
            } else {
                renderFixtures();
                document.getElementById('fixturesTab').classList.add('active');
            }
        }

        function toggleEditMode() {
            if(!isAdmin) return;
            editMode = !editMode;
            document.getElementById('editToggleBtn').innerText = editMode ? "Lock Edit" : "Edit";
            document.getElementById('bulkEditBox').classList.toggle('visible', editMode);
            renderFixtures();
        }

        function updateScore(round, idx, type, val) {
            if(!isAdmin) return;
            let key = `r${round}_m${idx}_${type}`;
            db.ref('fpl_scores/' + key).set(val);
        }

        function processBulkText() {
            if(!isAdmin) return;
            let text = document.getElementById('bulkTextarea').value;
            let lines = text.split('\n');
            let matches = matchweeks[currentRound] || [];

            lines.forEach(line => {
                line = line.trim();
                if(!line) return;
                
                let scoreMatch = line.match(/(\d+)\s*[-–:]\s*(\d+)/);
                if(!scoreMatch) return;

                let hScore = scoreMatch[1];
                let aScore = scoreMatch[2];

                let parts = line.split(/[\d\-–:]+/);
                if(parts.length < 2) return;
                let team1Text = parts[0].trim().toLowerCase();
                let team2Text = parts[parts.length - 1].trim().toLowerCase();

                matches.forEach((match, idx) => {
                    let hTeam = teamsMap[match[0]];
                    let aTeam = teamsMap[match[1]];

                    let hMatch = team1Text.includes(hTeam.name.toLowerCase());
                    let aMatch = team2Text.includes(aTeam.name.toLowerCase());

                    if(hMatch && aMatch) {
                        db.ref(`fpl_scores/r${currentRound}_m${idx}_home`).set(hScore);
                        db.ref(`fpl_scores/r${currentRound}_m${idx}_away`).set(aScore);
                    }
                });
            });

            alert("Results updated and saved successfully!");
        }

        function calculateStandingsUpTo(roundLimit) {
            let calculated = {};
            for (let teamKey in teamsMap) {
                calculated[teamKey] = { key: teamKey, gf: 0, pts: 0 };
            }

            for (let round = 1; round <= roundLimit; round++) {
                let roundMatches = matchweeks[round];
                if(!roundMatches) continue;

                roundMatches.forEach((match, idx) => {
                    let hKey = match[0];
                    let aKey = match[1];
                    let hVal = scoresStorage[`r${round}_m${idx}_home`];
                    let aVal = scoresStorage[`r${round}_m${idx}_away`];

                    if (hVal !== undefined && aVal !== undefined && hVal !== '' && aVal !== '') {
                        let hScore = parseFloat(hVal);
                        let aScore = parseFloat(aVal);

                        calculated[hKey].gf += hScore;
                        calculated[aKey].gf += aScore;

                        if (hScore > aScore) {
                            calculated[hKey].pts += 3;
                        } else if (aScore > hScore) {
                            calculated[aKey].pts += 3;
                        } else {
                            calculated[hKey].pts += 1;
                            calculated[aKey].pts += 1;
                        }
                    }
                });
            }

            return Object.values(calculated).sort((a, b) => b.pts - a.pts || b.gf - a.gf);
        }

        function renderStandings() {
            const tbody = document.getElementById('standingsBody');
            tbody.innerHTML = '';
            
            document.getElementById('standingsHeaderTitle').innerText = `STANDINGS - AFTER GAMEWEEK ${currentRound}`;

            let sortedTeams = calculateStandingsUpTo(currentRound);

            sortedTeams.forEach((team, index) => {
                let teamInfo = teamsMap[team.key] || { name: team.key, logo: "" };

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:900;">${index + 1}</td>
                        <td class="team-cell">
                            <img src="${teamInfo.logo}" alt="${teamInfo.name}">
                            ${teamInfo.name}
                        </td>
                        <td>${team.gf}</td>
                        <td style="color:#ff005a; font-size:17px;">${team.pts}</td>
                    </tr>
                `;
            });
        }

        function renderFixtures() {
            const list = document.getElementById('fixturesList');
            document.getElementById('currentRoundTitle').innerText = `MATCHWEEK ${currentRound}`;
            document.getElementById('fixturesHeaderTitle').innerText = `MATCHWEEK ${currentRound} RESULTS`;
            list.innerHTML = '';

            let matches = matchweeks[currentRound] || [];
            matches.forEach((match, idx) => {
                let home = teamsMap[match[0]] || { name: match[0], logo: "" };
                let away = teamsMap[match[1]] || { name: match[1], logo: "" };

                let homeScore = scoresStorage[`r${currentRound}_m${idx}_home`] ?? '';
                let awayScore = scoresStorage[`r${currentRound}_m${idx}_away`] ?? '';

                let scoreContent = (editMode && isAdmin) ? `
                    <input type="number" class="score-input" value="${homeScore}" placeholder="0" oninput="updateScore(${currentRound}, ${idx}, 'home', this.value)">
                    <span style="font-weight:900; color:#fff;">:</span>
                    <input type="number" class="score-input" value="${awayScore}" placeholder="0" oninput="updateScore(${currentRound}, ${idx}, 'away', this.value)">
                ` : `
                    <span class="score-display">${homeScore !== '' ? homeScore : '-'}</span>
                    <span style="font-weight:900; color:#ffffff; font-size:16px;">VS</span>
                    <span class="score-display">${awayScore !== '' ? awayScore : '-'}</span>
                `;

                list.innerHTML += `
                    <div class="fixture-row">
                        <div class="team-box home">
                            <span>${home.name}</span>
                            <img src="${home.logo}">
                        </div>
                        <div class="match-score-center">
                            ${scoreContent}
                        </div>
                        <div class="team-box away">
                            <img src="${away.logo}">
                            <span>${away.name}</span>
                        </div>
                    </div>
                `;
            });
        }

        function changeRound(step) {
            currentRound += step;
            if(currentRound < 1) currentRound = 1;
            if(currentRound > 38) currentRound = 38;
            renderFixtures();
            if(activeTab === 'standings') {
                renderStandings();
            }
        }

        function downloadAsImage() {
            const targetId = activeTab === 'fixtures' ? 'captureFixtures' : 'captureStandings';
            const element = document.getElementById(targetId);

            html2canvas(element, {
                backgroundColor: null,
                scale: 3,
                useCORS: true,
                logging: false
            }).then(canvas => {
                canvas.toBlob(function(blob) {
                    let url = URL.createObjectURL(blob);
                    let link = document.createElement('a');
                    link.download = activeTab === 'fixtures' ? `Matchweek_${currentRound}_HD.png` : `League_Standings_Gw${currentRound}_HD.png`;
                    link.href = url;
                    
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                }, 'image/png');
            }).catch(err => {
                console.error("Capture failed:", err);
            });
        }

        checkAdminStatus();
        renderFixtures();
    </script>
</body>
</html>
