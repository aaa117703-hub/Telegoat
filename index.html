<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TELEGRAM GOAT - Premier League</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @font-face {
            font-family: 'SultanCustom';
            src: url('./Sultan.ttf') format('truetype');
        }
        @font-face {
            font-family: 'EnglishCustom';
            src: url('./english-font.ttf') format('truetype');
        }

        :root {
            --pl-dark-bg: #240024;
            --pl-pink: #ff005a;
            --pl-purple-btn: #38003c;
            --text-white: #ffffff;
            --border-dark: #5a055a;
            --font-ar: 'SultanCustom', sans-serif;
            --font-en: 'EnglishCustom', sans-serif;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: var(--font-ar); 
        }

        body { 
            background-color: var(--pl-dark-bg); 
            color: var(--text-white); 
            padding-bottom: 40px; 
            width: 100%;
            max-width: 768px;
            margin: 0 auto;
            padding: 0 10px;
        }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e0d33;
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: var(--font-en);
            font-weight: 900;
            font-size: 15px;
            border: 2px solid #ff005a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #toast.show {
            opacity: 1;
        }
        #toast .toast-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #ff005a;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .banner-container {
            position: relative;
            width: 100%;
            max-width: 768px;
            margin: 15px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background-color: #240024;
            line-height: 0;
            text-align: center;
        }

        .banner-container img {
            width: 100%;
            height: auto;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .banner-overlay-tabs {
            position: absolute;
            bottom: 4%;
            right: 2%;
            display: flex;
            background: #5d8eb6; 
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            direction: rtl;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0;
            padding: 2px;
            max-width: 96%;
        }

        .banner-tab-btn, .banner-tab-select {
            background: transparent;
            color: #ffffff;
            border: none;
            padding: 8px 12px;
            font-family: var(--font-ar);
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex: 1 1 auto;
            min-width: 50px;
        }

        .banner-tab-btn:hover {
            background: rgba(0,0,0,0.15);
        }

        .banner-tab-btn.active {
            background: var(--pl-purple-btn);
        }

        .banner-tab-select {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 8px;
            padding-left: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="10" viewBox="0 0 24 24" width="10" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: left 6px center;
            border-left: 1px solid rgba(255,255,255,0.2);
            min-width: 60px;
        }

        .banner-tab-select option {
            background: var(--pl-purple-btn);
            color: #fff;
        }

        .admin-edit-btn {
            display: none !important;
        }
        .admin-edit-btn.visible {
            display: inline-flex !important;
        }

        .header { 
            background-color: var(--pl-dark-bg); 
            color: #ffffff; 
            padding: 5px 10px 15px 10px; 
            text-align: center; 
        }

        .round-nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 5px 0;
            flex-wrap: wrap;
        }

        .round-indicator {
            font-family: var(--font-en);
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            text-align: center;
            padding: 5px 15px;
            border-radius: 8px;
            border: 2px dashed transparent;
            transition: 0.2s;
        }
        .round-indicator:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
        }

        .nav-arrow-btn {
            background: var(--pl-purple-btn);
            color: var(--text-white);
            border: 1px solid var(--border-dark);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .nav-arrow-btn:hover {
            background: var(--pl-pink);
            border-color: var(--pl-pink);
        }

        .main-container { 
            width: 100%; 
            max-width: 768px; 
            margin: 0 auto; 
            padding: 0 5px; 
        }

        #captureFixtures {
            padding: 20px 15px;
            background: linear-gradient(135deg, #3281ff 0%, #00d2ff 45%, #a835ff 100%), #4b92ff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 4px solid #ffffff;
        }

        .fixtures-header-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .fixtures-header-title {
            font-family: var(--font-en);
            font-size: 18px;
            font-weight: 900;
            color: #38003c;
            letter-spacing: 1px;
        }

        .fixture-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 8px 10px;
            margin-bottom: 6px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex-wrap: nowrap;
        }

        .team-box {
            font-family: var(--font-en);
            display: flex;
            align-items: center;
            width: 36%;
            font-size: 12px;
            font-weight: 800;
            color: #38003c;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .team-box.home { justify-content: flex-end; text-align: right; }
        .team-box.away { justify-content: flex-start; text-align: left; }
        
        .team-box img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            margin: 0 4px;
            background: transparent;
            border-radius: 0;
            padding: 0;
            flex-shrink: 0;
        }

        .match-score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 22%;
            background: #7138f5;
            padding: 4px 6px;
            border-radius: 6px;
            position: relative;
            min-width: 60px;
            flex-shrink: 0;
        }

        .score-display {
            font-family: var(--font-en);
            font-size: 13px;
            font-weight: 900;
            color: #ffffff;
        }

        .score-input {
            font-family: var(--font-en);
            width: 32px;
            height: 24px;
            text-align: center;
            font-size: 12px;
            font-weight: 900;
            background: #ffffff;
            color: #38003c;
            border: 1px solid #7138f5;
            border-radius: 4px;
            outline: none;
        }

        /* ===== جدول الترتيب ===== */
        #captureStandings {
            display: flex;
            flex-wrap: wrap;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 4px solid #ffffff;
            width: 100%;
        }

        .standings-sidebar {
            width: 130px;
            background: linear-gradient(180deg, #6c32f8 0%, #3281ff 50%, #10b981 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 8px;
            color: #ffffff;
            text-align: center;
            flex-shrink: 0;
            min-height: 200px;
        }

        .standings-sidebar img {
            width: 100%;
            max-width: 120px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
            display: block;
            border-radius: 8px;
        }

        .standings-content-area {
            flex: 1;
            background: #f4f5f7;
            overflow-x: auto;
            min-width: 200px;
            padding: 10px;
            display: block !important;
        }

        .standings-card { 
            background: transparent; 
            border-radius: 0; 
            overflow: visible; 
            padding: 5px;
            width: 100%;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: center; 
            font-size: 12px; 
            color: #333; 
            display: table !important;
        }
        
        th { 
            font-family: var(--font-en); 
            background-color: transparent; 
            color: #38003c; 
            padding: 10px 4px; 
            font-weight: 900; 
            border-bottom: 2px solid #38003c; 
            font-size: 12px;
        }

        td { 
            font-family: var(--font-en); 
            padding: 6px 4px; 
            border-bottom: 1px solid #e2e8f0; 
            font-weight: 800; 
            font-size: 12px;
        }
        
        .team-cell { 
            font-family: var(--font-en); 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            font-weight: 800; 
            text-transform: uppercase; 
            color: #1a1a1a;
            font-size: 12px;
        }
        
        .team-cell img { 
            width: 20px; 
            height: 20px; 
            margin-left: 6px; 
            object-fit: contain;
            background: transparent;
            border-radius: 0;
            padding: 0;
        }

        /* ===== الخطوط المضيئة ===== */
        .glow-green {
            border-bottom: 2px solid #00ff87;
            box-shadow: 0 4px 20px rgba(0, 255, 135, 0.8);
            transition: 0.3s ease;
        }

        .glow-red {
            border-bottom: 2px solid #ff005a;
            box-shadow: 0 4px 20px rgba(255, 0, 90, 0.8);
            transition: 0.3s ease;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        @media screen and (max-width: 600px) {
            body {
                padding: 0 5px;
            }

            .banner-container {
                border-width: 3px;
                border-radius: 16px;
            }

            .banner-overlay-tabs {
                bottom: 4%;
                right: 1%;
                max-width: 98%;
                border-radius: 6px;
                padding: 3px 0;
                gap: 0;
            }

            .banner-tab-btn, .banner-tab-select {
                font-size: 10px;
                padding: 5px 6px;
                min-width: 35px;
                flex: 1 1 20%;
            }

            .banner-tab-select {
                min-width: 45px;
                padding-right: 6px;
                padding-left: 14px;
                background-size: 7px;
            }

            .round-indicator {
                font-size: 15px;
            }

            .nav-arrow-btn {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }

            #captureFixtures {
                padding: 15px 10px;
                border-radius: 16px;
                border-width: 3px;
            }

            .fixtures-header-title {
                font-size: 16px;
            }

            .fixture-row {
                padding: 6px 8px;
                flex-wrap: nowrap;
            }

            .team-box {
                font-size: 10px !important;
                width: 34%;
                letter-spacing: -0.2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .team-box img {
                width: 18px;
                height: 18px;
                margin: 0 3px;
            }

            .match-score-center {
                width: 24%;
                min-width: 50px;
                padding: 3px 4px;
            }

            .score-display {
                font-size: 11px;
            }

            .score-input {
                width: 26px;
                height: 18px;
                font-size: 10px;
            }

            #captureStandings {
                flex-direction: column;
                border-radius: 16px;
                border-width: 3px;
                overflow: hidden;
            }

            .standings-sidebar {
                width: 100%;
                flex-direction: row;
                padding: 10px;
                justify-content: center;
                align-items: center;
                border-radius: 16px 16px 0 0;
                min-height: 80px;
            }

            .standings-sidebar img {
                max-width: 100px;
            }

            .standings-content-area {
                min-width: unset;
                width: 100%;
                padding: 5px;
                overflow-x: auto;
                display: block !important;
                border-radius: 0 0 16px 16px;
            }

            .standings-card {
                padding: 5px 0;
            }

            table {
                font-size: 10px;
                display: table !important;
                width: 100%;
            }

            th {
                font-size: 10px;
                padding: 6px 4px;
            }

            td {
                font-size: 10px;
                padding: 6px 4px;
            }

            .team-cell {
                font-size: 10px;
            }

            .team-cell img {
                width: 16px;
                height: 16px;
                margin-left: 4px;
            }

            .glow-green, .glow-red {
                border-bottom-width: 2px;
                box-shadow: 0 2px 12px rgba(0, 255, 135, 0.6);
            }
            .glow-red {
                box-shadow: 0 2px 12px rgba(255, 0, 90, 0.6);
            }
        }

        @media screen and (min-width: 601px) and (max-width: 768px) {
            .banner-tab-btn, .banner-tab-select {
                font-size: 11px;
                padding: 7px 10px;
            }

            .team-box {
                font-size: 11px;
            }

            .team-box img {
                width: 22px;
                height: 22px;
            }

            .score-display {
                font-size: 12px;
            }

            .score-input {
                width: 30px;
                height: 22px;
                font-size: 11px;
            }

            .standings-sidebar {
                width: 100px;
            }
        }
    </style>
</head>
<body>

    <div id="toast">
        <span id="toastContent">جاري الحفظ...</span>
    </div>

    <div class="banner-container">
        <img id="bannerImg" src="image_5.png" alt="Premier League Banner" onerror="handleBannerError(this)">
        
        <div class="banner-overlay-tabs">
            <select class="banner-tab-select" id="roundSelect" onchange="selectRound(this.value)"></select>
            <button class="banner-tab-btn active" id="fixturesToggleBtn" onclick="switchTab('fixtures')">المواجهات</button>
            <button class="banner-tab-btn" id="standingsToggleBtn" onclick="switchTab('standings')">الترتيب</button>
            <button class="banner-tab-btn" onclick="downloadAsImage()">حفظ الصورة</button>
            <button class="banner-tab-btn admin-edit-btn" id="editToggleBtn" onclick="toggleEditMode()">تعديل</button>
        </div>
    </div>

    <div class="header">
        <div class="round-nav-container">
            <button class="nav-arrow-btn" onclick="changeRound(-1)">&lt;</button>
            <div class="round-indicator" id="currentRoundTitle" ondblclick="unlockEditWithPassword()">MATCHWEEK 1</div>
            <button class="nav-arrow-btn" onclick="changeRound(1)">&gt;</button>
        </div>
    </div>

    <div class="main-container">

        <div id="fixturesTab" class="tab-content active">
            <div id="captureFixtures" class="export-area">
                <div class="fixtures-header-box">
                    <div class="fixtures-header-title" id="fixturesBannerTitle">MATCHWEEK RESULTS</div>
                </div>
                <div id="fixturesList"></div>
            </div>
        </div>

        <div id="standingsTab" class="tab-content">
            <div id="captureStandings" class="export-area">
                <div class="standings-sidebar">
                    <img src="img/premire_League2.png-.webp" alt="Premier League" onerror="this.style.display='none'">
                </div>
                <div class="standings-content-area">
                    <div class="standings-card">
                        <table>
                            <thead>
                                <tr>
                                    <th>Pos</th>
                                    <th style="text-align: right; padding-right: 15px;">Club</th>
                                    <th>GF</th>
                                    <th>Pts</th>
                                </tr>
                            </thead>
                            <tbody id="standingsBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        // 1. STATE
        // ============================================================
        let isAdmin = localStorage.getItem('fpl_admin') === 'true';
        let editMode = isAdmin;
        let scoresStorage = JSON.parse(localStorage.getItem('fpl_scores')) || {};
        let currentRound = 1;
        let activeTab = 'fixtures';
        let isSaving = false;

        // ============================================================
        // 2. TOAST
        // ============================================================
        let toastTimeout = null;
        function showToast(msg, isSuccess = false) {
            const toast = document.getElementById('toast');
            const content = document.getElementById('toastContent');
            
            if (toastTimeout) clearTimeout(toastTimeout);
            
            if (isSuccess) {
                content.innerHTML = `✅ ${msg}`;
            } else {
                content.innerHTML = `<span class="toast-spinner"></span> ${msg}`;
            }
            
            toast.classList.add('show');
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ===========================================================
