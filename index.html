<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TELEGRAM GOAT - Premier League</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        @font-face {
            font-family: 'SultanCustom';
            src: url('./Sultan.ttf') format('truetype');
        }
        @font-face {
            font-family: 'EnglishCustom';
            src: url('./english-font.ttf') format('truetype');
        }

        :root {
            --pl-dark-bg: #240024;
            --pl-pink: #ff005a;
            --pl-purple-btn: #38003c;
            --text-white: #ffffff;
            --border-dark: #5a055a;
            --font-ar: 'SultanCustom', sans-serif;
            --font-en: 'EnglishCustom', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-ar);
        }

        body {
            background-color: var(--pl-dark-bg);
            color: var(--text-white);
            padding-bottom: 40px;
            width: 100%;
            max-width: 768px;
            margin: 0 auto;
            padding: 0 10px;
        }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e0d33;
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: var(--font-en);
            font-weight: 900;
            font-size: 15px;
            border: 2px solid #ff005a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #toast.show {
            opacity: 1;
        }
        #toast .toast-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #ff005a;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .banner-container {
            position: relative;
            width: 100%;
            max-width: 768px;
            margin: 15px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background-color: #240024;
            line-height: 0;
            text-align: center;
        }

        .banner-container img {
            width: 100%;
            height: auto;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .banner-overlay-tabs {
            position: absolute;
            bottom: 4%;
            right: 2%;
            display: flex;
            background: #5d8eb6;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            direction: rtl;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0;
            padding: 2px;
            max-width: 96%;
        }

        .banner-tab-btn,
        .banner-tab-select {
            background: transparent;
            color: #ffffff;
            border: none;
            padding: 8px 12px;
            font-family: var(--font-ar);
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex: 1 1 auto;
            min-width: 50px;
        }

        .banner-tab-btn:hover {
            background: rgba(0, 0, 0, 0.15);
        }

        .banner-tab-btn.active {
            background: var(--pl-purple-btn);
        }

        .banner-tab-select {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 8px;
            padding-left: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="10" viewBox="0 0 24 24" width="10" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: left 6px center;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            min-width: 60px;
        }

        .banner-tab-select option {
            background: var(--pl-purple-btn);
            color: #fff;
        }

        .admin-edit-btn {
            display: none !important;
        }

        .header {
            background-color: var(--pl-dark-bg);
            color: #ffffff;
            padding: 5px 10px 15px 10px;
            text-align: center;
        }

        .round-nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 5px 0;
            flex-wrap: wrap;
        }

        .round-indicator {
            font-family: var(--font-en);
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            text-align: center;
            padding: 6px 20px;
            border-radius: 8px;
            border: 2px dashed transparent;
            transition: 0.2s;
        }
        .round-indicator:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .main-container {
            width: 100%;
            max-width: 768px;
            margin: 0 auto;
            padding: 0 5px;
        }

        #captureFixtures {
            padding: 20px 15px;
            background: linear-gradient(135deg, #3281ff 0%, #00d2ff 45%, #a835ff 100%), #4b92ff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 4px solid #ffffff;
        }

        .fixtures-header-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .fixtures-header-title {
            font-family: var(--font-en);
            font-size: 18px;
            font-weight: 900;
            color: #38003c;
            letter-spacing: 1px;
        }

        .fixture-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            flex-wrap: nowrap;
        }

        .team-box {
            font-family: var(--font-en);
            display: flex;
            align-items: center;
            width: 36%;
            font-size: 14px;
            font-weight: 800;
            color: #38003c;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .team-box.home {
            justify-content: flex-end;
            text-align: right;
        }
        .team-box.away {
            justify-content: flex-start;
            text-align: left;
        }

        .team-box img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            margin: 0 4px;
            background: transparent;
            flex-shrink: 0;
        }

        .match-score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 22%;
            background: #7138f5;
            padding: 6px 8px;
            border-radius: 6px;
            position: relative;
            min-width: 70px;
            flex-shrink: 0;
        }

        /* توحيد خط الأرقام في المواجهات مع خط الأرقام في الترتيب */
        .score-display,
        .score-input,
        .pos-number,
        .stat-number {
            font-family: var(--font-en);
            font-size: 16px;
            font-weight: 900;
            line-height: 1.4;
            display: inline-block;
            vertical-align: middle;
        }

        .score-display {
            color: #ffffff;
        }

        .score-input {
            width: 36px;
            height: 26px;
            text-align: center;
            background: #ffffff;
            color: #38003c;
            border: 1px solid #7138f5;
            border-radius: 4px;
            outline: none;
            padding: 0;
        }

        .vs-text {
            font-weight: 900;
            color: #ffffff;
            font-family: var(--font-en);
            font-size: 14px;
        }

        #captureStandings {
            display: flex;
            flex-wrap: wrap;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 4px solid #ffffff;
            width: 100%;
        }

        .standings-sidebar {
            width: 140px;
            background: linear-gradient(180deg, #6C2BD9 0%, #3B82F6 50%, #10B981 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: #ffffff;
            text-align: center;
            flex-shrink: 0;
            min-height: 280px;
            border-radius: 16px 0 0 16px;
        }

        .standings-sidebar img {
            width: 200%;
            max-width: 330px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            display: block;
            border-radius: 8px;
        }

        .standings-content-area {
            flex: 1;
            background: #f4f5f7;
            overflow-x: visible;
            min-width: 200px;
            padding: 10px;
            display: block !important;
        }

        .standings-card {
            background: transparent;
            border-radius: 0;
            overflow: visible;
            padding: 5px;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
            text-align: center;
            color: #333;
            display: table !important;
        }

        th {
            font-family: var(--font-en);
            background-color: transparent;
            color: #38003c;
            padding: 10px 4px;
            font-weight: 900;
            border-bottom: 2px solid #38003c;
            font-size: 13px;
            vertical-align: middle;
        }

        td {
            font-family: var(--font-en);
            padding: 10px 6px;
            font-weight: 800;
            vertical-align: middle;
            line-height: 1.4;
            background-color: #ffffff;
            border: none;
        }

        tr {
            border: none;
        }

        /* خطوط عادية بدون إضاءة */
        tr.green-line td {
            border-bottom: 3px solid #00ff87 !important;
        }

        tr.red-line td {
            border-bottom: 3px solid #ff005a !important;
        }

        .team-cell {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            font-size: 14px;
            text-transform: uppercase;
            color: #1a1a1a;
            padding: 0;
        }

        .team-cell img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            flex-shrink: 0;
            display: block;
        }

        /* تحسين محاذاة الأسهم والأرقام */
        .pos-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            vertical-align: middle;
        }

        .pos-indicator-img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            display: inline-block;
            flex-shrink: 0;
            vertical-align: middle;
        }

        .pos-number {
            font-size: 16px;
            font-weight: 900;
            line-height: 1.4;
            min-width: 20px;
            text-align: center;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        @media screen and (max-width: 600px) {
            body { padding: 0 5px; }
            .banner-container {
                border-width: 3px;
                border-radius: 16px;
            }
            .banner-overlay-tabs {
                bottom: 4%;
                right: 1%;
                max-width: 98%;
                border-radius: 6px;
                padding: 3px 0;
                gap: 0;
            }
            .banner-tab-btn,
            .banner-tab-select {
                font-size: 10px;
                padding: 5px 6px;
                min-width: 35px;
                flex: 1 1 20%;
            }
            .banner-tab-select {
                min-width: 45px;
                padding-right: 6px;
                padding-left: 14px;
                background-size: 7px;
            }
            .round-indicator {
                font-size: 16px;
            }
            #captureFixtures {
                padding: 15px 10px;
                border-radius: 16px;
                border-width: 3px;
            }
            .fixtures-header-title {
                font-size: 16px;
            }
            .fixture-row {
                padding: 6px 8px;
                flex-wrap: nowrap;
            }
            .team-box {
                font-size: 13px;
                width: 34%;
            }
            .team-box img {
                width: 18px;
                height: 18px;
                margin: 0 3px;
            }
            .match-score-center {
                width: 24%;
                min-width: 60px;
                padding: 4px;
            }
            .score-display,
            .score-input,
            .pos-number,
            .stat-number {
                font-size: 15px;
            }
            .score-input {
                width: 30px;
                height: 22px;
            }
            .vs-text {
                font-size: 12px;
            }
            .pos-indicator-img {
                width: 22px;
                height: 22px;
            }

            #captureStandings {
                flex-direction: column;
                border-radius: 16px;
                border-width: 3px;
                overflow: hidden;
            }

            .standings-sidebar {
                width: 100%;
                flex-direction: row;
                padding: 15px 10px;
                justify-content: center;
                align-items: center;
                border-radius: 16px 16px 0 0;
                min-height: 100px;
            }

            .standings-sidebar img {
                max-width: 170px;
            }

            .standings-content-area {
                min-width: unset;
                width: 100%;
                padding: 5px;
                overflow-x: visible;
                display: block !important;
                border-radius: 0 0 16px 16px;
            }

            .standings-card {
                padding: 5px 0;
            }
            table {
                width: 100%;
            }
            th {
                font-size: 12px;
                padding: 6px 4px;
            }
            td {
                font-size: 12px;
                padding: 8px 4px;
            }
            .team-cell {
                font-size: 13px;
            }
            .team-cell img {
                width: 18px;
                height: 18px;
            }
            tr.green-line td,
            tr.red-line td {
                border-bottom-width: 2px !important;
            }
        }
    </style>
</head>
<body>

    <div id="toast">
        <span id="toastContent">جاري الحفظ...</span>
    </div>

    <div class="banner-container">
        <img id="bannerImg" src="image_5.png" alt="Premier League Banner" onerror="handleBannerError(this)">

        <div class="banner-overlay-tabs">
            <select class="banner-tab-select" id="roundSelect" onchange="selectRound(this.value)"></select>
            <button class="banner-tab-btn active" id="fixturesToggleBtn" onclick="switchTab('fixtures')">المواجهات</button>
            <button class="banner-tab-btn" id="standingsToggleBtn" onclick="switchTab('standings')">الترتيب</button>
            <button class="banner-tab-btn" onclick="downloadAsImage()">حفظ الصورة</button>
            <button class="banner-tab-btn admin-edit-btn" id="editToggleBtn" onclick="toggleEditMode()" style="display: none !important;">تعديل</button>
        </div>
    </div>

    <div class="header">
        <div class="round-nav-container">
            <div class="round-indicator" id="currentRoundTitle" ondblclick="unlockEditWithPassword()">MATCHWEEK 1</div>
        </div>
    </div>

    <div class="main-container">

        <div id="fixturesTab" class="tab-content active">
            <div id="captureFixtures" class="export-area">
                <div class="fixtures-header-box">
                    <div class="fixtures-header-title" id="fixturesBannerTitle">MATCHWEEK RESULTS</div>
                </div>
                <div id="fixturesList"></div>
            </div>
        </div>

        <div id="standingsTab" class="tab-content">
            <div id="captureStandings" class="export-area">
                <div class="standings-sidebar">
                    <img src="premire_League2.png-.webp" alt="Premier League" onerror="this.style.display='none'">
                </div>
                <div class="standings-content-area">
                    <div class="standings-card">
                        <table>
                            <thead>
                                <tr>
                                    <th>Pos</th>
                                    <th style="text-align: right; padding-right: 15px;">Club</th>
                                    <th>GF</th>
                                    <th>Pts</th>
                                </tr>
                            </thead>
                            <tbody id="standingsBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let editMode = false;
        let scoresStorage = JSON.parse(localStorage.getItem('fpl_scores')) || {};
        let currentRound = 1;
        let activeTab = 'fixtures';
        let isSaving = false;

        let toastTimeout = null;

        function showToast(msg, isSuccess = false) {
            const toast = document.getElementById('toast');
            const content = document.getElementById('toastContent');

            if (toastTimeout) clearTimeout(toastTimeout);

            if (isSuccess) {
                content.innerHTML = `✅ ${msg}`;
            } else {
                content.innerHTML = `<span class="toast-spinner"></span> ${msg}`;
            }

            toast.classList.add('show');

            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        let bannerAttempts = 0;
        const bannerSources = ["image_5.png", "image_5.PNG", "image_5.jpg", "image_5.JPG", "banner.png"];

        function handleBannerError(img) {
            bannerAttempts++;
            if (bannerAttempts < bannerSources.length) {
                img.src = bannerSources[bannerAttempts];
            } else {
                img.src = 'https://dummyimage.com/768x180/00bfff/fff&text=Banner+Missing';
            }
        }

        const teamsMap = {
            "ARS": { name: "Arsenal", logo: "arsenal.png.WEBP" },
            "AVL": { name: "Aston Villa", logo: "aston_villa.png.WEBP" },
            "BOU": { name: "Bournemouth", logo: "bournemouth.png.WEBP" },
            "BRE": { name: "Brentford", logo: "brentford.png.PNG" },
            "BHA": { name: "Brighton", logo: "brighton.png.WEBP" },
            "CHE": { name: "Chelsea", logo: "chelsea.png.WEBP" },
            "COV": { name: "Coventry", logo: "coventry.png.WEBP" },
            "CRY": { name: "Crystal Palace", logo: "crystal_palace.png.WEBP" },
            "EVE": { name: "Everton", logo: "everton.png.WEBP" },
            "FUL": { name: "Fulham", logo: "fulham.png.WEBP" },
            "HUL": { name: "Hull", logo: "hull.png.WEBP" },
            "IPS": { name: "Ipswich", logo: "ipswich.png.WEBP" },
            "LEE": { name: "Leeds", logo: "leeds.png.WEBP" },
            "LIV": { name: "Liverpool", logo: "liverpool.png.WEBP" },
            "MCI": { name: "Man City", logo: "man_city.png.WEBP" },
            "MUN": { name: "Man Utd", logo: "man_utd.png.WEBP" },
            "NEW": { name: "Newcastle", logo: "newcastle.png.WEBP" },
            "NOT": { name: "Nott'm Forest", logo: "forest.png" },
            "SUN": { name: "Sunderland", logo: "sunderland.png.WEBP" },
            "TOT": { name: "Spurs", logo: "tottenham.png.WEBP" }
        };

        const initialBasePoints = {};
        Object.keys(teamsMap).forEach(key => {
            initialBasePoints[key] = { gf: 0, pts: 0 };
        });

        const matchweeks = {
            1: [["ARS", "COV"],["HUL", "MUN"],["EVE", "CRY"],["IPS", "SUN"],["NOT", "LEE"],["BRE", "TOT"],["BHA", "AVL"],["MCI", "BOU"],["NEW", "LIV"],["FUL", "CHE"]],
            2: [["BOU", "EVE"],["AVL", "ARS"],["CHE", "BHA"],["COV", "HUL"],["CRY", "MCI"],["LEE", "BRE"],["LIV", "NOT"],["MUN", "IPS"],["SUN", "FUL"],["TOT", "NEW"]],
            3: [["ARS", "CHE"],["BRE", "SUN"],["BHA", "LEE"],["EVE", "MUN"],["FUL", "CRY"],["HUL", "AVL"],["IPS", "LIV"],["MCI", "COV"],["NEW", "BOU"],["NOT", "TOT"]],
            4: [["BOU", "BRE"],["AVL", "NOT"],["CHE", "HUL"],["COV", "BHA"],["CRY", "IPS"],["LEE", "NEW"],["LIV", "FUL"],["MUN", "MCI"],["SUN", "ARS"],["TOT", "EVE"]],
            5: [["BOU", "LIV"],["BRE", "CHE"],["BHA", "ARS"],["EVE", "IPS"],["FUL", "MUN"],["LEE", "CRY"],["MCI", "SUN"],["NEW", "HUL"],["NOT", "COV"],["TOT", "AVL"]],
            6: [["ARS", "LEE"],["AVL", "BRE"],["CHE", "BOU"],["COV", "NEW"],["CRY", "NOT"],["HUL", "EVE"],["IPS", "FUL"],["LIV", "MCI"],["MUN", "TOT"],["SUN", "BHA"]],
            7: [["BOU", "SUN"],["BRE", "LIV"],["BHA", "CRY"],["EVE", "CHE"],["FUL", "HUL"],["LEE", "MUN"],["MCI", "IPS"],["NEW", "AVL"],["NOT", "ARS"],["TOT", "COV"]],
            8: [["ARS", "EVE"],["AVL", "MCI"],["CHE", "TOT"],["COV", "FUL"],["CRY", "NEW"],["HUL", "BRE"],["IPS", "NOT"],["LIV", "BHA"],["MUN", "BOU"],["SUN", "LEE"]],
            9: [["BOU", "LEE"],["BRE", "NOT"],["CHE", "MUN"],["COV", "SUN"],["HUL", "IPS"],["LIV", "ARS"],["MCI", "BHA"],["NEW", "EVE"],["TOT", "CRY"],["AVL", "FUL"]],
            10: [["ARS", "HUL"],["BHA", "BRE"],["CRY", "LIV"],["EVE", "COV"],["FUL", "NEW"],["IPS", "BOU"],["LEE", "TOT"],["MUN", "AVL"],["NOT", "MCI"],["SUN", "CHE"]],
            11: [["BRE", "EVE"],["CHE", "LEE"],["COV", "CRY"],["HUL", "BHA"],["LIV", "MUN"],["MCI", "FUL"],["NEW", "ARS"],["TOT", "IPS"],["NOT", "SUN"],["AVL", "CRY"]],
            12: [["ARS", "MCI"],["BHA", "NEW"],["CRY", "HUL"],["EVE", "LIV"],["FUL", "BOU"],["IPS", "AVL"],["LEE", "COV"],["MUN", "BRE"],["NOT", "CHE"],["SUN", "TOT"]],

        function initRoundDropdown() {
            const select = document.getElementById('roundSelect');
            select.innerHTML = '';
            for (let i = 1; i <= 38; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `الجولة ${i}`;
                if (i === currentRound) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function selectRound(val) {
            currentRound = parseInt(val);
            renderFixtures();
        }

        function switchTab(tabName) {
            activeTab = tabName;
            document.getElementById('fixturesToggleBtn').classList.toggle('active', tabName === 'fixtures');
            document.getElementById('standingsToggleBtn').classList.toggle('active', tabName === 'standings');

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            if (tabName === 'standings') {
                renderStandings();
                document.getElementById('standingsTab').classList.add('active');
            } else {
                document.getElementById('fixturesTab').classList.add('active');
            }
        }

        function unlockEditWithPassword() {
            const pass = prompt("أدخل رمز الحماية لتفعيل زر التعديل:");
            if (pass === "1999") {
                editMode = true;
                const editBtn = document.getElementById('editToggleBtn');
                editBtn.style.setProperty('display', 'inline-flex', 'important');
                editBtn.innerText = "حفظ";
                renderFixtures();
                alert("تم تفعيل صلاحيات المدير بنجاح!");
            } else if (pass !== null) {
                alert("الرمز غير صحيح!");
            }
        }

        function toggleEditMode() {
            const btn = document.getElementById('editToggleBtn');

            if (!editMode) {
                editMode = true;
                btn.innerText = "حفظ";
                renderFixtures();
                return;
            }

            if (isSaving) return;

            showToast("جاري الحفظ...", false);

            const matches = matchweeks[currentRound] || [];
            matches.forEach((match, idx) => {
                const homeInput = document.getElementById(`home_r${currentRound}_m${idx}`);
                const awayInput = document.getElementById(`away_r${currentRound}_m${idx}`);
                if (homeInput && awayInput) {
                    scoresStorage[`r${currentRound}_m${idx}_home`] = homeInput.value;
                    scoresStorage[`r${currentRound}_m${idx}_away`] = awayInput.value;
                }
            });

            isSaving = true;
            btn.disabled = true;

            localStorage.setItem('fpl_scores', JSON.stringify(scoresStorage));

            setTimeout(() => {
                isSaving = false;
                btn.disabled = false;
                showToast("تم الحفظ ✓", true);
                editMode = false;
                btn.style.setProperty('display', 'none', 'important');
                btn.innerText = "تعديل";
                renderFixtures();
                renderStandings();
            }, 300);
        }

        function updateScore(round, idx, type, val, inputElement) {
            scoresStorage[`r${round}_m${idx}_${type}`] = val;
        }
