<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELEGRAM GOAT - Premier League Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pl-dark-bg: #240024;      /* خلفية بنفسجية داكنة جداً */
            --pl-dark-card: #2f012f;    /* لون كروت أغمق سنتاً */
            --pl-purple-header: #38003c;
            --pl-pink: #ff005a;         /* الوردي الرسمي */
            --pl-green: #00ff85;        /* أخضر الفانتزي */
            --text-white: #ffffff;
            --border-dark: #3f033f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--pl-dark-bg); color: var(--text-white); padding-bottom: 40px; }

        /* Navigation Header */
        .header { 
            background-color: var(--pl-dark-bg); 
            color: #ffffff; 
            padding: 20px 15px; 
            text-align: center; 
            border-bottom: 1px solid var(--border-dark); 
        }
        .league-title { 
            font-size: 26px; 
            font-weight: 900; 
            letter-spacing: 2px; 
            color: #ffffff;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .action-bar { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

        .btn { 
            background: transparent; 
            color: #ffffff; 
            border: 2px solid #ffffff; 
            padding: 8px 18px; 
            border-radius: 20px; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 13px; 
            transition: 0.2s;
        }
        .btn:hover, .btn.active-btn { background: #ffffff; color: var(--pl-dark-bg); }
        .btn-pink { border-color: var(--pl-pink); color: var(--pl-pink); }
        .btn-pink:hover { background: var(--pl-pink); color: #ffffff; }

        .main-container { max-width: 700px; margin: 20px auto; padding: 0 12px; }

        /* Fixtures Styling - Same as Image */
        .matchweek-card { background: transparent; padding: 10px 0; }
        
        .round-selector { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            padding: 10px; 
            border-bottom: 1px solid var(--border-dark);
        }
        
        .fixture-row { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 18px 10px;
            margin-bottom: 10px;
            background: var(--pl-dark-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .team-box {
            display: flex;
            align-items: center;
            width: 40%;
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }
        .team-box.home { justify-content: flex-end; text-align: right; }
        .team-box.away { justify-content: flex-start; text-align: left; }
        
        .team-box img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin: 0 12px;
        }

        .match-score-center {
            width: 20%;
            text-align: center;
            background: #ffffff;
            color: var(--pl-dark-bg);
            font-weight: 900;
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 4px;
            margin: 0 10px;
        }

        /* Standings Table - Dark Theme */
        .standings-card { background: var(--pl-dark-bg); border-radius: 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; color: #ffffff; }
        th { background-color: var(--pl-dark-card); color: #a892a8; padding: 14px 8px; font-weight: 800; border-bottom: 1px solid var(--border-dark); }
        td { padding: 12px 8px; border-bottom: 1px solid var(--border-dark); font-weight: 800; }
        
        .team-cell { display: flex; align-items: center; justify-content: flex-start; font-weight: 800; text-transform: uppercase; }
        .team-cell img { width: 26px; height: 26px; margin-left: 10px; object-fit: contain; }

        .pts-col { color: var(--pl-green); font-weight: 900; }
        .gf-col { color: #ffffff; font-weight: 800; }

        /* Admin Panel */
        .admin-panel { background: var(--pl-dark-card); border-radius: 12px; padding: 20px; margin-bottom: 25px; border: 2px dashed var(--pl-pink); display: none; }
        .admin-panel.active { display: block; }
        .admin-match-input { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 8px; background: var(--pl-dark-bg); border-radius: 6px; }
        .input-pts { width: 60px; text-align: center; padding: 6px; font-weight: 800; border: 1px solid #ffffff; background: transparent; color: #fff; border-radius: 4px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <div class="league-title">TELEGRAM GOAT</div>
        <div class="action-bar">
            <button class="btn active-btn" onclick="switchTab('fixtures', this)">🎮 المواجهات</button>
            <button class="btn" onclick="switchTab('standings', this)">📊 الترتيب العام</button>
            <button class="btn btn-pink" onclick="toggleAdmin()">🔧 لوحة الإدارة</button>
        </div>
    </div>

    <div class="main-container">

        <!-- Admin Panel -->
        <div id="adminPanel" class="admin-panel">
            <h3 style="color: var(--pl-pink); margin-bottom: 10px;">لوحة تحكم إدخال النقاط</h3>
            <div id="adminFixturesInputs"></div>
            <button class="btn btn-pink" style="margin-top: 15px; width: 100%;" onclick="saveScores()">💾 حفظ النقاط وتحديث الترتيب</button>
        </div>

        <!-- Fixtures Tab -->
        <div id="fixturesTab" class="tab-content active">
            <div class="matchweek-card">
                <div class="round-selector">
                    <button class="btn" onclick="changeRound(-1)">◀ الجولة السابقة</button>
                    <span id="currentRoundTitle" style="font-weight: 900; font-size: 18px;">MATCHWEEK 1</span>
                    <button class="btn" onclick="changeRound(1)">الجولة التالية ▶</button>
                </div>
                <div id="fixturesList"></div>
            </div>
        </div>

        <!-- Standings Tab -->
        <div id="standingsTab" class="tab-content">
            <div class="standings-card">
                <table>
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th style="text-align: right; padding-right: 20px;">Club</th>
                            <th>GF</th>
                            <th>Pts</th>
                        </tr>
                    </thead>
                    <tbody id="standingsBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const teamsMap = {
            "ARSENAL": { name: "Arsenal", logo: "arsenal.png.WEBP" },
            "ASTON VILLA": { name: "Aston Villa", logo: "aston_villa.png.WEBP" },
            "BOURNEMOUTH": { name: "Bournemouth", logo: "bournemouth.png.WEBP" },
            "BRENTFORD": { name: "Brentford", logo: "brentford.png.PNG" },
            "BRIGHTON": { name: "Brighton", logo: "brighton.png.WEBP" },
            "CHELSEA": { name: "Chelsea", logo: "chelsea.png.WEBP" },
            "COVENTRY": { name: "Coventry", logo: "coventry.png.WEBP" },
            "CRYSTAL PALACE": { name: "Crystal Palace", logo: "crystal_palace.png.WEBP" },
            "EVERTON": { name: "Everton", logo: "everton.png.WEBP" },
            "FULHAM": { name: "Fulham", logo: "fulham.png.WEBP" },
            "HULL": { name: "Hull", logo: "hull.png.WEBP" },
            "IPSWICH": { name: "Ipswich", logo: "ipswich.png.WEBP" },
            "LEEDS": { name: "Leeds", logo: "leeds.png.WEBP" },
            "LIVERPOOL": { name: "Liverpool", logo: "liverpool.png.WEBP" },
            "MAN CITY": { name: "Man City", logo: "man_city.png.WEBP" },
            "MAN UTD": { name: "Man Utd", logo: "man_utd.png.WEBP" },
            "NEWCASTLE": { name: "Newcastle", logo: "newcastle.png.WEBP" },
            "NOTTINGHAM": { name: "Nott'm Forest", logo: "forest.png.PNG" },
            "SUNDERLAND": { name: "Sunderland", logo: "sunderland.png.WEBP" },
            "TOTTENHAM": { name: "Spurs", logo: "tottenham.png.WEBP" }
        };

        const teamsData = [
            { id: 1, name: "LIVERPOOL", key: "LIVERPOOL", gf: 6, pts: 1787 },
            { id: 2, name: "BRIGHTON", key: "BRIGHTON", gf: 6, pts: 1784 },
            { id: 3, name: "ARSENAL", key: "ARSENAL", gf: 6, pts: 1761 },
            { id: 4, name: "TOTTENHAM", key: "TOTTENHAM", gf: 6, pts: 1718 },
            { id: 5, name: "BOURNEMOUTH", key: "BOURNEMOUTH", gf: 6, pts: 1683 },
            { id: 6, name: "FULHAM", key: "FULHAM", gf: 6, pts: 1680 },
            { id: 7, name: "MANCHESTER UNITED", key: "MAN UTD", gf: 6, pts: 1669 },
            { id: 8, name: "LEEDS UNITED", key: "LEEDS", gf: 3, pts: 1741 },
            { id: 9, name: "CRYSTAL PALACE", key: "CRYSTAL PALACE", gf: 3, pts: 1699 },
            { id: 10, name: "MANCHESTER CITY", key: "MAN CITY", gf: 3, pts: 1687 },
            { id: 11, name: "BRENTFORD", key: "BRENTFORD", gf: 3, pts: 1683 },
            { id: 12, name: "HULL CITY", key: "HULL", gf: 3, pts: 1677 },
            { id: 13, name: "SUNDERLAND", key: "SUNDERLAND", gf: 3, pts: 1637 },
            { id: 14, name: "NEWCASTLE UNITED", key: "NEWCASTLE", gf: 0, pts: 1654 },
            { id: 15, name: "EVERTON", key: "EVERTON", gf: 0, pts: 1653 },
            { id: 16, name: "CHELSEA", key: "CHELSEA", gf: 0, pts: 1622 },
            { id: 17, name: "COVENTRY CITY", key: "COVENTRY", gf: 0, pts: 1606 },
            { id: 18, name: "NOTTINGHAM FOREST", key: "NOTTINGHAM", gf: 0, pts: 1574 },
            { id: 19, name: "ASTON VILLA", key: "ASTON VILLA", gf: 0, pts: 1558 },
            { id: 20, name: "IPSWICH TOWN", key: "IPSWICH", gf: 0, pts: 1557 }
        ];

        const matchweeks = {
            1: [
                ["BOURNEMOUTH", "NEWCASTLE"], ["SUNDERLAND", "BRENTFORD"], ["LEEDS", "BRIGHTON"],
                ["CRYSTAL PALACE", "FULHAM"], ["COVENTRY", "MAN CITY"], ["TOTTENHAM", "NOTTINGHAM"],
                ["ASTON VILLA", "HULL"], ["ARSENAL", "COVENTRY"], ["HULL", "MAN UTD"], ["EVERTON", "CRYSTAL PALACE"]
            ],
            2: [
                ["BOURNEMOUTH", "EVERTON"], ["ASTON VILLA", "ARSENAL"], ["CHELSEA", "BRIGHTON"],
                ["COVENTRY", "HULL"], ["CRYSTAL PALACE", "MAN CITY"], ["LEEDS", "BRENTFORD"],
                ["LIVERPOOL", "NOTTINGHAM"], ["MAN UTD", "IPSWICH"], ["SUNDERLAND", "FULHAM"], ["TOTTENHAM", "NEWCASTLE"]
            ]
        };

        let currentRound = 1;
        let isAdmin = false;

        function switchTab(tabName, btn) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active-btn'));
            btn.classList.add('active-btn');
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            if(tabName === 'standings') document.getElementById('standingsTab').classList.add('active');
            if(tabName === 'fixtures') document.getElementById('fixturesTab').classList.add('active');
        }

        function toggleAdmin() {
            if(!isAdmin) {
                let pass = prompt("أدخل كلمة مرور الأدمن:");
                if(pass === "1234") {
                    isAdmin = true;
                    document.getElementById('adminPanel').classList.add('active');
                    renderAdminInputs();
                } else {
                    alert("كلمة المرور خاطئة!");
                }
            } else {
                document.getElementById('adminPanel').classList.toggle('active');
            }
        }

        function renderStandings() {
            const tbody = document.getElementById('standingsBody');
            tbody.innerHTML = '';
            teamsData.sort((a, b) => b.pts - a.pts);

            teamsData.forEach((team, index) => {
                let teamInfo = teamsMap[team.key] || { name: team.name, logo: "liverpool.png.WEBP" };
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:900;">${index + 1}</td>
                        <td class="team-cell">
                            <img src="${teamInfo.logo}" alt="${teamInfo.name}">
                            ${teamInfo.name}
                        </td>
                        <td class="gf-col">${team.gf}</td>
                        <td class="pts-col">${team.pts}</td>
                    </tr>
                `;
            });
        }

        function renderFixtures() {
            const list = document.getElementById('fixturesList');
            document.getElementById('currentRoundTitle').innerText = `MATCHWEEK ${currentRound}`;
            list.innerHTML = '';

            let matches = matchweeks[currentRound] || [];
            matches.forEach(match => {
                let home = teamsMap[match[0]] || { name: match[0], logo: "" };
                let away = teamsMap[match[1]] || { name: match[1], logo: "" };

                list.innerHTML += `
                    <div class="fixture-row">
                        <div class="team-box home">
                            <span>${home.name}</span>
                            <img src="${home.logo}">
                        </div>
                        <div class="match-score-center">VS</div>
                        <div class="team-box away">
                            <img src="${away.logo}">
                            <span>${away.name}</span>
                        </div>
                    </div>
                `;
            });
        }

        function renderAdminInputs() {
            const list = document.getElementById('adminFixturesInputs');
            list.innerHTML = '';

            let matches = matchweeks[currentRound] || [];
            matches.forEach((match) => {
                let home = teamsMap[match[0]] || { name: match[0] };
                let away = teamsMap[match[1]] || { name: match[1] };

                list.innerHTML += `
                    <div class="admin-match-input">
                        <span style="font-weight:800; width:35%; color:#fff;">${home.name}</span>
                        <div>
                            <input type="number" class="input-pts" placeholder="0">
                            -
                            <input type="number" class="input-pts" placeholder="0">
                        </div>
                        <span style="font-weight:800; width:35%; text-align:left; color:#fff;">${away.name}</span>
                    </div>
                `;
            });
        }

        function changeRound(step) {
            currentRound += step;
            if(currentRound < 1) currentRound = 1;
            renderFixtures();
            if(isAdmin) renderAdminInputs();
        }

        function saveScores() {
            alert("تم الحفظ بنجاح!");
            renderStandings();
        }

        renderStandings();
        renderFixtures();
    </script>
</body>
</html>
