<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواجهات الجولة</title>
    <style>
        /* تحميل الخطوط بنفس الأسماء المحددة في المجلد */
        @font-face {
            font-family: 'SultanCustom';
            src: url('Sultan.ttf') format('truetype');
        }
        @font-face {
            font-family: 'EnglishCustom';
            src: url('english-font.ttf') format('truetype');
        }

        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #00ff88;
            --vs-color: #ffffff; /* كلمة VS باللون الأبيض الناصع */
            --font-ar: 'SultanCustom', sans-serif;
            --font-en: 'EnglishCustom', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-ar);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* زر التحويل بين اللغات */
        .lang-switch {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
        }

        /* حاوية التصميم الكاملة (البانر + المواجهة) */
        .design-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            margin-top: 30px;
        }

        /* البانر العلوي TELE GOAT */
        .banner-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* منطقة تفاصيل المواجهة */
        .match-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        /* أسهم التنقل > و < */
        .nav-arrow {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            padding: 0 10px;
            user-select: none;
        }

        .nav-arrow:hover {
            color: #ffffff;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 35%;
        }

        .team-logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .team-name {
            font-size: 16px;
            text-align: center;
        }

        /* كلمة VS باللون الأبيض الناصع */
        .vs-badge {
            color: var(--vs-color);
            font-size: 26px;
            font-weight: 900;
            font-style: italic;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        /* زر الحفظ في ألبوم الصور */
        .save-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <button class="lang-switch" onclick="toggleLanguage()">EN / عربي</button>

    <div class="design-card" id="designCard">
        <!-- صورة البانر العلوي -->
        <img src="header.png" alt="Header Banner" class="banner-img">

        <div class="match-container">
            <!-- سهم التنقل الأيمن > -->
            <button class="nav-arrow" onclick="prevMatch()">&gt;</button>

            <div class="team">
                <img src="" class="team-logo" id="team1Logo" alt="Team 1">
                <span class="team-name" id="team1Name"></span>
            </div>

            <!-- كلمة VS باللون الأبيض -->
            <div class="vs-badge">VS</div>

            <div class="team">
                <img src="" class="team-logo" id="team2Logo" alt="Team 2">
                <span class="team-name" id="team2Name"></span>
            </div>

            <!-- سهم التنقل الأيسر < -->
            <button class="nav-arrow" onclick="nextMatch()">&lt;</button>
        </div>
    </div>

    <button class="save-btn" onclick="saveToGallery()">حفظ التصميم في الألبوم</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        const matches = [
            {
                team1Ar: "ليفربول", team1En: "Liverpool", logo1: "team1.png",
                team2Ar: "آرسنال", team2En: "Arsenal", logo2: "team2.png"
            },
            {
                team1Ar: "مانشستر يونايتد", team1En: "Man United", logo1: "team1.png",
                team2Ar: "نيوكاسل", team2En: "Newcastle", logo2: "team2.png"
            }
        ];

        let currentIndex = 0;
        let currentLang = 'ar';

        function updateCard() {
            const match = matches[currentIndex];
            document.getElementById('team1Name').textContent = currentLang === 'ar' ? match.team1Ar : match.team1En;
            document.getElementById('team2Name').textContent = currentLang === 'ar' ? match.team2Ar : match.team2En;
            document.getElementById('team1Logo').src = match.logo1;
            document.getElementById('team2Logo').src = match.logo2;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.body.style.fontFamily = currentLang === 'ar' ? 'var(--font-ar)' : 'var(--font-en)';
            updateCard();
        }

        function nextMatch() {
            if (currentIndex < matches.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevMatch() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function saveToGallery() {
            const container = document.getElementById('designCard');
            const arrows = container.querySelectorAll('.nav-arrow');
            
            arrows.forEach(arrow => arrow.style.visibility = 'hidden');

            html2canvas(container, { backgroundColor: null, scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Match_Design_${currentIndex + 1}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                
                arrows.forEach(arrow => arrow.style.visibility = 'visible');
            });
        }

        updateCard();
    </script>
</body>
</html>
