<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELEGRAM GOAT - Premier League</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @font-face {
            font-family: 'SultanCustom';
            src: url('fonts/Sultan.ttf') format('truetype');
        }
        @font-face {
            font-family: 'EnglishCustom';
            src: url('fonts/english-font.ttf') format('truetype');
        }

        :root {
            --pl-dark-bg: #240024;
            --pl-dark-card: #2f012f;
            --pl-pink: #ff005a;
            --pl-purple-btn: #38003c;
            --text-white: #ffffff;
            --border-dark: #5a055a;
            --font-ar: 'SultanCustom', sans-serif;
            --font-en: 'EnglishCustom', sans-serif;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: var(--font-ar); 
        }

        body { 
            background-color: var(--pl-dark-bg); 
            color: var(--text-white); 
            padding-bottom: 40px; 
        }

        .banner-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            max-height: 150px;
            overflow: hidden;
        }
        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .header { 
            background-color: var(--pl-dark-bg); 
            color: #ffffff; 
            padding: 20px 10px; 
            text-align: center; 
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .filter-btn, .filter-select {
            font-family: var(--font-ar);
            background: var(--pl-purple-btn);
            color: #ffffff;
            border: 1px solid var(--border-dark);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            outline: none;
            transition: 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #5a055a;
            border-color: var(--pl-pink);
        }

        .filter-select {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 15px;
            padding-left: 25px;
            background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: left 8px center;
        }

        .round-nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0 10px 0;
        }

        .round-indicator {
            font-family: var(--font-en);
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .nav-arrow-btn {
            background: var(--pl-purple-btn);
            color: var(--text-white);
            border: 1px solid var(--border-dark);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .nav-arrow-btn:hover {
            background: var(--pl-pink);
            border-color: var(--pl-pink);
        }

        .main-container { max-width: 750px; margin: 0 auto; padding: 0 10px; }

        .fixture-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 10px;
            margin-bottom: 8px;
            background: var(--pl-dark-card);
            border-radius: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .team-box {
            font-family: var(--font-en);
            display: flex;
            align-items: center;
            width: 38%;
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
        }
        .team-box.home { justify-content: flex-end; text-align: right; }
        .team-box.away { justify-content: flex-start; text-align: left; }
        
        .team-box img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            margin: 0 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            padding: 2px;
        }

        .match-score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 24%;
            background: #1a001a;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-dark);
        }

        .score-display {
            font-family: var(--font-en);
            font-size: 14px;
            font-weight: 900;
            color: #ffffff;
        }

        .score-input {
            font-family: var(--font-en);
            width: 38px;
            height: 26px;
            text-align: center;
            font-size: 12px;
            font-weight: 900;
            background: #2f012f;
            color: #ffffff;
            border: 1px solid var(--pl-pink);
            border-radius: 4px;
            outline: none;
        }

        .export-area { padding: 10px; background: var(--pl-dark-bg); border-radius: 8px; }

        .standings-card { background: var(--pl-dark-card); border-radius: 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; color: #ffffff; }
        th { font-family: var(--font-en); background-color: #1a001a; color: #a892a8; padding: 12px 6px; font-weight: 800; border-bottom: 1px solid var(--border-dark); }
        td { font-family: var(--font-en); padding: 10px 6px; border-bottom: 1px solid var(--border-dark); font-weight: 800; }
        
        .team-cell { font-family: var(--font-en); display: flex; align-items: center; justify-content: flex-start; font-weight: 800; text-transform: uppercase; }
        .team-cell img { 
            width: 24px; 
            height: 24px; 
            margin-left: 8px; 
            object-fit: contain;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            padding: 2px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .search-box {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        .search-box input {
            font-family: var(--font-ar);
            background: var(--pl-dark-card);
            color: #fff;
            border: 1px solid var(--border-dark);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            width: 60%;
            outline: none;
        }
        .search-box input::placeholder {
            color: #888;
        }

        .team-filter-badge {
            display: inline-block;
            background: var(--pl-pink);
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            margin: 5px 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- البانر العلوي -->
    <div class="banner-container">
        <img src="img/header.png" alt="TELE GOAT Banner" onerror="this.src='https://dummyimage.com/800x120/240024/ffffff.png&text=TELE+GOAT'">
    </div>

    <div class="header">
        <div class="filter-bar">
            <button class="filter-btn" id="standingsToggleBtn" onclick="switchTab('standings')">جدول الترتيب</button>
            <button class="filter-btn active" id="fixturesToggleBtn" onclick="switchTab('fixtures')">المواجهات</button>
            
            <select class="filter-select" id="roundSelect" onchange="selectRound(this.value)"></select>

            <button class="filter-btn" id="editToggleBtn" onclick="toggleEditMode()">تعديل</button>
            <button class="filter-btn" onclick="downloadAsImage()">حفظ الصورة</button>
        </div>

        <div class="search-box">
            <input type="text" id="teamSearch" placeholder="ابحث عن فريق..." oninput="filterByTeam(this.value)">
        </div>

        <div class="round-nav-container">
            <button class="nav-arrow-btn" onclick="changeRound(-1)">&lt;</button>
            <div class="round-indicator" id="currentRoundTitle">MATCHWEEK 1</div>
            <button class="nav-arrow-btn" onclick="changeRound(1)">&gt;</button>
        </div>
    </div>

    <div class="main-container">

        <!-- Fixtures Tab -->
        <div id="fixturesTab" class="tab-content active">
            <div id="captureFixtures" class="export-area">
                <div id="fixturesList"></div>
            </div>
        </div>

        <!-- Standings Tab -->
        <div id="standingsTab" class="tab-content">
            <div id="captureStandings" class="export-area">
                <div class="standings-card">
                    <table>
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th style="text-align: right; padding-right: 20px;">Club</th>
                                <th>GF</th>
                                <th>Pts</th>
                            </tr>
                        </thead>
                        <tbody id="standingsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
