<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @font-face {
            font-family: 'EnglishCustom';
            src: url('./english-font.ttf') format('truetype');
        }

        :root {
            --bg-main: #0d0614;
            --bg-card: #160b24;
            --pl-pink: #ff005a;
            --pl-green: #00ff87;
            --pl-purple: #38003c;
            --text-white: #ffffff;
            --border-color: #3b1854;
            --font-en: 'EnglishCustom', sans-serif;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-user-select: none;
            user-select: none;
        }

        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-white); 
            padding-bottom: 50px; 
            font-family: var(--font-en);
        }

        img {
            pointer-events: none;
            -webkit-touch-callout: none;
        }

        .banner-container {
            width: 100%;
            max-width: 800px;
            margin: 15px auto 0 auto;
            height: 130px;
            background: linear-gradient(135deg, #24003c 0%, #38003c 50%, #12001e 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 2px solid var(--pl-pink);
            box-shadow: 0 10px 30px rgba(255,0,90,0.2);
            position: relative;
            overflow: hidden;
        }
        
        .banner-logo-section {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner-logo-section img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .header { 
            background-color: transparent; 
            padding: 15px 10px; 
            text-align: center; 
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .filter-btn, .filter-select {
            background: var(--bg-card);
            color: var(--text-white);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            min-height: 41px;
            font-family: var(--font-en);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--pl-purple);
            border-color: var(--pl-pink);
            box-shadow: 0 0 15px rgba(255,0,90,0.3);
        }

        .filter-select {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 20px;
            padding-left: 30px;
            font-family: var(--font-en);
        }

        .admin-only {
            display: none !important;
        }
        .admin-only.visible {
            display: inline-flex !important;
        }

        .round-nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0 15px 0;
        }

        .round-indicator {
            font-family: var(--font-en);
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-white);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 8px;
            border: 1px dashed transparent;
            transition: 0.2s;
        }
        .round-indicator:hover {
            border-color: var(--pl-pink);
            background: rgba(255,0,90,0.1);
        }

        .nav-arrow-btn {
            background: var(--bg-card);
            color: var(--text-white);
            border: 1px solid var(--border-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            font-family: var(--font-en);
        }

        .nav-arrow-btn:hover {
            background: var(--pl-pink);
            color: var(--text-white);
            border-color: var(--pl-pink);
        }

        .main-container { max-width: 800px; margin: 0 auto; padding: 0 10px; }

        .capture-box {
            background: linear-gradient(135deg, #1e0d33 0%, #120621 100%);
            padding: 25px 15px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 100%;
        }

        .card-box-inner {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .card-header-title {
            font-family: var(--font-en);
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            color: #38003c;
            margin-bottom: 20px;
            letter-spacing: 2px;
            border-bottom: 3px solid #ff005a;
            padding-bottom: 8px;
        }

        .fixture-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 14px 10px;
            margin-bottom: 8px;
            background: #fcf9ff;
            border-radius: 8px;
            border-bottom: 2px solid #e0c2ff;
        }

        .team-box {
            font-family: var(--font-en);
            display: flex;
            align-items: center;
            width: 40%;
            font-size: 18px;
            font-weight: 950;
            color: #38003c;
            text-transform: uppercase;
        }
        .team-box.home { justify-content: flex-end; text-align: right; }
        .team-box.away { justify-content: flex-start; text-align: left; }
        
        .team-box img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            margin: 0 12px;
        }

        .match-score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 20%;
            background: #38003c;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ff005a;
        }

        .score-display {
            font-family: var(--font-en);
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
        }

        .score-input {
            font-family: var(--font-en);
            width: 50px;
            height: 34px;
            text-align: center;
            font-size: 16px;
            font-weight: 900;
            background: #160b24;
            color: #ffffff;
            border: 1px solid #ff005a;
            border-radius: 6px;
            outline: none;
        }

        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0; 
            text-align: center; 
        }
        
        th { 
            font-family: var(--font-en); 
            background-color: #38003c; 
            color: #ffffff; 
            padding: 14px 8px; 
            font-weight: 900; 
            border-bottom: 3px solid #ff005a; 
            font-size: 15px; 
        }
        
        td { 
            font-family: var(--font-en); 
            padding: 12px 8px; 
            border-bottom: 1px solid #e0c2ff;
            font-weight: 900; 
            font-size: 15px; 
            color: #38003c; 
        }
        
        .team-cell { 
            font-family: var(--font-en); 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            font-weight: 900; 
            text-transform: uppercase; 
            color: #38003c; 
            font-size: 16px; 
        }
        
        .team-cell img { 
            width: 30px; 
            height: 30px; 
            margin-left: 12px; 
            object-fit: contain;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <div class="banner-logo-section">
            <img src="header.png" alt="Premier League Logo" onerror="this.src='https://dummyimage.com/800x130/38003c/ffffff&text=PREMIER+LEAGUE'">
        </div>
    </div>

    <div class="header">
        <div class="filter-bar">
            <button class="filter-btn active" id="fixturesToggleBtn" onclick="switchTab('fixtures')">Fixtures</button>
            <button class="filter-btn" id="standingsToggleBtn" onclick="switchTab('standings')">Standings</button>
            
            <select class="filter-select" id="roundSelect" onchange="selectRound(this.value)"></select>

            <!-- Admin Only - Hidden from visitors -->
            <button class="filter-btn admin-only" id="editToggleBtn" onclick="toggleEditMode()">Live Edit</button>
            <button class="filter-btn admin-only" id="saveAllBtn" onclick="saveAllCurrentRound()">Save Matches</button>
            <button class="filter-btn admin-only" onclick="downloadAsImage()">Save to Album</button>
        </div>

        <div class="round-nav-container">
            <button class="nav-arrow-btn" onclick="changeRound(-1)">‹</button>
            <div class="round-indicator" id="currentRoundTitle" ondblclick="unlockAdmin()">MATCHWEEK 1</div>
            <button class="nav-arrow-btn" onclick="changeRound(1)">›</button>
        </div>
    </div>

    <div class="main-container">

        <div id="fixturesTab" class="tab-content active">
            <div id="captureFixtures" class="capture-box">
                <div class="card-box-inner">
                    <div class="card-header-title" id="fixturesHeaderTitle">MATCHWEEK 1 RESULTS</div>
                    <div id="fixturesList"></div>
                </div>
            </div>
        </div>

        <div id="standingsTab" class="tab-content">
            <div id="captureStandings" class="capture-box">
                <div class="card-box-inner">
                    <div class="card-header-title" id="standingsHeaderTitle">STANDINGS - AFTER GAMEWEEK 1</div>
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 10%;">Pos</th>
                                <th style="text-align: right; padding-right: 20px; width: 50%;">Club</th>
                                <th style="width: 20%;">GF</th>
                                <th style="width: 20%;">Pts</th>
                            </tr>
                        </thead>
                        <tbody id="standingsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://telegram-goat-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let isAdmin = localStorage.getItem('fpl_admin') === 'true';
        let editMode = isAdmin;
        let scoresStorage = {};
        let currentRound = 1;
        let activeTab = 'fixtures';
        let isSaving = false;

        db.ref('fpl_scores').on('value', (snapshot) => {
            scoresStorage = snapshot.val() || {};
            renderFixtures();
            if (activeTab === 'standings') {
                renderStandings();
            }
        });

        function checkAdminStatus() {
            const adminControls = document.querySelectorAll('.admin-only');
            if (isAdmin) {
                adminControls.forEach(el => el.classList.add('visible'));
            } else {
                adminControls.forEach(el => el.classList.remove('visible'));
            }
        }

        function unlockAdmin() {
            if (!isAdmin) {
                const pass = prompt("Enter password to unlock admin tools:");
                if (pass === "1999") {
                    isAdmin = true;
                    editMode = true;
                    localStorage.setItem('fpl_admin', 'true');
                    checkAdminStatus();
                    renderFixtures();
                    alert("Admin tools unlocked successfully!");
                } else if (pass !== null) {
                    alert("Incorrect password!");
                }
            } else {
                editMode = !editMode;
                const editBtn = document.getElementById('editToggleBtn');
                if (editBtn) {
                    editBtn.innerText = editMode ? "Lock Edit" : "Live Edit";
                }
                renderFixtures();
            }
        }

        const teamsMap = {

        function initRoundDropdown() {
            const select = document.getElementById('roundSelect');
            select.innerHTML = '';
            for(let i=1; i<=38; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `Gameweek ${i}`;
                if(i === currentRound) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function selectRound(val) {
            currentRound = parseInt(val);
            renderFixtures();
            if(activeTab === 'standings') {
                renderStandings();
            }
        }

        function switchTab(tabName) {
            activeTab = tabName;
            document.getElementById('fixturesToggleBtn').classList.toggle('active', tabName === 'fixtures');
            document.getElementById('standingsToggleBtn').classList.toggle('active', tabName === 'standings');
            
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            if(tabName === 'standings') {
                renderStandings();
                document.getElementById('standingsTab').classList.add('active');
            } else {
                renderFixtures();
                document.getElementById('fixturesTab').classList.add('active');
            }
        }

        function toggleEditMode() {
            if(!isAdmin) return;
            editMode = !editMode;
            const editBtn = document.getElementById('editToggleBtn');
            if(editBtn) {
                editBtn.innerText = editMode ? "Lock Edit" : "Live Edit";
            }
            renderFixtures();
        }

        function saveAllCurrentRound() {
            if(!isAdmin || isSaving) return;
            let btn = document.getElementById('saveAllBtn');
            let originalHTML = btn.innerHTML;
            
            isSaving = true;
            btn.innerHTML = `<span class="spinner"></span>`;
            btn.disabled = true;

            let matches = matchweeks[currentRound] || [];
            let updates = {};

            matches.forEach((match, idx) => {
                let homeInput = document.getElementById(`home_r${currentRound}_m${idx}`);
                let awayInput = document.getElementById(`away_r${currentRound}_m${idx}`);
                
                if (homeInput && awayInput) {
                    updates[`r${currentRound}_m${idx}_home`] = homeInput.value;
                    updates[`r${currentRound}_m${idx}_away`] = awayInput.value;
                }
            });

            db.ref('fpl_scores').update(updates, (error) => {
                isSaving = false;
                if (error) {
                    alert("Failed to save matches!");
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                } else {
                    btn.innerHTML = `✓`;
                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                        btn.disabled = false;
                    }, 1200);

                    // Auto switch to standings after saving
                    switchTab('standings');
                    renderStandings();
                }
            });
        }

        function calculateStandingsUpTo(roundLimit) {
            let calculated = {};
            for (let teamKey in teamsMap) {
                calculated[teamKey] = { key: teamKey, gf: 0, pts: 0 };
            }

            for (let round = 1; round <= roundLimit; round++) {
                let roundMatches = matchweeks[round];
                if(!roundMatches) continue;

                roundMatches.forEach((match, idx) => {
                    let hKey = match[0];
                    let aKey = match[1];
                    let hVal = scoresStorage[`r${round}_m${idx}_home`];
                    let aVal = scoresStorage[`r${round}_m${idx}_away`];

                    if (hVal !== undefined && aVal !== undefined && hVal !== '' && aVal !== '') {
                        let hScore = parseFloat(hVal);
                        let aScore = parseFloat(aVal);

                        calculated[hKey].gf += hScore;
                        calculated[aKey].gf += aScore;

                        if (hScore > aScore) {
                            calculated[hKey].pts += 3;
                        } else if (aScore > hScore) {
                            calculated[aKey].pts += 3;
                        } else {
                            calculated[hKey].pts += 1;
                            calculated[aKey].pts += 1;
                        }
                    }
                });
            }

            // Sort by points first, then goals scored
            return Object.values(calculated).sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                return b.gf - a.gf;
            });
        }
