<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELEGRAM GOAT - Premier League</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --pl-dark-bg: #240024;
            --pl-dark-card: #2f012f;
            --pl-pink: #ff005a;
            --pl-green: #00cc66;
            --pl-red: #ff4d4d;
            --text-white: #ffffff;
            --border-dark: #3f033f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--pl-dark-bg); color: var(--text-white); padding-bottom: 40px; }

        /* البانر العلوي المتناسق */
        .banner-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            max-height: 90px;
            overflow: hidden;
        }
        .banner-container img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            display: block;
        }

        /* Header Styling */
        .header { 
            background-color: var(--pl-dark-bg); 
            color: #ffffff; 
            padding: 15px 10px; 
            text-align: center; 
            border-bottom: 1px solid var(--border-dark); 
        }
        
        .league-title { 
            font-size: 22px; 
            font-weight: 900; 
            letter-spacing: 1px; 
            color: #ffffff;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* شريط الأزرار والتصفية الرئيسي */
        .filter-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-btn, .filter-select {
            background: #2f012f;
            color: #ffffff;
            border: 1px solid #5a055a;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            outline: none;
            transition: 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #5a055a;
            border-color: var(--pl-pink);
        }

        .round-nav-btn {
            background: #3f033f;
            color: #fff;
            border: none;
            padding: 2px 8px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 11px;
        }

        .main-container { max-width: 750px; margin: 15px auto; padding: 0 10px; }

        .round-indicator {
            text-align: center;
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 12px;
            letter-spacing: 1px;
            color: var(--pl-pink);
        }

        .fixture-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 10px 8px;
            margin-bottom: 6px;
            background: var(--pl-dark-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .team-box {
            display: flex;
            align-items: center;
            width: 38%;
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
        }
        .team-box.home { justify-content: flex-end; text-align: right; }
        .team-box.away { justify-content: flex-start; text-align: left; }
        
        .team-box img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            margin: 0 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            padding: 2px;
        }

        .match-score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 24%;
            background: #1a001a;
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid var(--border-dark);
        }

        .score-display {
            font-size: 13px;
            font-weight: 900;
            color: #ffffff;
        }

        .score-input {
            width: 38px;
            height: 26px;
            text-align: center;
            font-size: 12px;
            font-weight: 900;
            background: #2f012f;
            color: #ffffff;
            border: 1px solid var(--pl-pink);
            border-radius: 4px;
            outline: none;
        }

        .export-area { padding: 10px; background: var(--pl-dark-bg); border-radius: 8px; }

        .standings-card { background: var(--pl-dark-bg); border-radius: 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; color: #ffffff; }
        th { background-color: var(--pl-dark-card); color: #a892a8; padding: 12px 6px; font-weight: 800; border-bottom: 1px solid var(--border-dark); }
        td { padding: 10px 6px; border-bottom: 1px solid var(--border-dark); font-weight: 800; }
        
        .team-cell { display: flex; align-items: center; justify-content: flex-start; font-weight: 800; text-transform: uppercase; }
        .team-cell img { 
            width: 24px; 
            height: 24px; 
            margin-left: 8px; 
            object-fit: contain;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            padding: 2px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <!-- البانر العلوي -->
    <div class="banner-container">
        <img src="https://raw.githubusercontent.com/premierleague/assets/main/fantasy-banner.jpg" alt="Fantasy Banner" onerror="this.src='https://dummyimage.com/800x90/240024/ffffff.png&text=Fantasy+Is+Live'">
    </div>

    <div class="header">
        <div class="league-title">Premier League 2026/27</div>
        
        <!-- الأزرار العلوية المعدلة -->
        <div class="filter-bar">
            <button class="filter-btn" id="standingsToggleBtn" onclick="switchTab('standings')">الترتيب العام 📊</button>
            <button class="filter-btn active" id="fixturesToggleBtn" onclick="switchTab('fixtures')">المواجهات 🎮</button>
            
            <!-- أزرار الجولات والتنقل -->
            <div class="filter-btn" style="padding: 3px 8px;">
                <button class="round-nav-btn" onclick="changeRound(-1)">◀</button>
                <select class="filter-select" id="roundSelect" onchange="selectRound(this.value)" style="border:none; padding: 2px 4px; background:transparent;">
                    <!-- سيتم ملؤها بالجولات -->
                </select>
                <button class="round-nav-btn" onclick="changeRound(1)">▶</button>
            </div>

            <button class="filter-btn" id="editToggleBtn" onclick="toggleEditMode()">تعديل النتائج ✏️</button>
            <button class="filter-btn" onclick="downloadAsImage()">حفظ الصورة 📥</button>
        </div>
    </div>

    <div class="main-container">

        <!-- Fixtures Tab -->
        <div id="fixturesTab" class="tab-content active">
            <div class="round-indicator" id="currentRoundTitle">MATCHWEEK 1</div>
            <div id="captureFixtures" class="export-area">
                <div id="fixturesList"></div>
            </div>
        </div>

        <!-- Standings Tab -->
        <div id="standingsTab" class="tab-content">
            <div id="captureStandings" class="export-area">
                <div class="standings-card">
                    <table>
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th style="text-align: right; padding-right: 20px;">Club</th>
                                <th>GF</th>
                                <th>Pts</th>
                            </tr>
                        </thead>
                        <tbody id="standingsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        const teamsMap = {
            "ARSENAL": { name: "Arsenal", logo: "arsenal.png.WEBP" },
            "ASTON VILLA": { name: "Aston Villa", logo: "aston_villa.png.WEBP" },
            "BOURNEMOUTH": { name: "Bournemouth", logo: "bournemouth.png.WEBP" },
            "BRENTFORD": { name: "Brentford", logo: "brentford.png.PNG" },
            "BRIGHTON": { name: "Brighton", logo: "brighton.png.WEBP" },
            "CHELSEA": { name: "Chelsea", logo: "chelsea.png.WEBP" },
            "COVENTRY": { name: "Coventry", logo: "coventry.png.WEBP" },
            "CRYSTAL PALACE": { name: "Crystal Palace", logo: "crystal_palace.png.WEBP" },
            "EVERTON": { name: "Everton", logo: "everton.png.WEBP" },
            "FULHAM": { name: "Fulham", logo: "fulham.png.WEBP" },
            "HULL": { name: "Hull", logo: "hull.png.WEBP" },
            "IPSWICH": { name: "Ipswich", logo: "ipswich.png.WEBP" },
            "LEEDS": { name: "Leeds", logo: "leeds.png.WEBP" },
            "LIVERPOOL": { name: "Liverpool", logo: "liverpool.png.WEBP" },
            "MAN CITY": { name: "Man City", logo: "man_city.png.WEBP" },
            "MAN UTD": { name: "Man Utd", logo: "man_utd.png.WEBP" },
            "NEWCASTLE": { name: "Newcastle", logo: "newcastle.png.WEBP" },
            "NOTTINGHAM": { name: "Nott'm Forest", logo: "forest.png.PNG" },
            "SUNDERLAND": { name: "Sunderland", logo: "sunderland.png.WEBP" },
            "TOTTENHAM": { name: "Spurs", logo: "tottenham.png.WEBP" }
        };

        // تصفير جميع النقاط تماماً
        const initialBasePoints = {};
        Object.keys(teamsMap).forEach(key => {
            initialBasePoints[key] = { gf: 0, pts: 0 };
        });

        const matchweeks = {
            1: [ ["ARSENAL", "COVENTRY"], ["HULL", "MAN UTD"], ["EVERTON", "CRYSTAL PALACE"], ["IPSWICH", "SUNDERLAND"], ["NOTTINGHAM", "LEEDS"], ["BRENTFORD", "TOTTENHAM"], ["BRIGHTON", "ASTON VILLA"], ["MAN CITY", "BOURNEMOUTH"], ["NEWCASTLE", "LIVERPOOL"], ["FULHAM", "CHELSEA"] ],
            2: [ ["BOURNEMOUTH", "EVERTON"], ["ASTON VILLA", "ARSENAL"], ["CHELSEA", "BRIGHTON"], ["COVENTRY", "HULL"], ["CRYSTAL PALACE", "MAN CITY"], ["LEEDS", "BRENTFORD"], ["LIVERPOOL", "NOTTINGHAM"], ["MAN UTD", "IPSWICH"], ["SUNDERLAND", "FULHAM"], ["TOTTENHAM", "NEWCASTLE"] ],
            3: [ ["ARSENAL", "CHELSEA"], ["BRENTFORD", "SUNDERLAND"], ["BRIGHTON", "LEEDS"], ["EVERTON", "MAN UTD"], ["FULHAM", "CRYSTAL PALACE"], ["HULL", "ASTON VILLA"], ["IPSWICH", "LIVERPOOL"], ["MAN CITY", "COVENTRY"], ["NEWCASTLE", "BOURNEMOUTH"], ["NOTTINGHAM", "TOTTENHAM"] ],
            4: [ ["BOURNEMOUTH", "BRENTFORD"], ["ASTON VILLA", "NOTTINGHAM"], ["CHELSEA", "HULL"], ["COVENTRY", "BRIGHTON"], ["CRYSTAL PALACE", "IPSWICH"], ["LEEDS", "NEWCASTLE"], ["LIVERPOOL", "FULHAM"], ["MAN UTD", "MAN CITY"], ["SUNDERLAND", "ARSENAL"], ["TOTTENHAM", "EVERTON"] ],
            5: [ ["BOURNEMOUTH", "LIVERPOOL"], ["BRENTFORD", "CHELSEA"], ["BRIGHTON", "ARSENAL"], ["EVERTON", "IPSWICH"], ["FULHAM", "MAN UTD"], ["LEEDS", "CRYSTAL PALACE"], ["MAN CITY", "SUNDERLAND"], ["NEWCASTLE", "HULL"], ["NOTTINGHAM", "COVENTRY"], ["TOTTENHAM", "ASTON VILLA"] ]
        };

        let currentRound = 1;
        let activeTab = 'fixtures';
        let editMode = false;
        let scoresStorage = JSON.parse(localStorage.getItem('fpl_scores')) || {};

        function initRoundDropdown() {
            const select = document.getElementById('roundSelect');
            select.innerHTML = '';
            for(let i=1; i<=18; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `الجولة ${i}`;
                if(i === currentRound) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function selectRound(val) {
            currentRound = parseInt(val);
            renderFixtures();
        }

        function switchTab(tabName) {
            activeTab = tabName;
            document.getElementById('fixturesToggleBtn').classList.toggle('active', tabName === 'fixtures');
            document.getElementById('standingsToggleBtn').classList.toggle('active', tabName === 'standings');
            
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            if(tabName === 'standings') {
                renderStandings();
                document.getElementById('standingsTab').classList.add('active');
            } else {
                document.getElementById('fixturesTab').classList.add('active');
            }
        }

        function toggleEditMode() {
            editMode = !editMode;
            const btn = document.getElementById('editToggleBtn');
            btn.innerText = editMode ? "حفظ التعديل 💾" : "تعديل النتائج ✏️";
            renderFixtures();
            if(!editMode) renderStandings();
        }

        function updateScore(round, idx, type, val) {
            scoresStorage[`r${round}_m${idx}_${type}`] = val;
            localStorage.setItem('fpl_scores', JSON.stringify(scoresStorage));
        }

        function calculateStandings() {
            let calculated = {};
            for (let teamKey in initialBasePoints) {
                calculated[teamKey] = { key: teamKey, gf: 0, pts: 0 };
            }

            for (let round in matchweeks) {
                matchweeks[round].forEach((match, idx) => {
                    let hKey = match[0];
                    let aKey = match[1];
                    let hVal = scoresStorage[`r${round}_m${idx}_home`];
                    let aVal = scoresStorage[`r${round}_m${idx}_away`];

                    if (hVal !== undefined && aVal !== undefined && hVal !== '' && aVal !== '') {
                        let hScore = parseFloat(hVal);
                        let aScore = parseFloat(aVal);

                        calculated[hKey].gf += hScore;
                        calculated[aKey].gf += aScore;

                        if (hScore > aScore) {
                            calculated[hKey].pts += 3;
                        } else if (aScore > hScore) {
                            calculated[aKey].pts += 3;
                        } else if (hScore === aScore) {
                            calculated[hKey].pts += 1;
                            calculated[aKey].pts += 1;
                        }
                    }
                });
            }

            return Object.values(calculated).sort((a, b) => b.pts - a.pts || b.gf - a.gf);
        }

        function renderStandings() {
            const tbody = document.getElementById('standingsBody');
            tbody.innerHTML = '';
            
            let sortedTeams = calculateStandings();

            sortedTeams.forEach((team, index) => {
                let teamInfo = teamsMap[team.key] || { name: team.key, logo: "" };
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:900;">${index + 1}</td>
                        <td class="team-cell">
                            <img src="${teamInfo.logo}" alt="${teamInfo.name}">
                            ${teamInfo.name}
                        </td>
                        <td>${team.gf}</td>
                        <td style="color:var(--pl-pink); font-size:14px;">${team.pts}</td>
                    </tr>
                `;
            });
        }

        function renderFixtures() {
            const list = document.getElementById('fixturesList');
            document.getElementById('currentRoundTitle').innerText = `MATCHWEEK ${currentRound}`;
            document.getElementById('roundSelect').value = currentRound;
            list.innerHTML = '';

            let matches = matchweeks[currentRound] || [];
            matches.forEach((match, idx) => {
                let home = teamsMap[match[0]] || { name: match[0], logo: "" };
                let away = teamsMap[match[1]] || { name: match[1], logo: "" };

                let homeScore = scoresStorage[`r${currentRound}_m${idx}_home`] ?? '';
                let awayScore = scoresStorage[`r${currentRound}_m${idx}_away`] ?? '';

                let scoreContent = editMode ? `
                    <input type="number" class="score-input" value="${homeScore}" placeholder="0" oninput="updateScore(${currentRound}, ${idx}, 'home', this.value)">
                    <span style="font-weight:900; color:#fff;">:</span>
                    <input type="number" class="score-input" value="${awayScore}" placeholder="0" oninput="updateScore(${currentRound}, ${idx}, 'away', this.value)">
                ` : `
                    <span class="score-display">${homeScore !== '' ? homeScore : '-'}</span>
                    <span style="font-weight:900; color:#ff005a;">VS</span>
                    <span class="score-display">${awayScore !== '' ? awayScore : '-'}</span>
                `;

                list.innerHTML += `
                    <div class="fixture-row">
                        <div class="team-box home">
                            <span>${home.name}</span>
                            <img src="${home.logo}">
                        </div>
                        <div class="match-score-center">
                            ${scoreContent}
                        </div>
                        <div class="team-box away">
                            <img src="${away.logo}">
                            <span>${away.name}</span>
                        </div>
                    </div>
                `;
            });
        }

        function changeRound(step) {
            currentRound += step;
            if(currentRound < 1) currentRound = 1;
            if(currentRound > 18) currentRound = 18;
            renderFixtures();
        }

        function downloadAsImage() {
            const targetId = activeTab === 'fixtures' ? 'captureFixtures' : 'captureStandings';
            const element = document.getElementById(targetId);

            html2canvas(element, {
                backgroundColor: "#240024",
                scale: 2
            }).then(canvas => {
                canvas.toBlob(function(blob) {
                    let link = document.createElement('a');
                    link.download = activeTab === 'fixtures' ? `Matchweek_${currentRound}.png` : `League_Standings.png`;
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    URL.revokeObjectURL(link.href);
                }, 'image/png');
            });
        }

        initRoundDropdown();
        renderStandings();
        renderFixtures();
    </script>
</body>
</html>
