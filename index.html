<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TELEGRAM GOAT - Premier League</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @font-face {
            font-family: 'SultanCustom';
            src: url('./Sultan.ttf') format('truetype');
        }
        @font-face {
            font-family: 'EnglishCustom';
            src: url('./english-font.ttf') format('truetype');
        }

        :root {
            --pl-dark-bg: #240024;
            --pl-pink: #ff005a;
            --pl-purple-btn: #38003c;
            --text-white: #ffffff;
            --border-dark: #5a055a;
            --font-ar: 'SultanCustom', sans-serif;
            --font-en: 'EnglishCustom', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-ar);
        }

        body {
            background-color: var(--pl-dark-bg);
            color: var(--text-white);
            padding-bottom: 40px;
            width: 100%;
            max-width: 768px;
            margin: 0 auto;
            padding: 0 10px;
        }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e0d33;
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: var(--font-en);
            font-weight: 900;
            font-size: 15px;
            border: 2px solid #ff005a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #toast.show {
            opacity: 1;
        }

        #toast .toast-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #ff005a;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .banner-container {
            position: relative;
            width: 100%;
            max-width: 768px;
            margin: 15px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #38003c 0%, #240024 100%);
            min-height: 180px;
            line-height: 0;
            text-align: center;
        }

        .banner-container img {
            width: 100%;
            height: auto;
            object-fit: cover;
            object-position: center;
            display: block;
            position: relative;
            z-index: 1;
        }

        /* ✅ التعديل الأول: رفع التبويبات قليلاً */
        .banner-overlay-tabs {
            position: absolute;
            bottom: 14%;
            right: 2%;
            display: flex;
            background: #5d8eb6;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            direction: rtl;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0;
            padding: 2px;
            max-width: 96%;
            z-index: 2;
        }

        .banner-tab-btn,
        .banner-tab-select {
            background: transparent;
            color: #ffffff;
            border: none;
            padding: 8px 12px;
            font-family: var(--font-ar);
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex: 1 1 auto;
            min-width: 50px;
        }

        .banner-tab-btn:hover {
            background: rgba(0, 0, 0, 0.15);
        }

        .banner-tab-btn.active {
            background: var(--pl-purple-btn);
        }

        .banner-tab-select {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 8px;
            padding-left: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="10" viewBox="0 0 24 24" width="10" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: left 6px center;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            min-width: 60px;
        }

        .banner-tab-select option {
            background: var(--pl-purple-btn);
            color: #fff;
        }

        .admin-edit-btn {
            display: none !important;
        }

        .header {
            background-color: var(--pl-dark-bg);
            color: #ffffff;
            padding: 5px 10px 15px 10px;
            text-align: center;
        }

        .round-nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 5px 0;
            flex-wrap: wrap;
        }

        .round-indicator {
            font-family: var(--font-en);
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            text-align: center;
            padding: 6px 20px;
            border-radius: 8px;
            border: 2px dashed transparent;
            transition: 0.2s;
        }

        .round-indicator:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-arrow-btn {
            background: var(--pl-purple-btn);
            color: var(--text-white);
            border: 1px solid var(--border-dark);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .nav-arrow-btn:hover {
            background: var(--pl-pink);
            border-color: var(--pl-pink);
        }

        .main-container {
            width: 100%;
            max-width: 768px;
            margin: 0 auto;
            padding: 0 5px;
        }

        #captureFixtures {
            padding: 20px 15px;
            background: linear-gradient(135deg, #3281ff 0%, #00d2ff 45%, #a835ff 100%), #4b92ff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 4px solid #ffffff;
        }

        .fixtures-header-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .fixtures-header-title {
            font-family: var(--font-en);
            font-size: 18px;
            font-weight: 900;
            color: #38003c;
            letter-spacing: 1px;
        }

        .fixture-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            flex-wrap: nowrap;
        }

        .team-box {
            font-family: var(--font-en);
            display: flex;
            align-items: center;
            width: 36%;
            font-size: 14px;
            font-weight: 800;
            color: #38003c;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .team-box.home {
            justify-content: flex-end;
            text-align: right;
        }

        .team-box.away {
            justify-content: flex-start;
            text-align: left;
        }

        .logo-20 {
            display: inline-block;
            width: 20px;
            height: 20px;
            min-width: 20px;
            min-height: 20px;
            max-width: 20px;
            max-height: 20px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            vertical-align: middle;
        }

        .logo-20 img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            padding: 0;
            margin: 0;
            image-rendering: auto;
        }

        .logo-24 {
            display: inline-block;
            width: 24px;
            height: 24px;
            min-width: 24px;
            min-height: 24px;
            max-width: 24px;
            max-height: 24px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            vertical-align: middle;
            margin: 0 4px;
        }

        .logo-24 img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            padding: 0;
            margin: 0;
            image-rendering: auto;
        }

        .match-score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 22%;
            background: #7138f5;
            padding: 6px 8px;
            border-radius: 6px;
            position: relative;
            min-width: 70px;
            flex-shrink: 0;
        }

        .score-display,
        .score-input,
        .pos-number,
        .stat-number {
            font-family: var(--font-en);
            font-size: 16px;
            font-weight: 900;
            line-height: 1.2;
            display: inline-block;
            vertical-align: middle;
        }

        .score-display {
            color: #ffffff;
        }

        .score-input {
            width: 36px;
            height: 26px;
            text-align: center;
            background: #ffffff;
            color: #38003c;
            border: 1px solid #7138f5;
            border-radius: 4px;
            outline: none;
            padding: 0;
        }

        .vs-text {
            font-weight: 900;
            color: #ffffff;
            font-family: var(--font-en);
            font-size: 14px;
        }

        #captureStandings {
            display: flex;
            flex-wrap: wrap;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 4px solid #ffffff;
            width: 100%;
        }

        .standings-sidebar {
            width: 140px;
            background: linear-gradient(180deg, #6C2BD9 0%, #3B82F6 50%, #10B981 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: #ffffff;
            text-align: center;
            flex-shrink: 0;
            min-height: 280px;
            border-radius: 16px 0 0 16px;
        }

        .standings-sidebar img {
            width: 200%;
            max-width: 500px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            display: block;
            border-radius: 8px;
        }

        .standings-content-area {
            flex: 1;
            background: #f4f5f7;
            overflow-x: visible;
            min-width: 200px;
            padding: 10px;
            display: block !important;
        }

        .standings-card {
            background: transparent;
            border-radius: 0;
            overflow: visible;
            padding: 5px;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
            text-align: center;
            color: #333;
            display: table !important;
            table-layout: fixed;
        }

        th {
            font-family: var(--font-en);
            background-color: transparent;
            color: #38003c;
            padding: 8px 4px;
            font-weight: 900;
            border-bottom: 2px solid #38003c;
            font-size: 13px;
            vertical-align: middle;
            line-height: 1.2;
        }

        td {
            font-family: var(--font-en);
            padding: 0 4px;
            font-weight: 800;
            vertical-align: middle;
            line-height: 1.2;
            background-color: #ffffff;
            border-bottom: 1px solid #d1d5db;
            height: 36px;
            max-height: 36px;
            overflow: hidden;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr.green-line td {
            border-bottom: 3px solid #00ff87 !important;
        }

        tr.red-line td {
            border-bottom: 3px solid #ff005a !important;
        }

        .team-cell {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            font-size: 15px;
            text-transform: uppercase;
            color: #1a1a1a;
            padding: 0 12px 0 0;
            white-space: nowrap;
        }

        .pos-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 28px;
            vertical-align: middle;
        }

        .pos-indicator-img {
            width: 28px;
            height: 28px;
            min-width: 28px;
            min-height: 28px;
            max-width: 28px;
            max-height: 28px;
            object-fit: contain;
            object-position: center;
            display: inline-block;
            flex-shrink: 0;
            vertical-align: middle;
            image-rendering: auto;
        }

        /* ✅ التعديل الثالث: بديل الرصاصي لعدم تغير المركز */
        .pos-indicator-text {
            display: inline-block;
            font-family: var(--font-en);
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            width: 28px;
            height: 28px;
            min-width: 28px;
            min-height: 28px;
            max-width: 28px;
            max-height: 28px;
            text-align: center;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .pos-number {
            font-size: 15px;
            font-weight: 900;
            line-height: 1;
            min-width: 18px;
            text-align: center;
        }

        .stat-number {
            font-size: 15px;
            font-weight: 900;
            line-height: 1;
        }

        .col-pos { width: 14%; }
        .col-club { width: 42%; }
        .col-gf { width: 20%; }
        .col-pts { width: 24%; }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media screen and (max-width: 600px) {
            body { padding: 0 5px; }

            .banner-container {
                border-width: 3px;
                border-radius: 16px;
                min-height: 150px;
            }

            /* ✅ رفع التبويبات أكثر على الجوال */
            .banner-overlay-tabs {
                bottom: 16%;
                right: 1%;
                max-width: 98%;
                border-radius: 6px;
                padding: 3px 0;
                gap: 0;
            }

            .banner-tab-btn,
            .banner-tab-select {
                font-size: 10px;
                padding: 5px 6px;
                min-width: 35px;
                flex: 1 1 20%;
            }

            .banner-tab-select {
                min-width: 45px;
                padding-right: 6px;
                padding-left: 14px;
                background-size: 7px;
            }

            .round-indicator { font-size: 16px; }

            .nav-arrow-btn {
                width: 34px;
                height: 34px;
                font-size: 18px;
            }

            #captureFixtures {
                padding: 15px 10px;
                border-radius: 16px;
                border-width: 3px;
            }

            .fixtures-header-title { font-size: 16px; }

            .fixture-row {
                padding: 6px 8px;
                flex-wrap: nowrap;
            }

            .team-box {
                font-size: 13px;
                width: 34%;
            }

            .logo-24 {
                width: 18px;
                height: 18px;
                min-width: 18px;
                min-height: 18px;
                max-width: 18px;
                max-height: 18px;
                margin: 0 3px;
            }

            .match-score-center {
                width: 24%;
                min-width: 60px;
                padding: 4px;
            }

            .score-display,
            .score-input,
            .pos-number,
            .stat-number { font-size: 14px; }

            .score-input {
                width: 28px;
                height: 20px;
            }

            .vs-text { font-size: 12px; }

            .pos-indicator-img {
                width: 24px;
                height: 24px;
                min-width: 24px;
                min-height: 24px;
                max-width: 24px;
                max-height: 24px;
            }

            .pos-indicator-text {
                width: 24px;
                height: 24px;
                min-width: 24px;
                min-height: 24px;
                max-width: 24px;
                max-height: 24px;
                font-size: 15px;
            }

            #captureStandings {
                flex-direction: column;
                border-radius: 16px;
                border-width: 3px;
                overflow: hidden;
            }

            .standings-sidebar {
                width: 100%;
                flex-direction: row;
                padding: 15px 10px;
                justify-content: center;
                align-items: center;
                border-radius: 16px 16px 0 0;
                min-height: 100px;
            }

            .standings-sidebar img {
                max-width: 300px;
                width: 180%;
            }

            .standings-content-area {
                min-width: unset;
                width: 100%;
                padding: 5px;
                overflow-x: visible;
                display: block !important;
                border-radius: 0 0 16px 16px;
            }

            .standings-card { padding: 5px 0; }
            table { width: 100%; }

            th {
                font-size: 12px;
                padding: 6px 4px;
            }

            td {
                font-size: 12px;
                padding: 0 3px;
                height: 32px;
                max-height: 32px;
            }

            .team-cell {
                font-size: 13px;
                padding-right: 8px;
            }

            .logo-20 {
                width: 18px;
                height: 18px;
                min-width: 18px;
                min-height: 18px;
                max-width: 18px;
                max-height: 18px;
            }

            .pos-number { font-size: 14px; }
            .stat-number { font-size: 14px; }

            .pos-indicator-img {
                width: 24px;
                height: 24px;
                min-width: 24px;
                min-height: 24px;
                max-width: 24px;
                max-height: 24px;
            }

            .pos-container { height: 24px; }

            tr.green-line td,
            tr.red-line td { border-bottom-width: 2px !important; }
        }
    </style>
</head>
<body>

    <div id="toast">
        <span id="toastContent">جاري الحفظ...</span>
    </div>

    <div class="banner-container">
        <img id="bannerImg" src="image_5.png" alt="Premier League Banner" onerror="handleBannerError(this)">

        <div class="banner-overlay-tabs">
            <select class="banner-tab-select" id="roundSelect" onchange="selectRound(this.value)"></select>
            <button class="banner-tab-btn active" id="fixturesToggleBtn" onclick="switchTab('fixtures')">المواجهات</button>
            <button class="banner-tab-btn" id="standingsToggleBtn" onclick="switchTab('standings')">الترتيب</button>
            <button class="banner-tab-btn" onclick="downloadAsImage()">حفظ الصورة</button>
            <button class="banner-tab-btn admin-edit-btn" id="editToggleBtn" onclick="toggleEditMode()" style="display: none !important;">تعديل</button>
        </div>
    </div>

    <div class="header">
        <div class="round-nav-container">
            <!-- ✅ التعديل الثاني: عكس الأزرار - اليمين يتقدم واليسار يرجع -->
            <button class="nav-arrow-btn" onclick="changeRound(1)">›</button>
            <div class="round-indicator" id="currentRoundTitle" ondblclick="unlockEditWithPassword()">MATCHWEEK 1</div>
            <button class="nav-arrow-btn" onclick="changeRound(-1)">‹</button>
        </div>
    </div>

    <div class="main-container">

        <div id="fixturesTab" class="tab-content active">
            <div id="captureFixtures" class="export-area">
                <div class="fixtures-header-box">
                    <div class="fixtures-header-title" id="fixturesBannerTitle">MATCHWEEK RESULTS</div>
                </div>
                <div id="fixturesList"></div>
            </div>
        </div>

        <div id="standingsTab" class="tab-content">
            <div id="captureStandings" class="export-area">
                <div class="standings-sidebar">
                    <img src="premire_League2.png-.webp" alt="Premier League" onerror="this.style.display='none'">
                </div>
                <div class="standings-content-area">
                    <div class="standings-card">
                        <table>
                            <colgroup>
                                <col class="col-pos">
                                <col class="col-club">
                                <col class="col-gf">
                                <col class="col-pts">
                            </colgroup>
                            <thead>
                                <tr>
                                    <th>Pos</th>
                                    <th style="text-align: right; padding-right: 12px;">Club</th>
                                    <th style="text-align: center;">GF</th>
                                    <th style="text-align: center;">Pts</th>
                                </tr>
                            </thead>
                            <tbody id="standingsBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let editMode = false;
        let scoresStorage = JSON.parse(localStorage.getItem('fpl_scores')) || {};
        let currentRound = 1;
        let activeTab = 'fixtures';
        let isSaving = false;

        let toastTimeout = null;

        function showToast(msg, isSuccess = false) {
            const toast = document.getElementById('toast');
            const content = document.getElementById('toastContent');

            if (toastTimeout) clearTimeout(toastTimeout);

            if (isSuccess) {
                content.innerHTML = `✅ ${msg}`;
            } else {
                content.innerHTML = `<span class="toast-spinner"></span> ${msg}`;
            }

            toast.classList.add('show');

            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        let bannerAttempts = 0;
        const bannerSources = [
            "image_5.png",
            "image_5.PNG",
            "image_5.jpg",
            "image_5.JPG",
            "banner.png",
            "./image_5.png",
            "./banner.png"
        ];

        function handleBannerError(img) {
            bannerAttempts++;

            if (bannerAttempts < bannerSources.length) {
                img.src = bannerSources[bannerAttempts];
            } else {
                img.style.display = 'none';
            }
        }

        const teamsMap = {
            "ARS": { name: "Arsenal", logo: "arsenal.png.WEBP" },
            "AVL": { name: "Aston Villa", logo: "aston_villa.png.WEBP" },
            "BOU": { name: "Bournemouth", logo: "bournemouth.png.WEBP" },
            "BRE": { name: "Brentford", logo: "brentford.png.PNG" },
            "BHA": { name: "Brighton", logo: "brighton.png.WEBP" },
            "CHE": { name: "Chelsea", logo: "chelsea.png.WEBP" },
            "COV": { name: "Coventry", logo: "coventry.png.WEBP" },
            "CRY": { name: "Crystal Palace", logo: "crystal_palace.png.WEBP" },
            "EVE": { name: "Everton", logo: "everton.png.WEBP" },

        function initRoundDropdown() {
            const select = document.getElementById('roundSelect');
            select.innerHTML = '';
            for (let i = 1; i <= 38; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `الجولة ${i}`;
                if (i === currentRound) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function selectRound(val) {
            currentRound = parseInt(val);
            renderFixtures();
        }

        function switchTab(tabName) {
            activeTab = tabName;
            document.getElementById('fixturesToggleBtn').classList.toggle('active', tabName === 'fixtures');
            document.getElementById('standingsToggleBtn').classList.toggle('active', tabName === 'standings');

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));

            if (tabName === 'standings') {
                renderStandings();
                document.getElementById('standingsTab').classList.add('active');

                document.getElementById('fixturesTab').classList.add('active');

        function unlockEditWithPassword() {
            const pass = prompt("أدخل رمز الحماية لتفعيل زر التعديل:");
            if (pass === "1999") {
                editMode = true;
                const editBtn = document.getElementById('editToggleBtn');
                editBtn.style.setProperty('display', 'inline-flex', 'important');
                editBtn.innerText = "حفظ";
                renderFixtures();
                alert("تم تفعيل صلاحيات المدير بنجاح!");
            } else if (pass !== null) {
                alert("الرمز غير صحيح!");
            }
        }

        function toggleEditMode() {
            const btn = document.getElementById('editToggleBtn');

            if (!editMode) {
                editMode = true;
                btn.innerText = "حفظ";
                renderFixtures();
                return;
            }

            if (isSaving) return;
            showToast("جاري الحفظ...", false);

            const matches = matchweeks[currentRound] || [];
            matches.forEach((match, idx) => {
                const homeInput = document.getElementById(`home_r${currentRound}_m${idx}`);
                const awayInput = document.getElementById(`away_r${currentRound}_m${idx}`);
                if (homeInput && awayInput) {
                    scoresStorage[`r${currentRound}_m${idx}_home`] = homeInput.value;
                    scoresStorage[`r${currentRound}_m${idx}_away`] = awayInput.value;
                }
            });

            isSaving = true;
            btn.disabled = true;

            localStorage.setItem('fpl_scores', JSON.stringify(scoresStorage));

            setTimeout(() => {
                isSaving = false;
                btn.disabled = false;
                showToast("تم الحفظ ✓", true);
                editMode = false;
                btn.style.setProperty('display', 'none', 'important');
                btn.innerText = "تعديل";
                renderFixtures();
                renderStandings();
            }, 300);
        }

        function updateScore(round, idx, type, val, inputElement) {
            scoresStorage[`r${round}_m${idx}_${type}`] = val;
        }

        function calculateStandingsUpToRound(targetRound) {
            let calculated = {};
            for (let teamKey in initialBasePoints) {
                calculated[teamKey] = { key: teamKey, gf: 0, pts: 0 };
            }

            for (let r = 1; r <= targetRound; r++) {
                let roundMatches = matchweeks[r];
                if (!roundMatches) continue;

                roundMatches.forEach((match, idx) => {
                    let hKey = match[0];
                    let aKey = match[1];
                    let hVal = scoresStorage[`r${r}_m${idx}_home`];
                    let aVal = scoresStorage[`r${r}_m${idx}_away`];

                    if (hVal !== undefined && aVal !== undefined && hVal !== '' && aVal !== '') {
                        let hScore = parseFloat(hVal);
                        let aScore = parseFloat(aVal);

                        calculated[hKey].gf += hScore;
                        calculated[aKey].gf += aScore;

                        if (hScore > aScore) {
                            calculated[hKey].pts += 3;
                        } else if (aScore > hScore) {
                            calculated[aKey].pts += 3;
                        } else if (hScore === aScore) {
                            calculated[hKey].pts += 1;
                            calculated[aKey].pts += 1;
                        }
                    }
                });
            }

            return Object.values(calculated).sort((a, b) => b.pts - a.pts || b.gf - a.gf);
        }

        function calculateStandings() {
            return calculateStandingsUpToRound(currentRound);
        }

        function renderStandings() {
            const tbody = document.getElementById('standingsBody');
            tbody.innerHTML = '';

            let sortedTeams = calculateStandings();
            let prevRanks = {};

            if (currentRound >= 2) {
                let prevSortedTeams = calculateStandingsUpToRound(currentRound - 1);
                prevSortedTeams.forEach((team, idx) => {
                    prevRanks[team.key] = idx + 1;
                });
            }

            sortedTeams.forEach((team, index) => {
                let teamInfo = teamsMap[team.key] || { name: team.key, logo: "" };
                let position = index + 1;

                let rowClass = '';
                if (position === 1) rowClass = 'green-line';
                else if (position === 17) rowClass = 'red-line';

                let indicatorHtml = '';

                if (currentRound >= 2 && prevRanks[team.key] !== undefined) {
                    let oldPos = prevRanks[team.key];
                    let imgSrc = '';
                    let fallbackChar = '';
                    let fallbackColor = '';

                    if (position < oldPos) {
                        imgSrc = 'arrow_up_green.png';
                        fallbackChar = '▲';
                        fallbackColor = '#00b894';
                    } else if (position > oldPos) {
                        imgSrc = 'arrow_down_red.png';
                        fallbackChar = '▼';
                        fallbackColor = '#ff005a';
                    } else {
                        imgSrc = 'equal_yellow.png';
                        fallbackChar = '▬';
                        fallbackColor = '#9ca3af';
                    }

                    indicatorHtml = `<img
                        src="${imgSrc}"
                        class="pos-indicator-img"
                        data-char="${fallbackChar}"
                        data-color="${fallbackColor}"
                        alt="indicator"
                        onerror="handleIndicatorError(this)"
                    >`;
                }

                tbody.innerHTML += `
                    <tr class="${rowClass}">
                        <td>
                            <div class="pos-container">
                                ${indicatorHtml}
                                <span class="pos-number">${position}</span>
                            </div>
                        </td>
                        <td>
                            <div class="team-cell">
                                <span class="logo-20">
                                    <img src="${teamInfo.logo}" alt="${teamInfo.name}" onerror="this.style.display='none'">
                                </span>
                                ${teamInfo.name}
                            </div>
                        </td>
                        <td><span class="stat-number">${team.gf}</span></td>
                        <td><span class="stat-number" style="color:#7138f5;">${team.pts}</span></td>
                    </tr>
                `;
            });
        }

        /* ✅ التعديل الثالث: عند فشل تحميل صورة المؤشر، يظهر النص البديل بلون رصاصي/ملون */
        function handleIndicatorError(img) {
            const char = img.getAttribute('data-char') || '▬';
            const color = img.getAttribute('data-color') || '#9ca3af';

            const span = document.createElement('span');
            span.textContent = char;
            span.className = 'pos-indicator-text pos-indicator-img';
            span.style.color = color;

            img.parentNode.replaceChild(span, img);
        }

        function renderFixtures() {
            const list = document.getElementById('fixturesList');
            document.getElementById('currentRoundTitle').innerText = `MATCHWEEK ${currentRound}`;
            document.getElementById('roundSelect').value = currentRound;
            list.innerHTML = '';

            let matches = matchweeks[currentRound] || [];

            matches.forEach((match, idx) => {
                let home = teamsMap[match[0]] || { name: match[0], logo: "" };
                let away = teamsMap[match[1]] || { name: match[1], logo: "" };

                let homeScore = scoresStorage[`r${currentRound}_m${idx}_home`] ?? '';
                let awayScore = scoresStorage[`r${currentRound}_m${idx}_away`] ?? '';

        function changeRound(step) {
            currentRound += step;
            if (currentRound < 1) currentRound = 1;
            if (currentRound > 38) currentRound = 38;

            renderFixtures();

            if (activeTab === 'standings') {
                renderStandings();
            }
        }

        function waitForImagesToLoad(element) {
            const images = Array.from(element.querySelectorAll('img'));

            return Promise.all(
                images.map(img => {
                    if (img.complete && img.naturalWidth > 0) {
                        if (img.decode) {
                            return img.decode().catch(() => {});
                        }
                        return Promise.resolve();
                    }

                    return new Promise(resolve => {
                        let finished = false;

                        const finish = () => {
                            if (finished) return;
                            finished = true;
                            img.removeEventListener('load', finish);
                            img.removeEventListener('error', finish);
                            resolve();
                        };

                        img.addEventListener('load', finish, { once: true });
                        img.addEventListener('error', finish, { once: true });
                        setTimeout(finish, 5000);
                    });
                })
            );
        }

        function applyRoundedCorners(sourceCanvas, radius) {
            const w = sourceCanvas.width;
            const h = sourceCanvas.height;

            const outputCanvas = document.createElement('canvas');
            outputCanvas.width = w;
            outputCanvas.height = h;

            const ctx = outputCanvas.getContext('2d');

            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(w - radius, 0);
            ctx.quadraticCurveTo(w, 0, w, radius);
            ctx.lineTo(w, h - radius);
            ctx.quadraticCurveTo(w, h, w - radius, h);
            ctx.lineTo(radius, h);
            ctx.quadraticCurveTo(0, h, 0, h - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.clip();

            ctx.drawImage(sourceCanvas, 0, 0);

            return outputCanvas;
        }

        function downloadAsImage() {
            if (activeTab === 'fixtures') {
                renderFixtures();
            } else {
                renderStandings();
            }

            const targetId = activeTab === 'fixtures' ? 'captureFixtures' : 'captureStandings';
            const element = document.getElementById(targetId);

            showToast("جاري تحضير الصورة عالية الدقة...", false);

            const scaleFactor = 4;
            const cornerRadius = 20 * scaleFactor;

            waitForImagesToLoad(element)
                .then(() => {
                    return html2canvas(element, {
                        backgroundColor: null,
                        scale: scaleFactor,
                        useCORS: true,
                        allowTaint: true,
                        logging: false,
                        width: element.offsetWidth,
                        height: element.offsetHeight,
                        windowWidth: element.scrollWidth,
                        windowHeight: element.scrollHeight,
                        imageTimeout: 0,
                        onclone: function(clonedDoc, clonedElement) {
                            const wrappers = clonedElement.querySelectorAll('.logo-20, .logo-24');
                            wrappers.forEach(wrapper => {
                                const isSmall = wrapper.classList.contains('logo-20');
                                const size = isSmall ? '20px' : '24px';
                                wrapper.style.width = size;
                                wrapper.style.height = size;
                                wrapper.style.minWidth = size;
                                wrapper.style.minHeight = size;
                                wrapper.style.maxWidth = size;
                                wrapper.style.maxHeight = size;
                                wrapper.style.overflow = 'hidden';
                                wrapper.style.position = 'relative';
                                wrapper.style.display = 'inline-block';
                            });

                            const logos = clonedElement.querySelectorAll('.logo-20 img, .logo-24 img');
                            logos.forEach(img => {
                                img.style.position = 'absolute';
                                img.style.top = '50%';
                                img.style.left = '50%';
                                img.style.transform = 'translate(-50%, -50%)';
                                img.style.width = 'auto';
                                img.style.height = 'auto';
                                img.style.maxWidth = '100%';
                                img.style.maxHeight = '100%';
                                img.style.objectFit = 'contain';
                                img.style.display = 'block';
                            });

                            const indicators = clonedElement.querySelectorAll('.pos-indicator-img');
                            indicators.forEach(img => {
                                const size = window.innerWidth <= 600 ? '24px' : '28px';
                                img.style.width = size;
                                img.style.height = size;
                                img.style.minWidth = size;
                                img.style.minHeight = size;
                                img.style.maxWidth = size;
                                img.style.maxHeight = size;
                                img.style.objectFit = 'contain';
                            });
                        }
                    });
                })
                .then(canvas => {
                    const roundedCanvas = applyRoundedCorners(canvas, cornerRadius);

                    roundedCanvas.toBlob(function(blob) {
                        if (!blob) {
                            showToast("فشل في إنشاء الصورة!", false);
                            return;
                        }

                        if (navigator.share && navigator.canShare) {
                            const file = new File([blob], activeTab === 'fixtures' ?
                                `Matchweek_${currentRound}.png` :
                                `League_Standings_GW${currentRound}.png`, { type: 'image/png' });

                            const shareData = {
                                files: [file],
                                title: activeTab === 'fixtures' ?
                                    `نتائج الجولة ${currentRound}` :
                                    `ترتيب الدوري - الجولة ${currentRound}`
                            };

                            if (navigator.canShare(shareData)) {
                                navigator.share(shareData).then(() => {
                                    showToast("تم حفظ الصورة في الألبوم ✓", true);
                                }).catch((err) => {
                                    if (err.name !== 'AbortError') {
                                        fallbackDownload(blob);
                                    } else {
                                        showToast("تم الإلغاء", false);
                                    }
                                });
                            } else {
                                fallbackDownload(blob);
                            }
                        } else {
                            fallbackDownload(blob);
                        }
                    }, 'image/png', 1.0);
                })
                .catch(err => {
                    console.error('html2canvas error:', err);
                    showToast("حدث خطأ أثناء تحضير الصورة!", false);
                });
        }

        function fallbackDownload(blob) {
            const link = document.createElement('a');
            link.download = activeTab === 'fixtures' ?
                `Matchweek_${currentRound}.png` :
                `League_Standings_GW${currentRound}.png`;
            link.href = URL.createObjectURL(blob);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => {
                URL.revokeObjectURL(link.href);
                showToast("تم تحميل الصورة ✓", true);
            }, 100);
        }

        setInterval(() => {
            if (Object.keys(scoresStorage).length > 0) {
                localStorage.setItem('fpl_scores', JSON.stringify(scoresStorage));
            }
        }, 5000);

        initRoundDropdown();
        renderFixtures();
        renderStandings();
    </script>
</body>
</html>
