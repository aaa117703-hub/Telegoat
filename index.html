<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TELEGRAM GOAT - Premier League</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @font-face {
            font-family: 'SultanCustom';
            src: url('./Sultan.ttf') format('truetype');
        }
        @font-face {
            font-family: 'EnglishCustom';
            src: url('./english-font.ttf') format('truetype');
        }

        :root {
            --pl-dark-bg: #240024;
            --pl-pink: #ff005a;
            --pl-purple-btn: #38003c;
            --text-white: #ffffff;
            --border-dark: #5a055a;
            --font-ar: 'SultanCustom', sans-serif;
            --font-en: 'EnglishCustom', sans-serif;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: var(--font-ar); 
        }

        body { 
            background-color: var(--pl-dark-bg); 
            color: var(--text-white); 
            padding-bottom: 40px; 
            width: 100%;
            max-width: 768px;
            margin: 0 auto;
            padding: 0 10px;
        }

        /* ===== حاوية البنر مع زر الموسيقى ===== */
        .banner-wrapper {
            position: relative;
            width: 100%;
            max-width: 768px;
            margin: 15px auto 0 auto;
        }

        /* ===== زر الموسيقى الحديث ===== */
        #musicToggle {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 20;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            outline: none;
        }
        #musicToggle:hover {
            background: rgba(255,255,255,0.2);
            border-color: #ff005a;
        }

        .banner-container {
            width: 100%;
            max-width: 768px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background-color: #240024;
            line-height: 0;
            text-align: center;
        }

        .banner-container img {
            width: 100%;
            height: auto;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .banner-overlay-tabs {
            position: absolute;
            bottom: 4%;
            right: 2%;
            display: flex;
            background: #5d8eb6; 
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            direction: rtl;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0;
            padding: 2px;
            max-width: 96%;
        }

        .banner-tab-btn, .banner-tab-select {
            background: transparent;
            color: #ffffff;
            border: none;
            padding: 8px 12px;
            font-family: var(--font-ar);
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex: 1 1 auto;
            min-width: 50px;
        }

        .banner-tab-btn:hover {
            background: rgba(0,0,0,0.15);
        }

        .banner-tab-btn.active {
            background: var(--pl-purple-btn);
        }

        .banner-tab-select {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 8px;
            padding-left: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="10" viewBox="0 0 24 24" width="10" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: left 6px center;
            border-left: 1px solid rgba(255,255,255,0.2);
            min-width: 60px;
        }

        .banner-tab-select option {
            background: var(--pl-purple-btn);
            color: #fff;
        }

        .admin-edit-btn {
            display: none !important;
        }
        .admin-edit-btn.visible {
            display: inline-flex !important;
        }

        .header { 
            background-color: var(--pl-dark-bg); 
            color: #ffffff; 
            padding: 5px 10px 15px 10px; 
            text-align: center; 
        }

        .round-nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 5px 0;
            flex-wrap: wrap;
        }

        .round-indicator {
            font-family: var(--font-en);
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            text-align: center;
        }

        .nav-arrow-btn {
            background: var(--pl-purple-btn);
            color: var(--text-white);
            border: 1px solid var(--border-dark);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .nav-arrow-btn:hover {
            background: var(--pl-pink);
            border-color: var(--pl-pink);
        }

        .main-container { 
            width: 100%; 
            max-width: 768px; 
            margin: 0 auto; 
            padding: 0 5px; 
        }

        #captureFixtures {
            padding: 20px 15px;
            background: linear-gradient(135deg, #3281ff 0%, #00d2ff 45%, #a835ff 100%), #4b92ff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 4px solid #ffffff;
        }

        .fixtures-header-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .fixtures-header-title {
            font-family: var(--font-en);
            font-size: 18px;
            font-weight: 900;
            color: #38003c;
            letter-spacing: 1px;
        }

        .fixture-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 8px 10px;
            margin-bottom: 6px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex-wrap: nowrap;
        }

        .team-box {
            font-family: var(--font-en);
            display: flex;
            align-items: center;
            width: 36%;
            font-size: 12px;
            font-weight: 800;
            color: #38003c;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .team-box.home { justify-content: flex-end; text-align: right; }
        .team-box.away { justify-content: flex-start; text-align: left; }
        
        .team-box img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            margin: 0 4px;
            background: transparent;
            border-radius: 0;
            padding: 0;
            flex-shrink: 0;
        }

        .match-score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 22%;
            background: #7138f5;
            padding: 4px 6px;
            border-radius: 6px;
            position: relative;
            min-width: 60px;
            flex-shrink: 0;
        }

        .score-display {
            font-family: var(--font-en);
            font-size: 13px;
            font-weight: 900;
            color: #ffffff;
        }

        .score-input {
            font-family: var(--font-en);
            width: 32px;
            height: 24px;
            text-align: center;
            font-size: 12px;
            font-weight: 900;
            background: #ffffff;
            color: #38003c;
            border: 1px solid #7138f5;
            border-radius: 4px;
            outline: none;
        }

        .spinner-small {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.6s linear infinite;
            margin-right: 3px;
        }

        .save-indicator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 900;
            color: #00ff87;
            margin-right: 3px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== جدول الترتيب ===== */
        #captureStandings {
            display: flex;
            flex-wrap: wrap;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 4px solid #ffffff;
            width: 100%;
        }

        .standings-sidebar {
            width: 130px;
            background: linear-gradient(180deg, #6c32f8 0%, #3281ff 50%, #10b981 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 8px;
            color: #ffffff;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-top-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .sidebar-round-text {
            font-family: var(--font-en);
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .sidebar-logo-center img {
            width: 55px;
            height: auto;
            max-height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
        }

        .sidebar-logo-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .sidebar-logo-text {
            font-family: var(--font-en);
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }

        .standings-content-area {
            flex: 1;
            background: #f4f5f7;
            overflow-x: auto;
            min-width: 200px;
            padding: 10px;
            display: block !important;
        }

        .standings-card { 
            background: transparent; 
            border-radius: 0; 
            overflow: visible; 
            padding: 5px;
            width: 100%;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: center; 
            font-size: 12px; 
            color: #333; 
            display: table !important;
        }
        
        th { 
            font-family: var(--font-en); 
            background-color: transparent; 
            color: #38003c; 
            padding: 10px 4px; 
            font-weight: 900; 
            border-bottom: 2px solid #38003c; 
            font-size: 12px;
        }

        td { 
            font-family: var(--font-en); 
            padding: 6px 4px; 
            border-bottom: 1px solid #e2e8f0; 
            font-weight: 800; 
            font-size: 12px;
        }
        
        .team-cell { 
            font-family: var(--font-en); 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            font-weight: 800; 
            text-transform: uppercase; 
            color: #1a1a1a;
            font-size: 12px;
        }
        
        .team-cell img { 
            width: 20px; 
            height: 20px; 
            margin-left: 6px; 
            object-fit: contain;
            background: transparent;
            border-radius: 0;
            padding: 0;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ===== تحسينات للشاشات الصغيرة (موبايل) ===== */
        @media screen and (max-width: 600px) {
            body {
                padding: 0 5px;
            }

            .banner-container {
                border-width: 3px;
                border-radius: 16px;
            }

            .banner-overlay-tabs {
                bottom: 4%;
                right: 1%;
                max-width: 98%;
                border-radius: 6px;
                padding: 3px 0;
                gap: 0;
            }

            .banner-tab-btn, .banner-tab-select {
                font-size: 10px;
                padding: 5px 6px;
                min-width: 35px;
                flex: 1 1 20%;
            }

            .banner-tab-select {
                min-width: 45px;
                padding-right: 6px;
                padding-left: 14px;
                background-size: 7px;
            }

            #musicToggle {
                width: 40px;
                height: 40px;
                font-size: 18px;
                top: 8px;
                right: 8px;
            }

            .round-indicator {
                font-size: 15px;
            }

            .nav-arrow-btn {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }

            #captureFixtures {
                padding: 15px 10px;
                border-radius: 16px;
                border-width: 3px;
            }

            .fixtures-header-title {
                font-size: 16px;
            }

            .fixture-row {
                padding: 6px 8px;
                flex-wrap: nowrap;
            }

            .team-box {
                font-size: 10px !important;
                width: 34%;
                letter-spacing: -0.2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .team-box img {
                width: 18px;
                height: 18px;
                margin: 0 3px;
            }

            .match-score-center {
                width: 24%;
                min-width: 50px;
                padding: 3px 4px;
            }

            .score-display {
                font-size: 11px;
            }

            .score-input {
                width: 26px;
                height: 18px;
                font-size: 10px;
            }

            #captureStandings {
                flex-direction: column;
                border-radius: 16px;
                border-width: 3px;
                overflow: hidden;
            }

            .standings-sidebar {
                width: 100%;
                flex-direction: row;
                padding: 10px;
                justify-content: space-around;
                flex-wrap: wrap;
                gap: 5px;
                border-radius: 16px 16px 0 0;
            }

            .standings-content-area {
                min-width: unset;
                width: 100%;
                padding: 5px;
                overflow-x: auto;
                display: block !important;
                border-radius: 0 0 16px 16px;
            }

            .standings-card {
                padding: 5px 0;
            }

            table {
                font-size: 10px;
                display: table !important;
                width: 100%;
            }

            th {
                font-size: 10px;
                padding: 6px 4px;
            }

            td {
                font-size: 10px;
                padding: 6px 4px;
            }

            .team-cell {
                font-size: 10px;
            }

            .team-cell img {
                width: 16px;
                height: 16px;
                margin-left: 4px;
            }
        }

        /* ===== تحسينات للشاشات المتوسطة (آيباد صغير) ===== */
        @media screen and (min-width: 601px) and (max-width: 768px) {
            .banner-tab-btn, .banner-tab-select {
                font-size: 11px;
                padding: 7px 10px;
            }

            .team-box {
                font-size: 11px;
            }

            .team-box img {
                width: 22px;
                height: 22px;
            }

            .score-display {
                font-size: 12px;
            }

            .score-input {
                width: 30px;
                height: 22px;
                font-size: 11px;
            }

            .standings-sidebar {
                width: 100px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== عنصر الصوت ===== -->
    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- ===== البنر مع زر الموسيقى ===== -->
    <div class="banner-wrapper">
        <button id="musicToggle" title="تشغيل/إيقاف الموسيقى">🔊</button>

        <div class="banner-container">
            <img id="bannerImg" src="image_5.png" alt="Premier League Banner" onerror="handleBannerError(this)">
            
            <div class="banner-overlay-tabs">
                <select class="banner-tab-select" id="roundSelect" onchange="selectRound(this.value)"></select>
                <button class="banner-tab-btn active" id="fixturesToggleBtn" onclick="switchTab('fixtures')">المواجهات</button>
                <button class="banner-tab-btn" id="standingsToggleBtn" onclick="switchTab('standings')">الترتيب</button>
                <button class="banner-tab-btn" onclick="downloadAsImage()">حفظ الصورة</button>
                <button class="banner-tab-btn admin-edit-btn" id="editToggleBtn" onclick="toggleEditMode()">تعديل</button>
            </div>
        </div>
    </div>

    <div class="header">
        <div class="round-nav-container">
            <button class="nav-arrow-btn" onclick="changeRound(-1)">&lt;</button>
            <div class="round-indicator" id="currentRoundTitle" ondblclick="unlockEditWithPassword()">MATCHWEEK 1</div>
            <button class="nav-arrow-btn" onclick="changeRound(1)">&gt;</button>
        </div>
    </div>

    <div class="main-container">

        <div id="fixturesTab" class="tab-content active">
            <div id="captureFixtures" class="export-area">
                <div class="fixtures-header-box">
                    <div class="fixtures-header-title" id="fixturesBannerTitle">MATCHWEEK RESULTS</div>
                </div>
                <div id="fixturesList"></div>
            </div>
        </div>

        <div id="standingsTab" class="tab-content">
            <div id="captureStandings" class="export-area">
                <div class="standings-sidebar">
                    <div class="sidebar-top-section">
                        <div class="sidebar-round-text" id="sidebarRoundText">GW 1</div>
                        <div class="sidebar-logo-center">
                            <img id="sidebarLogoImg" src="https://raw.githubusercontent.com/aaa117703-hub/Telegoat/04053eed0a5281bbf6625859ca6e9fc84451944f/Premier_league.png.svg" alt="شعار الدوري الإنجليزي الممتاز" onerror="handleLogoError(this)">
                        </div>
                    </div>
                    <div class="sidebar-logo-bottom">
                        <div class="sidebar-logo-text">TELEGOAT</div>
                    </div>
                </div>
                <div class="standings-content-area">
                    <div class="standings-card">
                        <table>
                            <thead>
                                <tr>
                                    <th>Pos</th>
                                    <th style="text-align: right; padding-right: 15px;">Club</th>
                                    <th>GF</th>
                                    <th>Pts</th>
                                </tr>
                            </thead>
                            <tbody id="standingsBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        // 1. FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            databaseURL: "https://telegram-goat-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // ============================================================
        // 2. STATE & VARIABLES
        // ============================================================
        let isAdmin = localStorage.getItem('fpl_admin') === 'true';
        let editMode = isAdmin;
        let scoresStorage = {};
        let currentRound = 1;
        let activeTab = 'fixtures';
        let isSaving = false;
        let migrationDone = false;

        // ============================================================
        // 3. BANNER & LOGO ERROR HANDLING
        // ============================================================
        let bannerAttempts = 0;
        const bannerSources = ["image_5.png", "image_5.PNG", "image_5.jpg", "image_5.JPG", "banner.png"];
        function handleBannerError(img) {
            bannerAttempts++;
            if (bannerAttempts < bannerSources.length) {
                img.src = bannerSources[bannerAttempts];
            } else {
                img.src = 'https://dummyimage.com/768x180/00bfff/fff&text=Banner+Missing';
            }
        }

        let logoAttempts = 0;
        const logoSources = ["https://raw.githubusercontent.com/aaa117703-hub/Telegoat/04053eed0a5281bbf6625859ca6e9fc84451944f/Premier_league.png.svg", "Premier_league_logo.png", "Premier_league_logo.PNG", "Premier_league_logo.webp", "logo.png", "banner.png"];
        function handleLogoError(img) {
            logoAttempts++;
            if (logoAttempts < logoSources.length) {
                img.src = logoSources[logoAttempts];
            } else {
                img.style.display = 'none';
            }
        }

        // ============================================================
        // 4. TEAMS MAP
        // ============================================================
        const teamsMap = {
            "ARS": { name: "Arsenal", logo: "arsenal.png.WEBP" },
            "AVL": { name: "Aston Villa", logo: "aston_villa.png.WEBP" },
            "BOU": { name: "Bournemouth", logo: "bournemouth.png.WEBP" },
            "BRE": { name: "Brentford", logo: "brentford.png.PNG" },
            "BHA": { name: "Brighton", logo: "brighton.png.WEBP" },
            "CHE": { name: "Chelsea", logo: "chelsea.png.WEBP" },
            "COV": { name: "Coventry", logo: "coventry.png.WEBP" },
            "CRY": { name: "Crystal Palace", logo: "crystal_palace.png.WEBP" },
            "EVE": { name: "Everton", logo: "everton.png.WEBP" },
            "FUL": { name: "Fulham", logo: "fulham.png.WEBP" },
            "HUL": { name: "Hull", logo: "hull.png.WEBP" },
            "IPS": { name: "Ipswich", logo: "ipswich.png.WEBP" },
            "LEE": { name: "Leeds", logo: "leeds.png.WEBP" },
            "LIV": { name: "Liverpool", logo: "liverpool.png.WEBP" },
            "MCI": { name: "Man City", logo: "man_city.png.WEBP" },
            "MUN": { name: "Man Utd", logo: "man_utd.png.WEBP" },
            "NEW": { name: "Newcastle", logo: "newcastle.png.WEBP" },
            "NOT": { name: "Nott'm Forest", logo: "forest.png.PNG" },
            "SUN": { name: "Sunderland", logo: "sunderland.png.WEBP" },
            "TOT": { name: "Spurs", logo: "tottenham.png.WEBP" }
        };

        const initialBasePoints = {};
        Object.keys(teamsMap).forEach(key => {
            initialBasePoints[key] = { gf: 0, pts: 0 };
        });

        // ============================================================
        // 5. MATCHWEEKS (1-38)
        // ============================================================
        const matchweeks = {
            1: [["ARS", "COV"], ["HUL", "MUN"], ["EVE", "CRY"], ["IPS", "SUN"], ["NOT", "LEE"], ["BRE", "TOT"], ["BHA", "AVL"], ["MCI", "BOU"], ["NEW", "LIV"], ["FUL", "CHE"]],

            24: [["BOU", "COV"], ["ARS", "AVL"], ["BHA", "LIV"], ["EVE", "NOT"], ["FUL", "IPS"], ["LEE", "HUL"], ["MUN", "CRY"], ["NEW", "TOT"], ["SUN", "BRE"], ["MCI", "LEE"]],
            25: [["AVL", "BOU"], ["BRE", "CRY"], ["COV", "ARS"], ["HUL", "MCI"], ["IPS", "EVE"], ["LEE", "SUN"], ["LIV", "FUL"], ["MUN", "NEW"], ["NOT", "BHA"], ["TOT", "CHE"]],
            26: [["BOU", "LEE"], ["BHA", "AVL"], ["CHE", "HUL"], ["CRY", "COV"], ["EVE", "LIV"], ["FUL", "NOT"], ["MCI", "BRE"], ["NEW", "MUN"], ["SUN", "IPS"], ["TOT", "ARS"]],
            27: [["AVL", "CHE"], ["BRE", "FUL"], ["COV", "CRY"], ["HUL", "BOU"], ["IPS", "BHA"], ["LEE", "EVE"], ["LIV", "MUN"], ["MUN", "MCI"], ["NOT", "SUN"], ["TOT", "NEW"]],
            28: [["ARS", "NOT"], ["BOU", "BRE"], ["BHA", "HUL"], ["CRY", "AVL"], ["EVE", "LEE"], ["FUL", "LIV"], ["MCI", "TOT"], ["NEW", "IPS"], ["SUN", "MUN"], ["CHE", "COV"]],

            30: [["BOU", "IPS"], ["BHA", "COV"], ["CHE", "ARS"], ["CRY", "MCI"], ["EVE", "BRE"], ["FUL", "HUL"], ["LEE", "AVL"], ["LIV", "NOT"], ["NEW", "FUL"], ["SUN", "TOT"]],
            31: [["ARS", "CRY"], ["AVL", "LEE"], ["BRE", "FUL"], ["COV", "EVE"], ["HUL", "LIV"], ["IPS", "CHE"], ["MCI", "BHA"], ["NOT", "MUN"], ["TOT", "BOU"], ["NEW", "MCI"]],
            32: [["BOU", "ARS"], ["BHA", "NOT"], ["CHE", "FUL"], ["CRY", "AVL"], ["EVE", "IPS"], ["FUL", "COV"], ["LEE", "TOT"], ["LIV", "BRE"], ["MUN", "HUL"], ["NEW", "MCI"]],
            33: [["ARS", "NEW"], ["AVL", "CRY"], ["BRE", "LEE"], ["COV", "BHA"], ["HUL", "CHE"], ["IPS", "BOU"], ["MCI", "LIV"], ["NOT", "EVE"], ["TOT", "MUN"], ["FUL", "NEW"]],
            34: [["BOU", "AVL"], ["BHA", "IPS"], ["CHE", "BRE"], ["CRY", "FUL"], ["EVE", "ARS"], ["FUL", "LEE"], ["LIV", "TOT"], ["MUN", "COV"], ["NEW", "HUL"], ["NOT", "MCI"]],
            35: [["ARS", "BHA"], ["AVL", "NOT"], ["BRE", "BOU"], ["COV", "CHE"], ["HUL", "CRY"], ["IPS", "MUN"], ["LEE", "LIV"], ["MCI", "EVE"], ["TOT", "FUL"], ["NEW", "FUL"]],
            36: [["BOU", "MUN"], ["BHA", "FUL"], ["CHE", "IPS"], ["CRY", "BRE"], ["EVE", "AVL"], ["FUL", "MCI"], ["LIV", "COV"], ["NEW", "LEE"], ["NOT", "TOT"], ["SUN", "ARS"]],
            37: [["ARS", "LIV"], ["AVL", "SUN"], ["BRE", "HUL"], ["COV", "BOU"], ["IPS", "CRY"], ["LEE", "CHE"], ["MCI", "NEW"], ["MUN", "NOT"], ["TOT", "EVE"], ["FUL", "BHA"]],
            38: [["BOU", "NOT"], ["BHA", "MUN"], ["CHE", "AVL"], ["CRY", "ARS"], ["EVE", "FUL"], ["HUL", "COV"], ["LEE", "BRE"], ["LIV", "IPS"], ["MCI", "SUN"], ["TOT", "NEW"]]
        };

        // ============================================================
        // 6. FUNCTIONS
        // ============================================================
        function initRoundDropdown() {
            const select = document.getElementById('roundSelect');
            select.innerHTML = '';
            for(let i=1; i<=38; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `الجولة ${i}`;
                if(i === currentRound) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function selectRound(val) {
            currentRound = parseInt(val);
            renderFixtures();
            updateSidebarRound();
        }

        function switchTab(tabName) {
            activeTab = tabName;
            document.getElementById('fixturesToggleBtn').classList.toggle('active', tabName === 'fixtures');
            document.getElementById('standingsToggleBtn').classList.toggle('active', tabName === 'standings');
            
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            if(tabName === 'standings') {
                renderStandings();
                updateSidebarRound();
                document.getElementById('standingsTab').classList.add('active');
            } else {
                document.getElementById('fixturesTab').classList.add('active');
            }
        }

        function updateSidebarRound() {
            document.getElementById('sidebarRoundText').innerText = `GW ${currentRound}`;
        }

        function unlockEditWithPassword() {
            const pass = prompt("أدخل رمز الحماية لتفعيل زر التعديل:");
            if (pass === "1999") {
                const editBtn = document.getElementById('editToggleBtn');
                editBtn.classList.add('visible');
                alert("تم إظهار زر التعديل بنجاح!");
            } else if (pass !== null) {
                alert("الرمز غير صحيح!");
            }
        }

        function toggleEditMode() {
            const btn = document.getElementById('editToggleBtn');
            if (!editMode) {
                editMode = true;
                btn.innerText = "حفظ";
                renderFixtures();
            } else {
                if (isSaving) return;
                const btnSave = document.getElementById('editToggleBtn');
                const originalHTML = btnSave.innerHTML;
                btnSave.innerHTML = `<span class="spinner-small"></span>`;
                btnSave.disabled = true;
                isSaving = true;

                const matches = matchweeks[currentRound] || [];
                const updates = {};
                matches.forEach((match, idx) => {
                    const homeInput = document.getElementById(`home_r${currentRound}_m${idx}`);
                    const awayInput = document.getElementById(`away_r${currentRound}_m${idx}`);
                    if (homeInput && awayInput) {
                        updates[`r${currentRound}_m${idx}_home`] = homeInput.value;
                        updates[`r${currentRound}_m${idx}_away`] = awayInput.value;
                    }
                });

                db.ref('fpl_scores').update(updates, (error) => {
                    isSaving = false;
                    btnSave.disabled = false;
                    if (error) {
                        alert("❌ فشل حفظ النتائج في السحابة! تأكد من الرابط وقواعد Firebase.");
                        btnSave.innerHTML = originalHTML;
                    } else {
                        btnSave.innerHTML = `✓`;
                        setTimeout(() => {
                            btnSave.innerHTML = originalHTML;
                        }, 1500);
                        editMode = false;
                        btnSave.innerText = "تعديل";
                        renderFixtures();
                        renderStandings();
                        alert("✅ تم حفظ النتائج في السحابة وعرضها للجميع!");
                    }
                });
            }
        }

        function updateScore(round, idx, type, val, inputElement) {
            scoresStorage[`r${round}_m${idx}_${type}`] = val;

            const center = inputElement.closest('.match-score-center');
            if (!center) return;

            let indicator = center.querySelector('.save-indicator');
            if (!indicator) {
                indicator = document.createElement('span');
                indicator.className = 'save-indicator';
                center.appendChild(indicator);
            }

            indicator.innerHTML = '<span class="spinner-small"></span>';
            indicator.style.color = '#ffffff';

            if (indicator._timeout) clearTimeout(indicator._timeout);

            indicator._timeout = setTimeout(() => {
                indicator.innerHTML = '✓';
                indicator.style.color = '#00ff87';
                indicator.style.fontWeight = '900';
                
                indicator._timeout = setTimeout(() => {
                    indicator.remove();
                }, 700);
            }, 400);
        }

        // ============================================================
        // 7. RENDER & CALCULATE
        // ============================================================
        function calculateStandings() {
            let calculated = {};
            for (let teamKey in initialBasePoints) {
                calculated[teamKey] = { key: teamKey, gf: 0, pts: 0 };
            }

            for (let round in matchweeks) {
                matchweeks[round].forEach((match, idx) => {
                    let hKey = match[0];
                    let aKey = match[1];
                    let hVal = scoresStorage[`r${round}_m${idx}_home`];
                    let aVal = scoresStorage[`r${round}_m${idx}_away`];

                    if (hVal !== undefined && aVal !== undefined && hVal !== '' && aVal !== '') {
                        let hScore = parseFloat(hVal);
                        let aScore = parseFloat(aVal);

                        calculated[hKey].gf += hScore;
                        calculated[aKey].gf += aScore;

                        if (hScore > aScore) {
                            calculated[hKey].pts += 3;
                        } else if (aScore > hScore) {
                            calculated[aKey].pts += 3;
                        } else if (hScore === aScore) {
                            calculated[hKey].pts += 1;
                            calculated[aKey].pts += 1;
                        }
                    }
                });
            }

            return Object.values(calculated).sort((a, b) => b.pts - a.pts || b.gf - a.gf);
        }

        function renderStandings() {
            const tbody = document.getElementById('standingsBody');
            tbody.innerHTML = '';
            
            let sortedTeams = calculateStandings();

            sortedTeams.forEach((team, index) => {
                let teamInfo = teamsMap[team.key] || { name: team.key, logo: "" };
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:900;">${index + 1}</td>
                        <td class="team-cell">
                            <img src="${teamInfo.logo}" alt="${teamInfo.name}">
                            ${teamInfo.name}
                        </td>
                        <td>${team.gf}</td>
                        <td style="color:#7138f5; font-size:12px;">${team.pts}</td>
                    </tr>
                `;
            });
        }

        function renderFixtures() {
            const list = document.getElementById('fixturesList');
            document.getElementById('currentRoundTitle').innerText = `MATCHWEEK ${currentRound}`;
            document.getElementById('roundSelect').value = currentRound;
            list.innerHTML = '';

            let matches = matchweeks[currentRound] || [];
            matches.forEach((match, idx) => {
                let home = teamsMap[match[0]] || { name: match[0], logo: "" };
                let away = teamsMap[match[1]] || { name: match[1], logo: "" };

                let homeScore = scoresStorage[`r${currentRound}_m${idx}_home`] ?? '';
                let awayScore = scoresStorage[`r${currentRound}_m${idx}_away`] ?? '';

                let scoreContent = editMode ? `
                    <input type="number" class="score-input" id="home_r${currentRound}_m${idx}" value="${homeScore}" placeholder="0" oninput="updateScore(${currentRound}, ${idx}, 'home', this.value, this)">
                    <span style="font-weight:900; color:#fff;">:</span>
                    <input type="number" class="score-input" id="away_r${currentRound}_m${idx}" value="${awayScore}" placeholder="0" oninput="updateScore(${currentRound}, ${idx}, 'away', this.value, this)">
                ` : `
                    <span class="score-display">${homeScore !== '' ? homeScore : '-'}</span>
                    <span style="font-weight:900; color:#ffffff; font-family: var(--font-en);">VS</span>
                    <span class="score-display">${awayScore !== '' ? awayScore : '-'}</span>
                `;

                list.innerHTML += `
                    <div class="fixture-row">
                        <div class="team-box home">
                            <span>${home.name}</span>
                            <img src="${home.logo}">
                        </div>
                        <div class="match-score-center">
                            ${scoreContent}
                        </div>
                        <div class="team-box away">
                            <img src="${away.logo}">
                            <span>${away.name}</span>
                        </div>
                    </div>
                `;
            });
        }

        function changeRound(step) {
            currentRound += step;
            if(currentRound < 1) currentRound = 1;
            if(currentRound > 38) currentRound = 38;
            renderFixtures();
            updateSidebarRound();
        }

        function downloadAsImage() {
            const targetId = activeTab === 'fixtures' ? 'captureFixtures' : 'captureStandings';
            const element = document.getElementById(targetId);

            html2canvas(element, {
                backgroundColor: activeTab === 'fixtures' ? null : "#ffffff",
                scale: 2,
                useCORS: true
            }).then(canvas => {
                canvas.toBlob(function(blob) {
                    let link = document.createElement('a');
                    link.download = activeTab === 'fixtures' ? `Matchweek_${currentRound}.png` : `League_Standings_GW${currentRound}.png`;
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    URL.revokeObjectURL(link.href);
                }, 'image/png');
            });
        }

        // ============================================================
        // 8. FIREBASE LISTENER + AUTO-MIGRATION
        // ============================================================
        db.ref('fpl_scores').once('value', (snapshot) => {
            const data = snapshot.val() || {};
            
            if (Object.keys(data).length === 0 && !migrationDone) {
                const localData = JSON.parse(localStorage.getItem('fpl_scores')) || {};
                if (Object.keys(localData).length > 0) {
                    db.ref('fpl_scores').update(localData, (error) => {
                        if (!error) {
                            migrationDone = true;
                            scoresStorage = localData;
                            renderFixtures();
                            renderStandings();
                            alert("✅ تم ترحيل نتائجك المحلية إلى السحابة! الآن جميع الزوار يشاهدونها.");
                        }
                    });
                } else {
                    scoresStorage = {};
                    renderFixtures();
                    renderStandings();
                }
            } else {
                scoresStorage = data;
                renderFixtures();
                renderStandings();
            }
        });

        db.ref('fpl_scores').on('child_changed', (snapshot) => {
            const key = snapshot.key;
            scoresStorage[key] = snapshot.val();
            renderFixtures();
            if (activeTab === 'standings') {
                renderStandings();
            }
        });

        // ============================================================
        // 9. زر الموسيقى
        // ============================================================
        const audioEl = document.getElementById('bgMusic');
        const toggleBtn = document.getElementById('musicToggle');
        let isPlaying = false;

        if (toggleBtn && audioEl) {
            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isPlaying) {
                    audioEl.pause();
                    toggleBtn.innerHTML = '🔇';
                    isPlaying = false;
                } else {
                    audioEl.play().catch(() => {});
                    toggleBtn.innerHTML = '🔊';
                    isPlaying = true;
                }
            });
        }

        // ============================================================
        // 10. INIT
        // ============================================================
        initRoundDropdown();
        updateSidebarRound();
    </script>
</body>
