<!DOCTYPE html>
<html>
<head>
    <title>Final Diagnosis</title>
    <!-- استدعاء مكتبة سوباس الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#111;color:#fff;padding:20px;font-family:monospace;">
    <h2>جاري الفحص الشامل...</h2>
    <div id="log" style="white-space: pre-wrap; font-size:14px; line-height: 1.8;"></div>

    <script>
        const logDiv = document.getElementById('log');
        function log(msg, color = '#fff') {
            logDiv.innerHTML += `<div style="color:${color}">${msg}</div>`;
            console.log(msg);
        }

        // الرابط والمفتاح من مشروع سيول (Telegoat-New)
        const SUPABASE_URL = 'https://vgnheydpxmmqfdibgqqa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnbmhleWRweG1tcWZkaWJncWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNTY0MzMsImV4cCI6MjEwNzgzMjQzM30.T-QzrIrDdPZeq97vjYBDYY2gBzyLhLqN_DcnKBxTDpI';

        async function runTest() {
            log('1. تهيئة مكتبة سوباس...');
            try {
                const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                log('✅ تم إنشاء العميل بنجاح', '#0f0');

                log('2. محاولة قراءة جدول (champions_cup_pins)...');
                const { data, error } = await sb.from('champions_cup_pins').select('*');
                
                if (error) {
                    log('❌ خطأ من سوباس: ' + error.message, '#f00');
                    log('تفاصيل: ' + JSON.stringify(error), '#f00');
                    if (error.message.includes('Could not find the table')) {
                        log('💡 الخلاصة: الجدول غير موجود في هذا المشروع (سيول)! يجب نقل الجداول إليه.', '#ff0');
                    }
                } else {
                    log('✅ نجح الاتصال وقراءة البيانات!', '#0f0');
                    log('عدد السجلات: ' + data.length, '#0f0');
                    if (data.length === 0) {
                        log('⚠️ الجدول موجود لكنه فارغ (0 سجل).', '#ff0');
                    }
                }
            } catch (e) {
                log('❌ خطأ فادح (Load failed): ' + e.message, '#f00');
            }
        }

        runTest();
    </script>
</body>
</html>
