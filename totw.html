<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TEAM OF THE WEEK - TELEGRAM GOAT</title>

<style>
@font-face{
    font-family:'SultanCustom';
    src:url('./Sultan.ttf') format('truetype');
}
@font-face{
    font-family:'EnglishCustom';
    src:url('./english-font.ttf') format('truetype');
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'EnglishCustom',sans-serif;
}

html{
    background:#240024;
}

body{
    background:#240024;
    color:#fff;
    width:100%;
    max-width:768px;
    margin:0 auto;
    padding:20px 10px 40px;
    min-height:100vh;
    overflow-x:hidden;
}

/* ============================================
   HEADER
============================================ */

.totw-header{
    text-align:center;
    margin-bottom:20px;
    padding:20px 16px;
    background:linear-gradient(135deg, #6b21a8 0%, #38003c 100%);
    border-radius:20px;
    border:3px solid #00ff87;
    box-shadow:
        0 0 30px rgba(0,255,135,.5),
        inset 0 1px 0 rgba(255,255,255,.15);
    position:relative;
    overflow:hidden;
}

.totw-header::before{
    content:'';
    position:absolute;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;
    background:radial-gradient(circle, rgba(0,255,135,.15) 0%, transparent 70%);
    animation:headerGlow 4s ease-in-out infinite;
}

@keyframes headerGlow{
    0%,100%{transform:-sizescale(1); opacity:.5;}
    50%{transform:scale(1.2); opacity:.8;}
}

.totw-title{
    font-size:28px;
    font-weight:900;
    color:#fff;
    letter-spacing:3px;
    text-transform:uppercase;
    text-shadow:0 4px 15px rgba(0,0,0,.6);
    margin-bottom:8px;
    position:relative;
    z-index:1;
}

.totw-sub:title{
    font14px;
    font-weight:700;
    color:#00ff87;
    letter-spacing:2px;
    text-transform:uppercase;
    position:relative;
    z-index:1;
    text-shadow:0 0 10px rgba(0,255,135,.6);
}

.totw-gw{
    font-size:12px;
    color:rgba(255,255,255,.7);
    margin-top:8px;
    font-weight:600;
    position:relative;
    z-index:1;
}

/* ============================================
   CONTROLS
============================================ */

.totw-controls{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    justify-content:center;
    flex-wrap:wrap;
}

.round-select{
    background:#38003c;
    border:2px solid #00ff87;
    border-radius:12px;
    padding:10px 18px;
    font-size:14px;
    font-weight:800;
    color:#fff;
    cursor:pointer;
    outline:none;
    min-width:140px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,255,135,.3);
}

.round-select option{
    background:#2d0a3d;
    color:#fff;
}

.refresh-btn{
    background:linear-gradient(135deg, #00e676 0%, #009b40 100%);
    color:#fff;
    border:2px solid #00ff87;
    border-radius:12px;
    padding:10px 20px;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
    letter-spacing:1px;
    text-transform:uppercase;
    box-shadow:0 0 15px rgba(0,255,135,.4);
    transition:all .25s ease;
}

.refresh-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px rgba(0,255,135,.7);
}

.refresh-btn:active{
    transform:scale(.96);
}

.refresh-btn.loading{
    opacity:.6;
    pointer-events:none;
}

/* ============================================
   PITCH
============================================ */

.pitch-wrapper{
    width:100%;
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.pitch{
    position:relative;
    width:100%;
    max-width:640px;
    aspect-ratio:2/3;
    background:
        radial-gradient(ellipse at 50% 20%, rgba(50,129,255,.15) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 80%, rgba(50,129,255,.15) 0%, transparent 60%),
        linear-gradient(180deg, #2e0b3d 0%, #38003c 50%, #2e0b3d 100%);
    border:3px solid #3281ff;
    border-radius:20px;
    box-shadow:
        0 0 40px rgba(50,129,255,.5),
        inset 0 0 80px rgba(0,0,0,.4);
    overflow:hidden;
}

.pitch::before{
    content:'';
    position:absolute;
    top:50%;
    left:0;
    right:0;
    height:3px;
    background:linear-gradient(90deg, transparent 0%, rgba(50,129,255,.7) 50%, transparent 100%);
    z-index:1;
    box-shadow:0 0 10px rgba(50,129,255,.6);
}

.pitch-circle{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:32%;
    aspect-ratio:1/1;
    border:3px solid rgba(50,129,255,.6);
    border-radius:50%;
    z-index:1;
    box-shadow:
        0 0 15px rgba(50,129,255,.4),
        inset 0 0 15px rgba(50,129,255,.2);
}

.pitch-box-top{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:55%;
    height:14%;
    border:3px solid rgba(50,129,255,.6);
    border-top:none;
    z-index:1;
    box-shadow:0 0 10px rgba(50,129,255,.3);
}

.pitch-box-top::before{
    content:'';
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:55%;
    height:45%;
    border:3px solid rgba(50,129,255,.6);
    border-top:none;
    z-index:1;
}

.pitch-box-bottom{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:55%;
    height:14%;
    border:3px solid rgba(50,129,255,.6);
    border-bottom:none;
    z-index:1;
    box-shadow:0 0 10px rgba(50,129,255,.3);
}

.pitch-box-bottom::before{
    content:'';
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:55%;
    height:45%;
    border:3px solid rgba(50,129,255,.6);
    border-bottom:none;
    z-index:1;
}

.pitch-players{
    position:relative;
    width:100%;
    height:100%;
    z-index:2;
    padding:4% 3%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

/* ============================================
   ROWS
============================================ */

.row{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    position:relative;
}

.row-1{
    justify-content:space-between;
    padding:0 8%;
    margin-top:2%;
}

.row-2{
    justify-content:space-between;
    padding:0 6%;
}

.row-3{
    justify-content:space-between;
    padding:0 2%;
}

.row-4{
    justify-content:center;
    margin-bottom:4%;
}

/* ============================================
   PLAYER CARD
============================================ */

.player-card{
    width:84px;
    min-height:100px;
    background-image:url('./card-bg.png');
    background-size:100% 100%;
    background-position:center;
    background-repeat:no-repeat;
    background-color:transparent;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:8px 6px;
    transition:transform .3s ease, filter .3s ease;
    position:relative;
    overflow:visible;
    filter:drop-shadow(0 0 10px rgba(0,255,135,.6));
}

.player-card:hover{
    transform:scale(1.1) translateY(-4px);
    filter:drop-shadow(0 0 20px rgba(0,255,135,.9));
    z-index:10;
}

.player-card .number{
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:26px;
    font-weight:900;
    margin-bottom:4px;
    text-shadow:
        0 0 8px rgba(0,0,0,.9),
        0 2px 4px rgba(0,0,0,.7);
    letter-spacing:1px;
    flex-shrink:0;
    line-height:1;
}

.player-card .name{
    color:#fff;
    font-size:11px;
    font-weight:700;
    text-align:center;
    line-height:1.15;
    letter-spacing:0.3px;
    word-break:break-word;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    text-shadow:
        0 1px 3px rgba(0,0,0,.9),
        0 0 4px rgba(0,0,0,.7);
    margin-top:2px;
}

.player-card .points{
    display:none;
}

/* ============================================
   LOADING
============================================ */

.loading-box{
    text-align:center;
    padding:40px 20px;
    color:#00ff87;
    font-size:16px;
    font-weight:900;
    letter-spacing:1px;
}

.loading-box .spinner{
    display:inline-block;
    width:40px;
    height:40px;
    border:4px solid rgba(0,255,135,.2);
    border-top-color:#00ff87;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin-bottom:16px;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.error-box{
    text-align:center;
    padding:30px 20px;
    background:rgba(255,0,90,.15);
    border:2px solid #ff005a;
    border-radius:12px;
    color:#ff005a;
    font-size:14px;
    font-weight:800;
}

/* ============================================
   FOOTER
============================================ */

.totw-footer{
    text-align:center;
    margin-top:30px;
    padding:16px;
    color:rgba(255,255,255,.5);
    font-size:12px;
    font-weight:600;
    letter-spacing:1px;
}

.totw-footer a{
    color:#00ff87;
    text-decoration:none;
}

/* ============================================
   MOBILE
============================================ */

@media(max-width:480px){

    .totw-title{
        font-size:22px;
        letter-spacing:2px;
    }

    .totw-subtitle{
        font-size:12px;
    }

    .totw-gw{
        font-size:11px;
    }

    .player-card{
        width:72px;
        min-height:86px;
        padding:6px 4px;
    }

    .player-card .number{
        font-size:22px;
    }

    .player-card .name{
        font-size:10px;
    }

    .row-1{
        padding:0 4%;
    }

    .row-2{
        padding:0 3%;
    }

    .row-3{
        padding:0 0%;
    }
}
</style>

</head>

<body>

<div class="totw-header">
    <div class="totw-title">⚽ TEAM OF THE WEEK ⚽</div>
    <div class="totw-subtitle">General League of TeleGoat</div>
    <div class="totw-gw" id="lastUpdate">Loading...</div>
</div>

<div class="totw-controls">
    <select id="gwSelect" class="round-select">
        <option value="5">Gameweek 5</option>
        <option value="4">Gameweek 4</option>
        <option value="3">Gameweek 3</option>
        <option value="2">Gameweek 2</option>
        <option value="1">Gameweek 1</option>
    </select>

    <button id="refreshBtn" class="refresh-btn" onclick="loadTOTW()">
        🔄 Refresh
    </button>
</div>

<div id="loadingBox" class="loading-box">
    <div class="spinner"></div>
    <div>Loading Team of the Week...</div>
</div>

<div id="pitchWrapper" class="pitch-wrapper" style="display:none;">
    <div class="pitch">
        <div class="pitch-circle"></div>
        <div class="pitch-box-top"></div>
        <div class="pitch-box-bottom"></div>

        <div class="pitch-players" id="pitchPlayers"></div>
    </div>
</div>

<div id="errorBox" class="error-box" style="display:none;"></div>

<div class="totw-footer">
    Made with ❤️ by <a href="https://aaa117703-hub.github.io/Telegoat/">TELEGRAM GOAT</a>
</div>

<script>

const WORKER_URL = 'https://fpl-api.aaa117703.workers.dev';
const TOTAL_PAGES = 7;

const NUMBERS = {
    GK: 1,
    DEF: [2, 4, 5, 12],
    MID: [6, 8, 10],
    FWD: [7, 9, 11]
};


async function fetchAllPages() {

    const allResults = [];

    for (let page = 1; page <= TOTAL_PAGES; page++) {

        try {

            const response = await fetch(WORKER_URL + '/?page=' + page);
            const data = await response.json();

            if (data && data.standings && data.standings.results) {

                allResults.push(...data.standings.results);

                if (data.standings.has_next === true) {
                    continue;
                } else {
                    break;
                }

            } else {
                break;
            }

        } catch (e) {
            console.error('Page ' + page + ' failed:', e);
            break;
        }
    }

    return allResults;
}


function getTop11(allResults) {

    const sorted = [...allResults].sort((a, b) => {
        return b.event_total - a.event_total;
    });

    return sorted.slice(0, 11);
}


function renderCards(top11) {

    const pitch = document.getElementById('pitchPlayers');

    if (!pitch) return;

    const forwards = top11.slice(0, 3);
    const midfielders = top11.slice(3, 6);
    const defenders = top11.slice(6, 10);
    const goalkeeper = top11.slice(10, 11);

    let html = '';

    /* الهجوم: جناح / رأس حربة / جناح */
    html += '<div class="row row-1">';
    html += createCard(forwards[1], NUMBERS.FWD[0]);
    html += createCard(forwards[0], NUMBERS.FWD[1]);
    html += createCard(forwards[2], NUMBERS.FWD[2]);
    html += '</div>';

    /* الوسط */
    html += '<div class="row row-2">';
    html += createCard(midfielders[0], NUMBERS.MID[0]);
    html += createCard(midfielders[1], NUMBERS.MID[1]);
    html += createCard(midfielders[2], NUMBERS.MID[2]);
    html += '</div>';

    /* الدفاع: ظهير / قلب / قلب / ظهير */
    html += '<div class="row row-3">';
    html += createCard(defenders[1], NUMBERS.DEF[3]);
    html += createCard(defenders[0], NUMBERS.DEF[1]);
    html += createCard(defenders[2], NUMBERS.DEF[2]);
    html += createCard(defenders[3], NUMBERS.DEF[0]);
    html += '</div>';

    /* الحارس */
    html += '<div class="row row-4">';
    html += createCard(goalkeeper[0], NUMBERS.GK);
    html += '</div>';

    pitch.innerHTML = html;
}


function createCard(player, number) {

    if (!player) {
        return '';
    }

    const name = player.player_name || player.entry_name || 'Unknown';

    return '<div class="player-card">' +
        '<div class="number">' + number + '</div>' +
        '<div class="name">' + name + '</div>' +
    '</div>';
}


async function loadTOTW() {

    const loadingBox = document.getElementById('loadingBox');
    const pitchWrapper = document.getElementById('pitchWrapper');
    const errorBox = document.getElementById('errorBox');
    const refreshBtn = document.getElementById('refreshBtn');
    const lastUpdate = document.getElementById('lastUpdate');

    loadingBox.style.display = 'block';
    pitchWrapper.style.display = 'none';
    errorBox.style.display = 'none';
    refreshBtn.classList.add('loading');

    try {

        const allResults = await fetchAllPages();

        if (!allResults || allResults.length === 0) {
            throw new Error('No data received');
        }

        const top11 = getTop11(allResults);

        renderCards(top11);

        const now = new Date();
        lastUpdate.textContent = 'Updated: ' + now.toLocaleString();

        loadingBox.style.display = 'none';
        pitchWrapper.style.display = 'flex';

    } catch (e) {

        console.error('TOTW Error:', e);

        loadingBox.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.textContent = '⚠️ Error loading data: ' + e.message;
    }

    refreshBtn.classList.remove('loading');
}


function changeGameweek() {
    loadTOTW();
}


document.addEventListener('DOMContentLoaded', function() {

    const gwSelect = document.getElementById('gwSelect');

    if (gwSelect) {
        gwSelect.addEventListener('change', changeGameweek);
    }

    loadTOTW();
});

</script>

</body>
</html>
