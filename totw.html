<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TEAM OF THE WEEK - TELEGRAM GOAT</title>

<style>
@font-face{
    font-family:'SultanCustom';
    src:url('./Sultan.ttf') format('truetype');
}
@font-face{
    font-family:'EnglishCustom';
    src:url('./english-font.ttf') format('truetype');
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'EnglishCustom',sans-serif;
}

html{
    background:#240024;
}

body{
    background:#240024;
    color:#fff;
    width:100%;
    max-width:768px;
    margin:0 auto;
    padding:20px 10px 40px;
    min-height:100vh;
    overflow-x:hidden;
}

.totw-header{
    text-align:center;
    margin-bottom:20px;
    padding:16px;
    background:linear-gradient(135deg, #6b21a8 0%, #38003c 100%);
    border-radius:16px;
    border:3px solid #00ff87;
    box-shadow:0 0 25px rgba(0,255,135,.4);
}

.totw-title{
    font-size:26px;
    font-weight:900;
    color:#fff;
    letter-spacing:2px;
    text-transform:uppercase;
    text-shadow:0 3px 10px rgba(0,0,0,.5);
    margin-bottom:6px;
}

.totw-subtitle{
    font-size:15px;
    font-weight:700;
    color:#00ff87;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.totw-gw{
    font-size:13px;
    color:rgba(255,255,255,.7);
    margin-top:6px;
    font-weight:600;
}

.totw-controls{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    justify-content:center;
    flex-wrap:wrap;
}

.round-select{
    background:#38003c;
    border:2px solid #00ff87;
    border-radius:12px;
    padding:10px 18px;
    font-size:14px;
    font-weight:800;
    color:#fff;
    cursor:pointer;
    outline:none;
    min-width:120px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,255,135,.3);
}

.round-select option{
    background:#2d0a3d;
    color:#fff;
}

.refresh-btn{
    background:linear-gradient(135deg, #00e676 0%, #009b40 100%);
    color:#fff;
    border:2px solid #00ff87;
    border-radius:12px;
    padding:10px 20px;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
    letter-spacing:1px;
    text-transform:uppercase;
    box-shadow:0 0 15px rgba(0,255,135,.4);
    transition:all .25s ease;
}

.refresh-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px rgba(0,255,135,.7);
}

.refresh-btn:active{
    transform:scale(.96);
}

.refresh-btn.loading{
    opacity:.6;
    pointer-events:none;
}

.pitch-wrapper{
    width:100%;
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.pitch{
    position:relative;
    width:100%;
    max-width:640px;
    aspect-ratio:2/3;
    background:linear-gradient(180deg, #2e0b3d 0%, #38003c 50%, #2e0b3d 100%);
    border:3px solid #3281ff;
    border-radius:16px;
    box-shadow:
        0 0 30px rgba(50,129,255,.4),
        inset 0 0 60px rgba(0,0,0,.3);
    overflow:hidden;
}

.pitch::before{
    content:'';
    position:absolute;
    top:50%;
    left:0;
    right:0;
    height:2px;
    background:rgba(50,129,255,.5);
    z-index:1;
}

.pitch-circle{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:30%;
    aspect-ratio:1/1;
    border:2px solid rgba(50,129,255,.5);
    border-radius:50%;
    z-index:1;
}

.pitch-box-top{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:50%;
    height:15%;
    border:2px solid rgba(50,129,255,.5);
    border-top:none;
    z-index:1;
}

.pitch-box-top::before{
    content:'';
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:55%;
    height:50%;
    border:2px solid rgba(50,129,255,.5);
    border-top:none;
    z-index:1;
}

.pitch-box-bottom{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:50%;
    height:15%;
    border:2px solid rgba(50,129,255,.5);
    border-bottom:none;
    z-index:1;
}

.pitch-box-bottom::before{
    content:'';
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:55%;
    height:50%;
    border:2px solid rgba(50,129,255,.5);
    border-bottom:none;
    z-index:1;
}

.pitch-players{
    position:relative;
    width:100%;
    height:100%;
    z-index:2;
    padding:4% 3%;
    display:flex;
    flex-direction:column;
    justify-content:space-around;
}

.row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    width:100%;
}

.row-1{
    justify-content:center;
    margin-top:2%;
}

.row-2{
    justify-content:space-around;
    padding:0 4%;
}

.row-3{
    justify-content:center;
    gap:25px;
}

.row-4{
    justify-content:center;
    gap:25px;
}

.player-card{
    width:80px;
    min-height:92px;
    background:linear-gradient(135deg, #38003c 0%, #2e0b3d 100%);
    border:2px solid #00ff87;
    border-radius:14px;
    box-shadow:
        0 0 12px rgba(0,255,135,.5),
        0 4px 10px rgba(0,0,0,.4);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6px 4px;
    transition:transform .25s ease, box-shadow .25s ease;
    position:relative;
    overflow:hidden;
}

.player-card:hover{
    transform:scale(1.1);
    box-shadow:
        0 0 25px rgba(0,255,135,.8),
        0 6px 15px rgba(0,0,0,.5);
    z-index:10;
}

.player-card .number{
    display:flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    background:linear-gradient(135deg, #7138f5 0%, #6b21a8 100%);
    border:2px solid #00ff87;
    border-radius:50%;
    color:#fff;
    font-size:14px;
    font-weight:900;
    margin-bottom:5px;
    box-shadow:0 0 8px rgba(0,255,135,.5);
    flex-shrink:0;
}

.player-card .name{
    color:#fff;
    font-size:9px;
    font-weight:800;
    text-align:center;
    line-height:1.15;
    letter-spacing:0.2px;
    word-break:break-word;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
}

.player-card .points{
    color:#00ff87;
    font-size:11px;
    font-weight:900;
    margin-top:3px;
    letter-spacing:0.5px;
    flex-shrink:0;
}

.loading-box{
    text-align:center;
    padding:40px 20px;
    color:#00ff87;
    font-size:16px;
    font-weight:900;
    letter-spacing:1px;
}

.loading-box .spinner{
    display:inline-block;
    width:40px;
    height:40px;
    border:4px solid rgba(0,255,135,.2);
    border-top-color:#00ff87;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin-bottom:16px;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.error-box{
    text-align:center;
    padding:30px 20px;
    background:rgba(255,0,90,.15);
    border:2px solid #ff005a;
    border-radius:12px;
    color:#ff005a;
    font-size:14px;
    font-weight:800;
}

.totw-footer{
    text-align:center;
    margin-top:30px;
    padding:16px;
    color:rgba(255,255,255,.5);
    font-size:12px;
    font-weight:600;
    letter-spacing:1px;
}

.totw-footer a{
    color:#00ff87;
    text-decoration:none;
}

@media(max-width:480px){

    .totw-title{
        font-size:20px;
        letter-spacing:1px;
    }

    .totw-subtitle{
        font-size:13px;
    }

    .totw-gw{
        font-size:11px;
    }

    .player-card{
        width:68px;
        min-height:80px;
        padding:5px 3px;
        border-radius:12px;
    }

    .player-card .number{
        width:26px;
        height:26px;
        font-size:12px;
        margin-bottom:4px;
    }

    .player-card .name{
        font-size:8px;
    }

    .player-card .points{
        font-size:10px;
    }

    .row{
        gap:5px;
    }

    .row-3,
    .row-4{
        gap:15px;
    }
}
</style>

</head>

<body>

<div class="totw-header">
    <div class="totw-title">⚽ TEAM OF THE WEEK ⚽</div>
    <div class="totw-subtitle">General League of TeleGoat</div>
    <div class="totw-gw" id="lastUpdate">Loading...</div>
</div>

<div class="totw-controls">
    <select id="gwSelect" class="round-select">
        <option value="5">Gameweek 5</option>
        <option value="4">Gameweek 4</option>
        <option value="3">Gameweek 3</option>
        <option value="2">Gameweek 2</option>
        <option value="1">Gameweek 1</option>
    </select>

    <button id="refreshBtn" class="refresh-btn" onclick="loadTOTW()">
        🔄 Refresh
    </button>
</div>

<div id="loadingBox" class="loading-box">
    <div class="spinner"></div>
    <div>Loading Team of the Week...</div>
</div>

<div id="pitchWrapper" class="pitch-wrapper" style="display:none;">
    <div class="pitch">
        <div class="pitch-circle"></div>
        <div class="pitch-box-top"></div>
        <div class="pitch-box-bottom"></div>

        <div class="pitch-players" id="pitchPlayers"></div>
    </div>
</div>

<div id="errorBox" class="error-box" style="display:none;"></div>

<div class="totw-footer">
    Made with ❤️ by <a href="https://aaa117703-hub.github.io/Telegoat/">TELEGRAM GOAT</a>
</div>

<script>

/* ============================================
   CONFIG
============================================ */

const WORKER_URL = 'https://fpl-api.aaa117703.workers.dev';
const TOTAL_PAGES = 7;

const NUMBERS = {
    GK: 1,
    DEF: [2, 4, 5, 12],
    MID: [6, 8, 10],
    FWD: [7, 9, 11]
};


/* ============================================
   FETCH ALL PAGES - جلب كل الصفحات
============================================ */

async function fetchAllPages() {

    const allResults = [];

    for (let page = 1; page <= TOTAL_PAGES; page++) {

        try {

            const response = await fetch(WORKER_URL + '/?page=' + page);

            const data = await response.json();

            if (data && data.standings && data.standings.results) {

                allResults.push(...data.standings.results);

                if (data.standings.has_next === true) {
                    continue;
                } else {
                    break;
                }

            } else {

                break;
            }

        } catch (e) {

            console.error('Page ' + page + ' failed:', e);
            break;
        }
    }

    return allResults;
}


/* ============================================
   SORT & GET TOP 11
============================================ */

function getTop11(allResults) {

    const sorted = [...allResults].sort((a, b) => {
        return b.event_total - a.event_total;
    });

    return sorted.slice(0, 11);
}


/* ============================================
   RENDER CARDS
============================================ */

function renderCards(top11) {

    const pitch = document.getElementById('pitchPlayers');

    if (!pitch) return;

    const forwards = top11.slice(0, 3);
    const midfielders = top11.slice(3, 6);
    const defenders = top11.slice(6, 10);
    const goalkeeper = top11.slice(10, 11);

    let html = '';

    /* Row 1 — المهاجمون (أعلى) */
    html += '<div class="row row-1">';
    forwards.forEach((player, i) => {
        html += createCard(player, NUMBERS.FWD[i]);
    });
    html += '</div>';

    /* Row 2 — الوسط */
    html += '<div class="row row-2">';
    midfielders.forEach((player, i) => {
        html += createCard(player, NUMBERS.MID[i]);
    });
    html += '</div>';

    /* Row 3 — الدفاع */
    html += '<div class="row row-3">';
    defenders.forEach((player, i) => {
        html += createCard(player, NUMBERS.DEF[i]);
    });
    html += '</div>';

    /* Row 4 — الحارس (أسفل) */
    html += '<div class="row row-4">';
    goalkeeper.forEach((player) => {
        html += createCard(player, NUMBERS.GK);
    });
    html += '</div>';

    pitch.innerHTML = html;
}


/* ============================================
   CREATE CARD
============================================ */

function createCard(player, number) {

    const name = player.player_name || player.entry_name || 'Unknown';

    return '<div class="player-card">' +
        '<div class="number">' + number + '</div>' +
        '<div class="name">' + name + '</div>' +
        '<div class="points">' + player.event_total + ' pts</div>' +
    '</div>';
}


/* ============================================
   LOAD TOTW
============================================ */

async function loadTOTW() {

    const loadingBox = document.getElementById('loadingBox');
    const pitchWrapper = document.getElementById('pitchWrapper');
    const errorBox = document.getElementById('errorBox');
    const refreshBtn = document.getElementById('refreshBtn');
    const lastUpdate = document.getElementById('lastUpdate');

    loadingBox.style.display = 'block';
    pitchWrapper.style.display = 'none';
    errorBox.style.display = 'none';
    refreshBtn.classList.add('loading');

    try {

        const allResults = await fetchAllPages();

        if (!allResults || allResults.length === 0) {
            throw new Error('No data received');
        }

        const top11 = getTop11(allResults);

        renderCards(top11);

        const now = new Date();
        lastUpdate.textContent = 'Updated: ' + now.toLocaleString();

        loadingBox.style.display = 'none';
        pitchWrapper.style.display = 'flex';

    } catch (e) {

        console.error('TOTW Error:', e);

        loadingBox.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.textContent = '⚠️ Error loading data: ' + e.message;
    }

    refreshBtn.classList.remove('loading');
}


/* ============================================
   CHANGE GAMEWEEK
============================================ */

function changeGameweek() {

    const gw = document.getElementById('gwSelect').value;

    console.log('Gameweek changed to:', gw);

    loadTOTW();
}


/* ============================================
   INITIALIZE
============================================ */

document.addEventListener('DOMContentLoaded', function() {

    const gwSelect = document.getElementById('gwSelect');

    if (gwSelect) {
        gwSelect.addEventListener('change', changeGameweek);
    }

    loadTOTW();
});

</script>

</body>
</html>
