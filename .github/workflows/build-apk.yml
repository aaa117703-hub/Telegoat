name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: SDK
        run: |
          SM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          [ -x "$SM" ] || SM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SM --licenses >/dev/null || true
          $SM "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: GOAT-apk, path: android/app/build/outputs/apk/release/*.apk }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk GOAT.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk GOAT.apk --title "GOAT Android APK" --notes "Download GOAT.apk and install"
